<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 个人知识库 · 可交互知识网络</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#11141a; --line:#20262e;
    --fg:#c9d1d9; --fg-dim:#7d8590; --fw:#e6edf3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;cursor:grab}
  canvas.drag{cursor:grabbing}
  canvas.hot{cursor:pointer}

  /* ── 左上 HUD ── */
  #hud{position:fixed;top:22px;left:24px;pointer-events:none;user-select:none}
  #hud h1{font-size:16px;font-weight:600;color:var(--fw);letter-spacing:.5px}
  #hud .sub{font-size:12px;color:var(--fg-dim);margin-top:4px}
  #legend{margin-top:14px;display:flex;flex-direction:column;gap:6px}
  #legend div{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-dim)}
  #legend i{width:8px;height:8px;border-radius:50%;display:block;flex:none}
  #legend b{color:var(--fg);font-weight:500}

  /* ── 底部提示 / 悬停读数 ── */
  #hint{position:fixed;bottom:20px;left:24px;font-size:12px;color:#5b6472;user-select:none}
  #hint kbd{background:#1b2028;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font:11px/1.4 ui-monospace,monospace;color:var(--fg-dim)}
  #peek{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    background:#161a21;border:1px solid var(--line);border-radius:99px;
    padding:5px 14px;font-size:12px;color:var(--fg);white-space:nowrap;
    opacity:0;transition:opacity .14s;pointer-events:none;
  }
  #peek.on{opacity:1}
  #peek em{color:var(--fg-dim);font-style:normal;margin-left:7px}

  #tools{position:fixed;bottom:20px;right:24px;display:flex;gap:8px}
  #tools button{
    background:#161a21;border:1px solid var(--line);color:var(--fg-dim);
    border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;
  }
  #tools button:hover{background:#1d232c;color:var(--fw);border-color:#2d353f}
  #tools button.act{color:var(--fw);border-color:#3b444f;background:#1d232c}

  /* ── 右侧内容面板 ── */
  #panel{
    position:fixed;top:0;right:0;height:100%;width:440px;max-width:88vw;
    background:var(--panel);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;z-index:5;
  }
  #panel.open{transform:translateX(0)}
  #pbar{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex:none}
  #psec{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid currentColor;flex:none}
  #ptitle{font-size:14px;color:var(--fw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #pclose{margin-left:auto;background:none;border:none;color:var(--fg-dim);font-size:20px;line-height:1;cursor:pointer;padding:0 2px;flex:none}
  #pclose:hover{color:var(--fw)}
  #pbody{padding:22px 24px 60px;overflow-y:auto;flex:1;font-size:13.5px;line-height:1.78}
  #pbody::-webkit-scrollbar{width:9px}
  #pbody::-webkit-scrollbar-thumb{background:#252c35;border-radius:9px}

  /* 正文排版 */
  #pbody h1{font-size:20px;color:var(--fw);margin:0 0 14px;line-height:1.4}
  #pbody h2{font-size:15px;color:var(--fw);margin:26px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  #pbody h3{font-size:13.5px;color:var(--fw);margin:20px 0 8px}
  #pbody h4,#pbody h5,#pbody h6{font-size:13px;color:var(--fg);margin:16px 0 6px}
  #pbody p{margin:0 0 11px}
  #pbody ul,#pbody ol{margin:0 0 11px;padding-left:20px}
  #pbody li{margin-bottom:4px}
  #pbody hr{border:none;border-top:1px solid var(--line);margin:20px 0}
  #pbody blockquote{border-left:2px solid #2d3742;margin:0 0 11px;padding:2px 0 2px 13px;color:var(--fg-dim)}
  #pbody blockquote p:last-child{margin-bottom:0}
  #pbody code{
    font:12px/1.5 ui-monospace,"SFMono-Regular",Consolas,monospace;
    background:#1b2028;border-radius:4px;padding:1.5px 5px;color:#a5d6ff;
  }
  #pbody pre{background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:13px 15px;overflow-x:auto;margin:0 0 13px}
  #pbody pre code{background:none;padding:0;font-size:11.5px;line-height:1.62;color:#c9d1d9;white-space:pre}
  #pbody table{border-collapse:collapse;width:100%;margin:0 0 13px;font-size:12.5px}
  #pbody th,#pbody td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
  #pbody th{background:#161a21;color:var(--fw);font-weight:600}
  #pbody strong{color:var(--fw);font-weight:600}
  #pbody a{color:#58a6ff;text-decoration:none}
  #pbody a:hover{text-decoration:underline}
  #pbody a.wl{color:#39c5cf;border-bottom:1px dashed rgba(57,197,207,.45);cursor:pointer}
  #pbody a.wl:hover{color:#7ee7ef;border-bottom-color:#7ee7ef}
  #pbody .dead{color:#6e7681;text-decoration:line-through;text-decoration-color:#3d444d}


  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>

\n- [[n8n-masterclass]] — n8n AI 自动化大师课：从表单到 RAG 企业级工作流\n- [[n8n-agent-tutorial]] — n8n 草履虫教程：用 DeepSeek 搭建个人新闻日程早报 Agent\n- [[pm-course]] — 项目管理五大过程组与敏捷 Scrum 框架课程解析\n- [[workbuddy-tutorial]] — WorkBuddy 保姆级教程：零门槛桌面 Agent 的界面/专家/技能/MCP/自动化全功能拆解\n\n---\n\n## Entities（实体）\n\n### 公司/组织\n- [[Google]] — 全球领先的科技公司，Gemini 模型开发者\n- [[Anthropic]] — AI 安全研究公司，Claude 模型开发者\n\n### 模型/产品\n- [[Gemini]] — Google 的大型语言模型家族\n- [[Claude]] — Anthropic 的大型语言模型家族\n- [[Claude_Code]] — Anthropic 推出的终端原生 AI 编程代理工具\n\n### 平台/工具\n- [[ClawHub]] — Claude Code Skills 市场平台\n- [[Dot_Skill]] — 人设蒸馏类 Skill，可将对话记录转化为 AI 模拟体\n- [[Obsidian]] — 本地 Markdown 知识管理与笔记应用，天然适合与 AI 配合使用\n- [[OpenCode]] — 开源 AI 编码代理桌面客户端，支持免费模型与 MCP 集成\n- [[LangGraph]] — 有状态多Agent工作流编排框架\n- [[n8n]] — 开源低代码可视化节点式 AI 自动化与工作流平台（\"AI 自动化的瑞士军刀\"）\n- [[DeepSeek]] — 中国 AI 公司，提供极低成本的 LLM API（V3/R1 模型）\n- [[飞书]] — 字节跳动企业协作平台，AI Agent 的数据源与通知终端\n- [[WorkBuddy]] — 国产桌面端 AI Agent（Codex 国内平替），新手友好的全场景工作自动化工具\n\n---\n\n## Concepts（概念）\n\n### 核心概念\n- [[LLM]] — 大语言模型：AI 系统的智能引擎与核心大脑\n- [[Memory]] — 记忆机制：为 Agent 提供跨对话的信息持久化能力\n- [[Prompt_Engineering]] — 提示工程：设计与优化 LLM 输入的技术学科\n- [[Tool_Use]] — 工具调用：让 LLM 从文本生成器转变为行动决策器\n- [[Context_Engineering]] — 上下文工程：从单个提示到系统上下文管理的范式转变\n\n### 提示技术\n- [[Zero_Shot_Prompting]] — 零样本提示：无示例直接提问\n- [[Few_Shot_Prompting]] — 少样本提示：通过示例引导模型\n- [[Chain_of_Thought]] — 思维链：要求模型展示推理步骤\n\n### 提示框架\n- [[5C_Framework]] — 5C Prompt Contract：极简、token高效的提示设计框架\n- [[APE_Framework]] — APE 框架：Action + Purpose + Expectation\n- [[CO-STAR_Framework]] — CO-STAR 框架：内容创作专用框架\n- [[RISEN_Framework]] — RISEN 框架：复杂多步骤任务框架\n- [[CRAFT_Framework]] — CRAFT 框架：Context + Role + Action + Format + Tone\n- [[POWER_Framework]] — POWER 框架：Purpose + Output + Working + Examples + Refinement\n\n### 高级技术\n- [[ReAct]] — ReAct：推理与行动结合的代理范式\n- [[Tree_of_Thoughts]] — 思维树：同时探索多条推理路径\n- [[RAG]] — 检索增强生成：结合外部知识库\n\n### AI 工程\n- [[Agent_n8n_Backend]] — AI Agent + n8n 后端执行器：Agent 决策 + n8n 稳定执行的架构模式\n- [[AI_Led_vs_AI_Assisted]] — AI 主导 vs AI 辅助：生产工作中 AI 角色定位的分类框架\n- [[AI_Skill_Distillation]] — AI 技能蒸馏：将特定人物的知识体系蒸馏为 AI 模型或 Skill\n- [[Claude_Code_Configuration]] — Claude Code 的六大配置组件体系（Skills/Agents/Commands/Rules/Hooks/MCP）\n- [[多Agent工作流]] — 多Agent流水线与图结构协作架构模式\n- [[Skill]] — Agent 技能机制：SOP 固化\"怎么干活\"，支持显性/隐性调用与流程技能化\n\n---\n\n## Syntheses（综合分析）\n\n- [[Agent]] — AI Agent 全面理解：五大核心能力与三大组件架构\n- [[n8n工作流搭建]] — Claude Code + n8n MCP vs 纯 n8n vs 纯 Agent：四种方案对比及执行路线图\n- [[prompt]] — 基于 5C Framework 的 Markdown 知识笔记撰写提示词模板\n- [[知识库建设蓝图]] — 个人 Obsidian 知识库的结构设计、分类原则与 AI 协作工作流\n\n（待创建：框架对比分析、模型特性对比等）\n\n---\n\n## Projects（实战项目）\n\n### 项目本体\n- [[AI-Agent-工作流实战]] — 当前核心项目：4–6 周内落地 2 个可用 Agent / 工作流\n- [[AI每日新闻]] — n8n 多源 RSS 聚合自动推送系统（量子位+TechCrunch+HackerNews → 邮件，已跑通含 Demo）★ **现状口径以此为准**\n- [[AI每日新闻/AI每日新闻项目复盘]] — 项目完整复盘（**2026-07 快照**，含已弃用的 DeepSeek 翻译架构，仅作技术记录）\n- [[AI每日新闻/AI每日新闻工作流-方案D流程图]] — 方案 D 架构设计图（**未落地的提案**，不是现状）\n- [[开发流程Personal AI PM Agent]] — 多 Agent 项目管理工作流的设计与落地流程\n\n## MOCs（内容地图）\n- [[MOC-AI-Agent]] — AI Agent 知识导航：概念、工具、来源与项目\n- [[MOC-Knowledge-Management]] — 知识管理导航：工具、方法论与技术实现\n- [[MOC-Prompt-Engineering]] — 提示工程导航：技术、框架与工程关联\n\n---\n","AI_Led_vs_AI_Assisted":"## 定义\n\nAI 主导 vs AI 辅助（AI-Led vs AI-Assisted）是影视飓风（Media Storm）在其生产工作流中使用的分类框架，用来界定 AI 在不同类型项目中的角色和参与程度。该框架将 AI 的应用场景分为两类——**AI 主导**以 AI 为主要创作者、人工为策展式参与；**AI 辅助**以人工为核心、AI 作为效率工具局部介入。\n\n## 核心框架\n\n| 维度 | AI 主导 (AI-Led) | AI 辅助 (AI-Assisted) |\n|------|------------------|----------------------|\n| **角色定位** | AI 作为主要创作者 | AI 作为效率工具 |\n| **人工参与度** | 低（策展式：选方案、决策方向） | 高（手工为主，AI 提速） |\n| **适用范围** | 实验型/探索型项目 | 成熟稳定型项目 |\n| **质量控制** | 后期筛选和人工打磨 | 全程人工把控 |\n| **风险等级** | 允许试错、风格探索 | 保证稳定输出 |\n| **典型用例** | AI 短片、AI 电影节作品 | 语音模型做节奏参考、AI 抠像、选题调研 |\n\n## 适用原则\n\n### 何时选择 AI 主导\n- 项目本身以探索 AI 能力边界为目标\n- 团队有容错空间和试错预算\n- 最终交付物不依赖真人 IP/形象\n- 创意方向不确定性高，需要快速迭代多种方案\n\n### 何时选择 AI 辅助\n- 交付物依赖真人 IP 和观众信任（如 Tim 出镜节目）\n- 质量要求稳定可预测\n- 传统工作流有明确瓶颈环节（如抠像、语音补录）\n- 只需在特定环节提效，不影响整体流程\n\n## 为什么需要这个区分\n\n> [!quote] 来自影视飓风的经验\n> \"AI 主导工作流目前只有短片组在用，别的部门目前都不允许来使用做 AI 主导。大部分频道的内容我们还在坚持手工古法打造。\"\n\n这个框架的价值在于：\n\n1. **风险隔离**——不让实验性的 AI 工作流影响核心产品的质量稳定性\n2. **效率聚焦**——在传统瓶颈环节精准投入 AI 能力，避免盲目全面 AI 化\n3. **团队适应**——渐进式引入 AI，让团队逐步掌握新工具而非被冲击\n4. **品牌信任**——对依赖真人 IP 的内容保持人工主导，维护受众的真实感\n\n## 扩展应用\n\n该框架不仅适用于视频制作，也可推广到其他 AI 整合场景：\n\n- **软件开发**：AI 主导（AI 全栈生成+人工审查）vs AI 辅助（Copilot 补全+人工编写）\n- **内容创作**：AI 主导（AI 写稿+人工编辑）vs AI 辅助（人工写稿+AI 润色）\n- **数据分析**：AI 主导（AI 自动生成报告+人工验证）vs AI 辅助（人工分析+AI 可视化）\n\n## 关联连接\n\n- [[workflow]] — 影视飓风 AI 工作流来源\n- [[Prompt_Engineering]] — 提示工程：AI 主导场景需精细提示设计\n- [[Claude_Code_Configuration]] — AI 代理的辅助 vs 主导配置\n- [[skills]] — Skills 作为 AI 辅助工具\n","AI_Skill_Distillation":"## 定义\n\nAI 技能蒸馏（AI Skill Distillation）是指将特定人物的对话记录、文档、邮件等数字痕迹作为训练数据，生成能够模拟该人物思维风格、表达习惯和专业知识的 AI 模型或 Skill 的过程。其本质是将隐性知识（Tacit Knowledge）从人类专家转移到 AI 代理。\n\n## 核心思想\n\n蒸馏的质量取决于输入数据的质量——数据越完整、越多样，蒸馏出的 AI 模拟越逼真。通过导入目标人物的技术文档、Code Review 记录、聊天记录、邮件等多源数据，AI 能学习到该人物的措辞习惯、思考框架和决策风格。\n\n## 应用场景\n\n### 1. 同事蒸馏（Colleague）\n- 导入技术文档和 Code Review 记录\n- 用于接口设计评审、技术方案咨询\n- 复刻工作能力和专业判断风格\n\n### 2. 人际关系蒸馏（Relationship）\n- 导入聊天记录（微信、飞书、钉钉、Slack）\n- 模拟前任、伴侣、父母的交流风格\n- 用于情感陪伴或沟通预演\n\n### 3. 名人蒸馏（Celebrity）\n- 基于公开演讲、著作、采访记录\n- 模拟乔布斯、马斯克等公众人物的思维方式\n- 用于获取特定视角的建议或创意启发\n\n## 典型工具\n\n- **Dot-Skill**（原名 colleague-skill）— Claude Code 生态中最著名的蒸馏类 Skill，GitHub 5 天获 7500 star，支持飞书/钉钉/Slack/微信聊天记录/PDF/邮件等数据源\n\n## 关联连接\n\n- [[Dot_Skill]] — 蒸馏类 Skill 的代表性工具\n- [[Claude_Code]] — Claude Code 的 Skills 扩展生态\n- [[ClawHub]] — Skills 市场平台\n- [[skills]] — 来源资料\n","Agent_n8n_Backend":"## 定义\n\nAgent + n8n 后端执行器模式是一种将 **AI Agent（智能体）** 与 **n8n 工作流引擎** 组合使用的架构设计。AI Agent 作为前端的灵活编排层负责决策和自然语言交互，n8n 作为后端执行器负责确定性、固定性的流程执行。两者通过 MCP 协议或 Webhook 通信，实现\"灵活决策 + 稳定执行\"的分离。\n\n## 架构模型\n\n```mermaid\ngraph LR\n    subgraph \"AI Agent 层\"\n    A[灵活决策<br/>自然语言交互<br/>任务拆解]\n    end\n    subgraph \"n8n 执行层\"\n    B[确定性执行<br/>固定流程编排<br/>Token 高效]\n    end\n\n    A -- \"MCP / Webhook\" --> B\n    B -- \"执行结果\" --> A\n```\n\n## 为什么需要这个模式\n\n### 纯 AI Agent 的痛点\n\n> [!warning] 纯 Agent 模式的三大问题\n> 1. **Token 消耗灾难级**：每天让 Agent 重复爬取数据、发送日报，每次都要完整推理\n> 2. **密钥安全风险**：API Key、数据库凭证直接暴露给第三方 Agent 服务\n> 3. **错误调试困难**：Agent 的执行是黑盒，出错难以定位原因\n\n### n8n + Agent 的解决方案\n\n| 痛点 | 解决方案 |\n|------|----------|\n| Token 消耗 | 固定流程一次封装到 n8n 工作流，执行几乎零 Token 成本 |\n| 密钥安全 | Credential 封装在 n8n 内部，对外只暴露 API 端点 |\n| 错误调试 | n8n 工作流精确到每个节点，出错直观可定位 |\n| 数据隐私 | 敏感数据在本地 n8n 流转，不经过第三方 Agent |\n| 重复任务 | 一次编排，反复执行，无需重新推理 |\n\n## 典型应用场景\n\n### 1. AI 资讯情报站\n- **Agent 职责**：理解用户需求 → 调度 n8n 工作流\n- **n8n 职责**：RSS 订阅 → AI 翻译整理 → 格式化 → 存入数据表格\n- **结果**：每日自动获取 DeepMind / OpenAI / Arxiv 最新论文并翻译\n\n### 2. 信息筛选与评分\n- **Agent 职责**：定义筛选标准\n- **n8n 职责**：爬取 Arxiv 论文 → AI 分析并打分 → 初级筛选\n- **结果**：从海量论文中自动筛选高价值内容\n\n### 3. 开发者 Blog 追踪\n- n8n 定时抓取 OpenAI / Google / Anthropic 官方 Blog\n- AI 翻译摘要后存入数据库\n- Agent 按需查询已整理的内容\n\n## 实施方式\n\n### 通过 MCP 协议（推荐）\n1. 在 n8n 中创建 API Key\n2. 在 AI Agent（Claude Code / OpenCode）中配置 n8n MCP 服务器\n3. Agent 通过 MCP 直接创建、修改、执行 n8n 工作流\n4. **用自然语言描述需求，Agent 自动编排工作流**\n\n### 通过 Webhook\n1. n8n 暴露 Webhook 端点\n2. Agent 通过 HTTP 请求触发 n8n 工作流\n3. n8n 执行完毕后回调 Agent\n\n## 社区共识\n\n> [!quote] \n> \"把固定性的流程编排成 n8n 工作流，与智能体结合使用，是目前社区普遍最认可的方式。\"\n\n这个模式正在成为 AI 工程领域的最佳实践——不把所有任务交给 AI Agent，而是让 AI Agent 做它最擅长的事（理解和决策），让 n8n 做它最擅长的事（稳定执行）。\n\n## 关联连接\n\n- [[claude-code-n8n-agent-integration]] — 从零搭建 n8n + AI Agent 集成\n- [[Claude_Code]] — Claude Code 产品\n- [[OpenCode]] — 开源 AI 编码代理替代方案\n- [[n8n-masterclass]] — n8n 低代码自动化平台\n- [[Claude_Code_Configuration]] — MCP 和 Skills 配置指南\n- [[AI_Led_vs_AI_Assisted]] — AI 主导 vs AI 辅助框架（该模式属于 AI 辅助的典型实现）\n- [[Tool_Use]] — 工具调用范式\n","Claude_Code_Configuration":"## 定义\n\nClaude Code 配置架构是指通过 Skills、Agents、Commands、Rules、Hooks、MCP 等组件对 Claude Code 进行个性化定制和功能扩展的系统化体系。Anthropic 官方黑客松冠军开源了一套业界标杆级配置（18 万+ Star），包含 48 个 Agent、182 个 Skill、68 个自定义命令。\n\n## 六大配置组件\n\n### 1. Skills（技能）\nSkills 是 Claude Code 的能力扩展单元，本质上是结构化 Markdown 文件。每个 Skill 包含：\n\n| 组成部分 | 说明 |\n|---------|------|\n| **名称与描述** | Skill 的名字和一句话说明 |\n| **触发条件** | 何时自动启用该 Skill |\n| **核心规则** | 行为准则和约束 |\n| **禁止项** | 明确禁止输出的内容 |\n| **工作流** | 完整的执行步骤流程 |\n| **结构指南** | 按不同类型分别规范 |\n| **嵌套 Skill** | 可调用其他 Skill |\n\nSkill 编写要点：不仅要告诉 AI 做什么，更要明确禁止做什么。通过\"实例→规则→禁止→流程→结构\"的层次化结构来控制输出质量。\n\n### 2. Agents（角色/身份）\nAgent 定义特定角色身份，包含：角色名称、描述、可用工具、提示词防御极限（能做什么/不能做什么）、专业领域的工作流程规范。定义好的角色可通过对话直接调用。\n\n典型示例：**Code Reviewer** — 高级代码审查员角色，定义了审查流程、关注点和输出规范。\n\n### 3. Commands（命令）\n斜杠命令（如 `/plan`）是将一系列操作封装为一个可执行命令的快捷方式。与 Skill 类似但更偏向执行而非知识指导。\n\n### 4. Rules（规则）\n按编程语言分类的编码规范和最佳实践。当需要生成特定语言的代码时，Claude Code 会自动参考对应的 Rules 文件。覆盖语言包括 Go、Java、C++、Python 等。\n\n### 5. Hooks（钩子）\n事件驱动的触发器，在特定操作之前或之后自动执行：\n\n| Hook 类型 | 触发时机 |\n|-----------|---------|\n| `pre-compact` | 执行 `/compact` 之前 |\n| `session-start` | 开启新会话之前 |\n| 其他 | 自定义事件绑定 |\n\nHook 让 Claude Code 的行为更加自动化、智能化，无需手动干预。\n\n### 6. MCP 配置\nModel Context Protocol 外部服务连接配置，用于扩展 Claude Code 的工具集。\n\n## 配置安装方式\n\n1. **Plugin 一键安装**：完整导入整个配置体系\n2. **按需复制**：推荐方式——克隆仓库后仅复制需要的 Skill 或 Agent 文件夹到本地 `.claude/` 目录\n\n## 设计理念\n\n这套配置体系体现了以下核心原则：\n- **模块化**：各组件职责单一，可独立复用\n- **渐进式**：从简单 Skill 到复杂 Agent，按需组合\n- **知识沉淀**：通过 Skills 将最佳实践固化为可复用资产\n- **自动化**：Hooks 和 Commands 减少重复性手动操作\n\n## 关联连接\n\n- [[Claude_Code]] — Claude Code 产品\n- [[hackathon-champion-config]] — 黑客松冠军配置详解来源\n- [[ClawHub]] — Skills 市场平台\n- [[AI_Skill_Distillation]] — AI 技能蒸馏概念\n- [[skills]] — 15 个实用 Skills 推荐\n","LLM":"# LLM (Large Language Model / 大语言模型)\n\n## 定义\n\n基于海量文本数据训练、具备强通用自然语言理解与生成能力的超大规模深度学习模型。\n\n## 核心思想\n\n通过在超大规模语料上进行“预测下一个 Token”（Next-token prediction）的自监督学习，模型在庞大的网络参数中“涌现”（Emergence）出推理、上下文学习和遵循指令等通用的智能行为。\n\n## 关键特征\n\n- **涌现能力 (Emergent Abilities)**：当模型参数和训练数据达到一定规模时，突然获得处理复杂逻辑、少样本学习等中小型模型不具备的能力。\n- **通用性**：不局限于单一任务，只需通过调整输入（Prompt）就能解决问答、翻译、编程、摘要等多种任务。\n- **基座作用**：作为“智能引擎”，提供理解意图、规划步骤和生成回复的能力。\n\n## 关联连接\n\n- [[Prompt_Engineering]]（通过设计特定的输入来精确引导 LLM 的行为）\n- [[RAG]]（解决 LLM 的幻觉问题、时效性不足和私有知识缺失）\n- [[Tool_Use]]（将 LLM 作为决策中心，由它来判断何时及如何调用外部工具）\n- [[AI-Agent]]（LLM 是 AI Agent 的核心“大脑”或控制器）\n","Memory":"# Memory (记忆机制)\n\n## 定义\n\n为大语言模型或 Agent 提供跨对话、跨时间保存与检索信息的能力。\n\n## 核心思想\n\n克服大模型单次交互中 Context Window（上下文窗口）的限制，让 AI 能够记住用户的偏好、历史对话细节以及长期沉淀的知识。\n\n## 主要分类\n\n- **短期记忆 (Short-term Memory)**：当前会话的上下文信息（通常随对话进行而被动态压缩或修剪）。\n- **长期记忆 (Long-term Memory)**：将交互历史或外部知识持久化存储在向量库或关系型数据库中，在需要时检索召回。\n\n## 关联连接\n\n- [[RAG]]（长期记忆的存储与检索通常采用 RAG 的技术架构）\n- [[AI-Agent]]（记忆是构建自主 Agent 的三大核心要素之一）\n- [[ReAct]]（推理和行动的历史轨迹会作为短期记忆的一部分参与决策）\n","Prompt_Engineering":"# Prompt Engineering (提示词工程)\n\n## 定义\n\n优化输入以引导大语言模型（LLM）生成期望输出的艺术与科学。\n\n## 核心思想\n\n通过结构化设计、提供上下文和明确指令，最大化释放预训练模型的潜力，减少幻觉并提高输出的确定性。\n\n## 关键技术\n\n- **Zero-Shot / Few-Shot**：不给示例或给出少数示例来引导模型理解任务。\n- **Chain of Thought (CoT)**：引导模型逐步思考，提升逻辑推理能力。\n- **System Prompt**：定义模型的基础角色、行为准则和安全边界。\n\n## 关联连接\n\n- [[RAG]]（检索到的上下文需要通过 Prompt 传递给模型）\n- [[ReAct]]（通过特定的 Prompt 模版引导模型进行“思考-行动”循环）\n- [[AI-Agent]]（Agent 的性格、工作流和边界由 Prompt 定义）\n","RAG":"# RAG (Retrieval-Augmented Generation / 检索增强生成)\n\n## 定义\n\n检索增强生成。\n\n## 核心思想\n\nLLM 生成前先检索外部知识，将检索到的相关信息作为上下文提供给模型，以此解决时效性差、专业领域知识缺失和幻觉问题。\n\n## 核心步骤\n\n1. **Indexing (索引)**：将外部知识库文档进行分块（Chunking）、向量化（Embedding）并存入向量数据库。\n2. **Retrieval (检索)**：根据用户提问（Query），在数据库中检索出相似度最高的相关文本块。\n3. **Generation (生成)**：将检索出的文本作为上下文（Context），与用户问题一起拼成 Prompt 喂给 LLM，生成最终回答。\n\n## 关联连接\n\n- [[Memory]]（检索到的外部知识可以看作是 Agent 的长期记忆）\n- [[Tool_Use]]（检索系统可以作为 LLM 调用的一项工具）\n- [[AI-Agent]]（RAG 是 Agent 获取垂直领域知识的核心手段）\n- [[Prompt_Engineering]]（检索结果的拼接与呈现高度依赖 Prompt 的设计）\n","ReAct":"# ReAct (Reason + Act / 推理与行动)\n\n## 定义\n\n结合协同推理（Reason）与行动（Act）的 AI Agent 构建框架。\n\n## 核心思想\n\n让大模型在执行复杂任务时交替进行“思考（Thought）”与“行动（Action）”，并观察行动结果（Observation），从而实现动态规划和错误纠正。\n\n## 经典循环\n\n```text\n思考 (Thought) -> 行动 (Action) -> 观察反馈 (Observation) -> 重复该过程，直至得出最终答案。\n```\n\n## 关联连接\n\n- [[AI-Agent]]（ReAct 是 Agent 实现自主\"推理—行动\"循环的基础范式）\n- [[Tool_Use]]（ReAct 中 \"Act\" 阶段的具体实现手段）\n- [[Memory]]（推理与行动的历史轨迹作为短期记忆参与后续决策）\n- [[Prompt_Engineering]]（ReAct 循环依赖特定的提示模板来引导）\n- [[多Agent工作流]]（ReAct 是单 Agent 自主决策的底层循环模式）\n","Skill":"## 定义\n\nSkill（技能）是一套预定义的提示词 + 流程规则（SOP），用于规定 AI Agent **\"怎么干活\"**。它把完成某类任务的最佳路径固化下来——步骤顺序、风格约束、术语规范、故障排除等——让 Agent 处理重复性任务时稳定、高效、不绕弯路。与之相对，专家（Persona Agent，即带人设的 Agent，见 [[WorkBuddy]]）回答的是\"谁来干活\"。\n\n## 为什么需要 Skill\n\nAgent 的默认工作逻辑是\"给定目标、自由探索路径\"，由此带来两个问题：\n1. **路径可能绕远**——不是解决问题的最优解；\n2. **结果不稳定**——同一任务每次走的路径不同，产出质量参差。\n\nSkill 相当于给员工一份作业标准书（SOP），约束 Agent 每次按你认可的最优路径执行，从而提升**稳定性与可复现性**。这尤其适用于经常做的重复性、流程性任务。\n\n## 调用方式\n\n| 方式 | 含义 | 特点 |\n|------|------|------|\n| **显性调用** | 用户手动安装/装载某 Skill 后再发任务 | AI 必须按该 Skill 执行，效果可控（如某 PPT Skill 约束字体/配色/动画/排版，产出风格统一） |\n| **隐性调用** | AI 识别用户意图后自动触发已安装 Skill | 类似关键词自动匹配，属概率性行为，非 100% 成功 |\n\n典型机制：Agent 接任务时会扫描自身已安装的技能列表，判断是否存在与任务匹配的 Skill，若有则倾向自动调用（隐性）；用户也可在任务开始前直接装载指定 Skill（显性）。\n\n## Skill 的两种来源\n\n1. **安装现成的**：从技能市场 / Skill Hub 搜索安装（PPT、数据分析、封面生成等），通常支持中文搜索、按类别浏览。\n2. **自己制作（流程蒸馏）**：在一个对话中让 AI 逐步跑通流程（如\"数据分析 → 可视化图表 → 生成 PPT\"）后，直接说\"把我刚才的流程做成技能\"，AI 会把已执行的流程封装为 Skill，下次一键调用、稳定复现。\n\n## 使用建议\n\n- 有强烈个人风格/审美（PPT 排版、配色、字体）或频繁重复的流程性工作，都值得做成 Skill 反复调用。\n- 不调用 Skill 时输出不稳定；显性调用可保证按你的审美与调性输出。\n- 与蒸馏类概念的边界：[[AI_Skill_Distillation]] 侧重\"把一个人的知识/人设蒸馏成 AI 模拟体\"（对象 = 人）；本页侧重\"把一套工作方法/流程蒸馏成 SOP 技能\"（对象 = 流程）。两者共同构成\"技能化\"的两种对象。\n\n## 关联连接\n\n- [[WorkBuddy]] — 内置技能市场、支持显性/隐性调用与流程技能化的产品\n- [[workbuddy-tutorial]] — 来源资料\n- [[skills]] — Claude Code 15 个实用 Skills 清单\n- [[Claude_Code]] — 通过 Skills 扩展能力的编程 Agent\n- [[ClawHub]] — Skills 市场平台\n- [[Claude_Code_Configuration]] — Skills 作为 Claude Code 六大配置组件之一\n- [[AI_Skill_Distillation]] — 人设/知识蒸馏类技能（互补概念）\n- [[多Agent工作流]] — 专家团（多 Agent 团队）中的技能分工\n","Tool_Use":"# Tool Use (工具使用 / 函数调用)\n\n## 定义\n\n允许大语言模型根据需求自主调用外部 API、计算器、代码执行器或数据库来解决问题。\n\n## 核心思想\n\n将大模型从单纯的“文本生成器”转变为“行动决策器”，通过调用外部工具拓展其能力边界，使其能够连接真实世界并获取实时数据。\n\n## 核心流程\n\n1. **定义工具**：向模型提供工具的结构化描述（如 JSON Schema，说明工具功能及所需参数）。\n2. **模型规划**：模型根据用户意图判断是否需要使用工具、使用哪个工具，并提取出调用参数。\n3. **执行与反馈**：系统执行该工具，并将结果（Observation）返回给模型，由模型整合后输出。\n\n## 关联连接\n\n- [[ReAct]]（ReAct 框架中“Act”阶段的具体实现手段）\n- [[AI-Agent]]（工具使用赋予了 Agent 改变外部环境和执行复杂任务的能力）\n- [[RAG]]（搜索引擎或本地知识库检索本质上也是 Agent 调用的一种检索工具）\n","多Agent工作流":"## 定义\n\n多Agent工作流是一种将多个 AI Agent 组织为流水线或图结构进行协作的架构模式。每个 Agent 负责特定子任务（采集、去重、聚类、摘要、审核等），通过状态传递和条件路由实现复杂业务流程的端到端自动化。这种模式将大任务逐步分解为多个小任务，每个小任务由专门的 Agent 处理，最终汇总为完整产出。\n\n## 核心架构\n\n### 流水线模式（Pipeline）\n\nAgent 按顺序执行，前一个 Agent 的输出作为后一个 Agent 的输入，形成线性处理链：\n\n```mermaid\ngraph LR\n    A[Agent A<br/>采集] --> B[Agent B<br/>预处理]\n    B --> C[Agent C<br/>去重]\n    C --> D[Agent D<br/>聚类]\n    D --> E[Agent E<br/>摘要]\n    E --> F[Agent F<br/>审核]\n    F --> G[Agent G<br/>组装]\n    G --> H[Agent H<br/>推送]\n```\n\n### 图模式（Graph）\n\n使用有状态图编排（如 [[LangGraph]]），支持更复杂的拓扑结构：\n- **并行**：多个采集 Agent 同时爬取不同新闻渠道\n- **条件分支**：审核不通过的研报返回摘要 Agent 重新处理\n- **聚合**：多个来源的数据汇聚到同一聚类 Agent\n- **循环**：支持反复迭代优化的闭环流程\n\n## 产品化形态：专家团（主理人 + 专家编排）\n\nConsumer 级 Agent 产品将多 Agent 协作封装为开箱即用的「专家团」形态（代表产品：[[WorkBuddy]]）。一个**主理人（负责人）Agent** 拆解任务并调度编排，把子任务分派给一组\"带人设 + 领域知识库\"的专家 Agent 接力执行，最终汇总交付。\n\n**典型分工（以数据分析专家团为例）：**\n\n| 成员 | 职责 |\n|------|------|\n| 数据编排师（主理人） | 拆解任务、编排计划、分派并串联各专家 |\n| 数据科学工程师 | 校验数据合理性/脏数据、完成清洗与分析 |\n| 可视化分析师 | 生成图表与交互式仪表盘 |\n| 知识检索 / SQL 架构师 | 检索数据背后的专业知识、处理数据库查询 |\n\n**与流水线/图模式的关系**：专家团本质是\"由主理人动态编排\"的图/流水线变体。区别在于开发者用 [[LangGraph]] 手写拓扑，而专家团的编排由主理人 Agent 自主完成，对非技术用户透明、零配置。\n\n**实践观察（WorkBuddy 同模型同任务实测：单专家 vs 专家团）**：单专家产出 ≈ 普通 Excel/表格，几乎无可视化；专家团约 27 分钟产出可视化仪表盘 + 结构化综合报告 + 行动建议。代价是耗时更长、若用非免费模型积分消耗更高——类似\"请专业外包团队，收费更高但质量更好\"。\n\n## 典型应用：智能研报流水线（八步模式）\n\n多Agent工作流的一个经典落地形态是「信息采集 → 内容生产」的智能研报流水线。该模式将新闻/资讯加工为结构化研报，其八步分工如下（此模式可复用于舆情监控、行业研报等场景）：\n\n| 步骤 | Agent 职责 | 关键设计 |\n|------|-----------|----------|\n| 采集 | 多源新闻爬取 | 采集频率可配置、增量采集（URL 缓存去重）、UA 交换+请求间隔反爬 |\n| 预处理 | 数据清洗与格式化 | 统一数据模型供下游 Agent 消费 |\n| 去重 | URL 和内容去重 | 基于缓存的增量去重，实测去重率约 21% |\n| 聚类 | 主题聚类分析 | 力导向图可视化，节点大小=重要性，连线=主题关联度 |\n| 摘要 | AI 内容摘要生成 | 使用大模型生成结构化摘要 |\n| 审核 | 研报质量审核 | AI 审核研报质量，不合格则打回重新处理 |\n| 组装 | 简报/研报组装 | 组装为每日简报（Top5+深度研报+行业动态）和深度研报 |\n| 推送 | 多格式导出推送 | Markdown、PDF 格式导出 |\n\n## 使用时机\n\n### 适合使用的场景\n- 任务包含多个明确可拆分的子步骤\n- 每个子步骤需要独立的 AI 推理和决策能力\n- 子步骤之间有明确的数据依赖关系\n- 需要内容生成、文本理解等 AI 核心能力\n\n### 不适合使用的场景\n- 简单的单步骤任务（单个 Agent 即可完成）\n- 纯确定性流程（应使用传统脚本或低代码平台）\n- 对 Token 成本极度敏感（可考虑 Agent + 执行器混合模式）\n\n## 知识冲突\n\n### 多Agent工作流 vs Agent + 后端执行器 两种路线对比\n\n| 维度 | 多Agent工作流 | Agent + 后端执行器 |\n|------|--------------|-------------------|\n| 代表实现 | [[LangGraph]]（图编排） | [[Agent_n8n_Backend]]（n8n 执行） |\n| 核心思路 | 所有步骤由 AI Agent 负责 | 决策层(Agent)与执行层(工具)分离 |\n| 决策能力 | 每个 Agent 独立推理决策 | 仅编排层使用 AI 决策 |\n| Token 消耗 | 较高（每个 Agent 独立推理） | 低（固定流程几乎零 Token 成本） |\n| 灵活性 | 极高（Agent 可灵活响应变化） | 中等（工作流需预先定义） |\n| 适用场景 | 内容生成密集型（研报写作、摘要等） | 规则明确的流程型（数据爬取、推送等） |\n\n**经验法则**：需要 AI 理解和创造的任务 → 多Agent工作流；需要稳定低成本执行的任务 → Agent+执行器模式。两者也可以混合使用，在同一个系统中对不同的子步骤采用不同的模式。\n\n## 关联连接\n\n- [[LangGraph]] — 有状态多Agent编排框架\n- [[Agent_n8n_Backend]] — Agent + n8n 后端执行器架构（互补模式）\n- [[n8n-masterclass]] — 低代码自动化平台\n- [[n8n-agent-tutorial]] — 从零构建 Agent 的实操教程\n- [[AI每日新闻]] — 同类 AI 新闻早报应用\n- [[AI_Led_vs_AI_Assisted]] — AI 主导 vs AI 辅助框架\n- [[WorkBuddy]] — 内置\"专家团\"的产品实体（主理人 + 专家编排形态）\n- [[workbuddy-tutorial]] — WorkBuddy 保姆级教程来源资料\n","Anthropic":"## 定义\n\nAnthropic 是一家专注于 AI 安全研究的美国人工智能公司，成立于 2021 年，由前 OpenAI 研究副总裁 Dario Amodei 及其妹妹 Daniela Amodei 等人创立。公司使命是开发可靠、可解释和可操控的 AI 系统。\n\n## 核心产品与产品\n\n### Claude 系列模型\nAnthropic 的旗舰大型语言模型家族：\n- **Claude 3/4 系列**：Haiku, Sonnet, Opus\n- 以强大的长上下文处理和细致推理能力著称\n- 强调 HHH 原则（Helpful, Harmless, Honest）\n\n### Claude API 与平台\n- **Claude API**：面向开发者的模型访问接口\n- **Claude Code**：智能编程助手\n- **Claude Enterprise**：企业级解决方案\n\n## 核心理念\n\n### Constitutional AI\nAnthropic 开发的 AI 训练方法：\n- 不仅依赖人类反馈，还使用一套原则（Constitution）指导模型行为\n- 目标是使 AI 更安全、更可控\n- 减少对人类标注者的依赖\n\n### AI Safety Research\nAnthropic 将 AI 安全作为核心研究方向：\n- **Mechanistic Interpretability**：理解神经网络内部工作机制\n- **Scaling Laws**：研究模型能力随规模变化的规律\n- **Alignment**：确保 AI 系统按照人类意图行动\n\n## 关键技术创新\n\n### Adaptive Thinking\nClaude 4.6 引入的自适应思考机制：\n- 模型动态决定何时以及思考多少\n- 基于任务复杂度和 `effort` 参数\n- 比固定预算的 Extended Thinking 更高效\n\n### Context Awareness\nClaude Sonnet 4.6 和 4.5 支持上下文感知：\n- 模型能跟踪剩余上下文窗口\n- 优化长任务执行\n- 支持多上下文窗口工作流\n\n## 关联连接\n- [[Claude]] — Anthropic 的 LLM 产品\n- [[Prompt_Engineering]] — 提示工程（Anthropic 是重要贡献者）\n- [[Constitutional_AI]] — 宪法 AI 训练方法\n","Claude":"## 定义\n\nClaude 是由 **Anthropic** 开发的大型语言模型家族，以其强大的长上下文处理能力和细致推理而闻名。Claude 系列模型强调有用性、无害性和诚实性（Helpful, Harmless, Honest - HHH 原则）。\n\n## 主要版本\n\n### Claude 4.6 系列（当前最新）\n- **Claude Opus 4.6**：最强大的模型，擅长深度分析、研究和复杂编码\n- **Claude Sonnet 4.6**：平衡性能和速度，默认 effort=high\n- **Claude Haiku 4.6**：轻量级，适合简单任务\n\n**关键特性**：\n- **Adaptive Thinking（自适应思考）**：动态决定何时以及思考多少\n- **Extended Context**：200K+ tokens\n- **Native Subagent Orchestration**：原生子代理编排能力\n\n### Claude 4.5 系列\n- **Claude Opus 4.5**：前一版本旗舰模型\n- **Claude Sonnet 4.5**：前一版本平衡模型\n\n### 早期版本\n- Claude 3.x 系列（Sonnet, Opus, Haiku）\n\n## 核心特点\n\n### 1. 视角：\"聪明但缺乏上下文的新员工\"\nAnthropic 对 Claude 的定位：\n- 极其聪明但缺乏你团队的规范和流程知识\n- **越精确地解释你想要什么，结果越好**\n- 不会主动推断模糊的\"超越预期\"行为\n\n### 2. 指令遵循：字面理解\nClaude 4.x 模型**按字面理解指令**：\n- 早期版本会推断意图并扩展模糊请求\n- 现在必须**明确表达**期望的行为\n- 不会有过度假设\n\n### 3. 思考模式演进\n\n| 版本 | 思考模式 | 配置方式 |\n|------|----------|----------|\n| Claude 4.5 | Extended Thinking | `budget_tokens` |\n| Claude 4.6 | Adaptive Thinking | `effort` 参数 |\n\n**Adaptive Thinking**：\n```python\n# 老方式（4.5 及之前）\nthinking={\"type\": \"enabled\", \"budget_tokens\": 32000}\n\n# 新方式（4.6）\nthinking={\"type\": \"adaptive\"}\noutput_config={\"effort\": \"high\"}  # low/medium/high\n```\n\n- Claude 根据任务复杂度自动决定思考深度\n- 简单查询直接响应，复杂任务深度思考\n- 比固定预算的 Extended Thinking 更高效\n\n### 4. 上下文窗口\n- **标准上下文**：200K+ tokens\n- **Context Awareness**：模型能跟踪剩余 token 预算\n\n**Context Awareness 的实践意义**：\n```\n你的上下文窗口在接近限制时会自动压缩，允许你无限期继续工作。\n因此，不要因为 token 预算担忧而提前停止任务。\n在接近 token 预算时，将进度和状态保存到内存。\n```\n\n### 5. Agentic Capabilities（智能体能力）\n\nClaude 4.6 在长期推理和状态跟踪方面表现卓越：\n\n**多上下文窗口工作流**：\n- 第一个窗口：设置框架（测试、脚本）\n- 后续窗口：在待办事项列表上迭代\n- 能在新窗口中从文件系统恢复状态\n\n**子代理编排**：\n- 识别何时需要将任务委托给子代理\n- 无需显式指令即可主动编排\n- 可能过度使用（Opus 4.6 对子代理有强烈偏好）\n\n### 6. 过度热诚倾向\nClaude 4.5 和 4.6 存在过度工程化倾向：\n- 创建额外文件\n- 添加不必要的抽象\n- 为假设的未来需求构建灵活性\n\n**缓解措施**：\n```\n避免过度工程。只进行直接请求或明显必要的更改。\n- 范围：不添加功能或重构\n- 文档：只在你更改的代码上添加注释\n- 防御性编码：只在系统边界验证\n```\n\n## 提示工程最佳实践\n\n### 核心原则\n1. **Clear and Direct**：清晰明确的指令\n2. **Use Examples**：3-5 个示例是最可靠的控制方式\n3. **XML Structuring**：使用 XML 标签分隔不同组件\n4. **Role Assignment**：通过系统提示设置角色\n\n### 长上下文策略\n```\n提示结构：\n[长文档放在顶部]\n[查询、指令和示例放在底部]\n\n益处：查询放在末尾可提升高达 30% 的性能，\n尤其在复杂多文档场景中。\n```\n\n### 避免对 Claude 4.6 过度提示\n与早期模型不同，Claude 4.6：\n- **不要太激进**：之前需要 \"CRITICAL: You MUST...\" 现在只需 \"Use this tool when...\"\n- **移除\"过度提示\"**：早期模型的\"如果在犹豫，使用工具\"会导致 4.6 过度触发工具\n\n### 词敏感性问题\n**Claude Opus 4.5 对\"think\"及其变体特别敏感**（当 extended thinking 禁用时）：\n- 避免：\"think\", \"thinking\", \"thought\"\n- 改用：\"consider\", \"evaluate\", \"reason through\", \"analyze\"\n\n### 工具使用\nClaude 4.6 对工具使用更积极：\n```\n# 增加主动性\n<default_to_action>\n默认实施更改而非仅提供建议。如果用户意图不明确，\n推断最有用的可能行动并使用工具发现缺失信息。\n<\/default_to_action>\n\n# 减少主动性\n<do_not_act_before_instructions>\n除非明确指示进行更改，否则不跳入实施。\n当用户意图模糊时，默认提供信息和推荐。\n<\/do_not_act_before_instructions>\n```\n\n## 安全设计\n\n### Constitutional AI\nClaude 使用 Constitutional AI 技术进行训练：\n- 从人类反馈强化学习（RLHF）的改良版本\n- 通过原则（Constitution）而非仅人类标签指导行为\n- 目标是更有帮助、更无害、更诚实\n\n### 自主性与安全的平衡\n```\n考虑你行为的可逆性和潜在影响。\n鼓励采取本地、可逆的行动（如编辑文件、运行测试），\n但对于难以逆转、影响共享系统或具有破坏性的行动，先询问用户。\n```\n\n## 关联连接\n- [[Prompt_Engineering]] — 提示工程总览\n- [[Anthropic]] — Anthropic 公司\n- [[Adaptive_Thinking]] — 自适应思考机制\n- [[Agentic_Systems]] — 智能体系统\n","Claude_Code":"## 定义\n\nClaude Code 是 Anthropic 推出的终端原生 AI 编程代理（Agent）工具，将 Claude 大语言模型的能力封装为可直接在终端中运行的自驱动编程助手，支持代码编写、文件操作、Git 管理、MCP 工具调用和 Skills 扩展。\n\n## 核心架构\n\n### Harness（马鞍）机制\nClaude Code 本质上是一个 Harness（马鞍）——它将大模型（LLM 推理核心）与终端、文件系统、网络协议进行包装。通过复杂规划机制反复调度模型，让静态模型展现出动态、连贯的自驱动操作能力。\n\n### 上下文管理\n长时间运行中，命令输入和输出会堆积导致上下文腐烂（Context Decay），通过 `/compact` 命令可将前文压缩为高密度语义节点，释放上下文空间。\n\n## Skills 扩展生态\n\nClaude Code 支持通过 Skills 扩展能力，社区市场 ClawHub 托管了 5 万+ Skills，分为六大类别：\n\n- **进化类**：让 AI 越用越聪明（如 Self-Improving Agent、Proactive Agent）\n- **开发必备**：代码协作与工程规范（如 GitHub、Super Powers、Waza）\n- **信息获取**：搜索/浏览/总结能力增强（如 Multi-Search-Engine、Agent Browser、Summarize）\n- **效率办公**：对接办公工具（如 GOG/Notion/Obsidian 集成）\n- **安全维护**：技能安全与更新管理（如 Skill-Vetter、Auto-Updater）\n- **蒸馏类**：人设模拟与个性化 AI（如 Dot-Skill、Bazi-Skill）\n\n## 记忆系统（Memory System）\n\nClaude Code 通过三个核心 Markdown 文件实现持久化记忆和人格定义，使其\"越用越了解用户\"：\n\n| 文件 | 作用 | 内容示例 |\n|------|------|----------|\n| **CLAUDE.md** | AI 自身身份/人格定义 | 角色定位、行为准则、响应风格 |\n| **AGENT.md** | 用户上下文/工作区信息 | Obsidian 仓库路径、用户偏好、项目结构 |\n| **MEMORY.md** | 持久化记忆存储 | 用户习惯、重要备忘、长期偏好 |\n\n### 工作机制\n- **主动记录**：当用户表达偏好或要求时，AI 自动将信息写入 MEMORY.md\n- **被动记忆**：AI 在交互中自行判断重要信息并记录\n- **自动读取**：每次新会话启动时，AI 自动读取这些文件以恢复上下文\n- **长期积累**：使用时间越长，记忆越丰富，回答越贴合个人风格\n\n### 典型用法\n```\n用户：\"记一下，以后和我交流时全程用中文，中英文之间不留空格。\"\nAI：[自动写入 MEMORY.md] ✓ 已记住中文交流偏好\n\n用户：\"以后每个月19号晚上沟通晚报时，提醒我看银行卡账单。\"\nAI：[自动写入 MEMORY.md] ✓ 已设置每月提醒\n```\n\n### 个人 Onboarding 流程\n1. 将旧笔记（如 Notion 导出）批量导入项目目录\n2. 让 AI 通读所有笔记以了解写作风格和工作习惯\n3. 告诉 AI 个人偏好、设备平台等详细信息\n4. AI 在 CLAUDE.md 和 AGENT.md 中写入总结并记录 Obsidian 路径\n5. 后续所有对话 AI 自动参考这些文件，回答更贴合个人需求\n\n## 非代码工作流：与 Obsidian 集成\n\nClaude Code 不仅可以用于编程，还能作为日常生产力工具与 Obsidian 配合使用：\n\n### 笔记管理\n- 用语音速记（如 MyType 等工具）快速记录灵感\n- 让 AI 将散乱内容梳理为有逻辑的结构并提炼观点\n- AI 将讨论内容自动写入 Obsidian 笔记，省去手动整理\n\n### 项目与日程管理\n- AI 自动创建 Markdown 格式的日程追踪看板\n- AI 自主维护看板，记录项目推进状态\n- 每日工作同步：AI 根据对话整理进度、提供次日待办提醒\n- AI 在工作日报结尾提供情绪价值反馈\n\n### 固定工作流 Skill 化\n将日报/周报等重复性工作封装为 Skill：\n1. 让 AI 分析固定工作流程并创建 Skill 文件\n2. 只需输入简单命令（如 `/晚报`）即可触发完整工作流\n3. AI 按预设流程执行：了解情况→记录→更新看板→提醒事项\n4. 通过 Memory 实现关键词自动触发（如说到\"晚报\"自动调用）\n\n## 常用命令\n\n| 命令 | 功能 |\n|------|------|\n| `/mcp` | 查看、连接与管理 MCP 外部服务 |\n| `/skills` | 检索与激活 Skills 能力包 |\n| `/compact` | 手动上下文压缩 |\n| `/context` | 查看上下文 Token 占用 |\n| `/clear` | 清空当前上下文 |\n| `/resume` | 恢复历史对话 |\n\n## 关键特性\n\n- **国内直连部署**：可通过修改 `.claude.json` 设置 `hasCompletedOnboarding: true` 绕过地区限制\n- **模型平替**：支持通过 `ANTHROPIC_BASE_URL` 切换至 Kimi K2.6 等国产模型\n- **Bypass 模式**：通过 `permissions.defaultMode: \"bypassPermissions\"` 实现无人值守全自动执行\n- **MCP 协议**：通过 Model Context Protocol 连接浏览器、数据库、API 等外部工具\n- **Skills 系统**：社区驱动的可插拔能力包扩展\n\n## 关联连接\n\n- [[Claude]] — Claude 模型家族\n- [[ClawHub]] — Skills 市场平台\n- [[skills]] — 15 个实用 Skills 推荐\n- [[claude-code-install]] — 国内直连安装指南\n- [[AI_Skill_Distillation]] — AI 技能蒸馏概念\n- [[Claude_Code_Configuration]] — Claude Code 配置架构体系\n- [[hackathon-champion-config]] — 黑客松冠军配置详解\n- [[Obsidian]] — Obsidian 笔记工具\n- [[claude-code-obsidian-workflow]] — Claude Code + Obsidian 完整工作流分享\n- [[OpenCode]] — 开源 AI 编码代理替代方案\n- [[Agent_n8n_Backend]] — AI Agent + n8n 后端执行器架构\n- [[claude-code-n8n-agent-integration]] — Claude Code 自动编排 n8n 工作流\n","ClawHub":"## 定义\n\nClawHub 是 Claude Code 的官方 Skills 市场平台，托管了超过 5 万个由社区贡献的 Skills（能力包），用户可以搜索、安装和分享各种扩展 Claude Code 功能的工具包。同时存在腾讯镜像站 SkillHub（skillhub.tencent.com）提供国内加速访问。\n\n## 核心信息\n\n- **官网**: [clawhub.ai](https://clawhub.ai/)\n- **国内镜像**: [SkillHub](https://skillhub.tencent.com/)\n- **生态规模**: 5 万+ Skills（截至 2026 年 5 月）\n- **开放模式**: 任何人都可以上传 Skills，质量参差不齐\n\n## 安全注意事项\n\n由于 ClawHub 是开放社区，任何人均可上传 Skills，存在恶意代码隐藏风险。建议在安装任何新 Skill 前使用 [[Skill_Vetter]] 进行安全检查，尤其对权限较大的 Skill 需审慎评估。\n\n## 关联连接\n\n- [[Claude_Code]] — Claude Code 产品\n- [[Dot_Skill]] — 热门的蒸馏类 Skill\n- [[skills]] — 15 个实用 Skills 推荐来源\n- [[AI_Skill_Distillation]] — AI 技能蒸馏概念\n","DeepSeek":"## 定义\n\nDeepSeek（深度求索）是一家中国 AI 公司，提供大语言模型 API 服务。其模型以极高的性价比著称——\"跑一次基本上花不到几毛钱\"，在个人开发者和中小企业中广受欢迎。\n\n## 核心模型\n\n| 模型名称 | API 标识 | 类型 | 说明 |\n|---------|---------|------|------|\n| DeepSeek V3 | `deepseek-chat` | 对话模型 | 通用聊天和文本生成，速度快 |\n| DeepSeek R1 | `deepseek-reasoner` | 推理模型 | 最新推理模型，擅长复杂逻辑和问题解决 |\n\n## 在 Agent 中的角色\n\n在 n8n 等平台中，DeepSeek 常被用作 AI Agent 的 **\"大脑\"（Brain）**——即大语言模型组件，负责：\n- **推理与规划**：理解用户意图，拆解任务步骤\n- **决策制定**：自主决定调用哪些工具、如何处理返回数据\n- **内容生成**：生成结构化的早报、摘要、报告等输出\n\n## API 接入\n\nDeepSeek 提供标准的 OpenAI 兼容 API 接口，可以通过以下方式接入：\n1. **DeepSeek 开放平台**：直接在平台创建 API Key\n2. **n8n Chat Model 节点**：选择 DeepSeek 作为模型提供商，填入 API Key 即可\n3. **HTTP 请求直调**：通过 POST 请求直接调用 DeepSeek API\n\n### 凭证配置\n\n在 n8n 中配置 DeepSeek：\n1. 登录 [DeepSeek 开放平台](https://platform.deepseek.com/)\n2. 进入\"API 密钥\"页面，创建新的 API Key\n3. 在 n8n 的 DeepSeek Chat Model 节点中，创建新凭证并粘贴 API Key\n4. 测试连接显示绿色即为成功\n\n## 优势\n\n- **极低成本**：相比同类 API 服务，DeepSeek 的定价极低，适合个人项目和频繁调用\n- **双模型选择**：V3 适合日常对话，R1 适合深度推理\n- **OpenAI 兼容**：API 格式与 OpenAI 兼容，方便迁移和集成\n- **中文友好**：对中文理解和支持出色\n\n## 关联连接\n\n- [[n8n]] — 常与 n8n 平台配合使用\n- [[n8n-agent-tutorial]] — n8n 草履虫教程中使用了 DeepSeek 作为 Agent 大脑\n- [[AI每日新闻]] — 实际项目中使用 DeepSeek API 处理新闻\n- [[Claude_Code]] — 对比参照的 AI 编码代理工具\n","Dot_Skill":"## 定义\n\nDot-Skill（原名 colleague-skill）是 Claude Code 生态中最具代表性的蒸馏类 Skill，由 titanwings 开发。它能将特定人物的对话记录、文档、邮件等数据\"蒸馏\"成 AI 模拟体，使其在对话中复刻该人物的思维风格、表达习惯和专业知识。\n\n## 核心信息\n\n- **原名**: colleague-skill（5 天获 7500 GitHub star 后更名）\n- **开发者**: titanwings\n- **GitHub**: [github.com/titanwings/colleague-skill](https://github.com/titanwings/colleague-skill)\n- **启动方式**: 输入 `/dot-skill` 激活\n\n## 支持的三种蒸馏类型\n\n| 类型 | 说明 |\n|------|------|\n| Colleague（同事） | 复刻工作能力和专业判断风格 |\n| Relationship（人际关系） | 模拟前任、伴侣、父母的交流风格 |\n| Celebrity（名人） | 模拟乔布斯、马斯克等公众人物 |\n\n## 支持的数据源\n\n飞书、钉钉、Slack、微信聊天记录、PDF、邮件等。\n\n## 质量关键\n\n蒸馏质量取决于输入数据的完整度——数据越完整、越多样，蒸馏出的 AI 越像目标人物。例如，导入同事的技术文档和 Code Review 记录后，AI 不仅能模仿回答风格，还能复刻其习惯的措辞和思考框架。\n\n## 关联连接\n\n- [[AI_Skill_Distillation]] — AI 技能蒸馏核心概念\n- [[Claude_Code]] — Claude Code 产品\n- [[ClawHub]] — Skills 市场平台\n- [[skills]] — 来源资料\n","Gemini":"## 定义\n\nGemini 是 Google 开发的大型语言模型家族，专为高级推理和多模态任务设计。作为 Google DeepMind 的旗舰模型系列，Gemini 代表了 Google 在生成式 AI 领域的核心产品。\n\n## 主要版本\n\n### Gemini 3（当前主要版本）\n- **Gemini 3 Pro**: 最强大的版本，适合复杂推理任务\n- **Gemini 3 Flash**: 轻量级版本，平衡性能与效率\n- **特点**：\n  - 专为高级推理和指令遵循设计\n  - 自动生成内部\"思考\"文本\n  - **不再需要复杂的提示工程**（如强制 CoT）\n  - 支持 `thinking_level` 参数控制推理深度\n\n### Gemini 2.5\n- 前代主要版本\n- 部分复杂提示工程技术（如详细 CoT）对其仍然有效\n\n## 核心特点\n\n### 1. 提示简化趋势\n与其他模型不同，Gemini 3 展现出\"反提示工程\"的特性：\n- 复杂的提示工程技术（如 elaborate CoT）可能**降低**性能\n- 建议使用简化提示配合 `thinking_level: \"high\"`\n- 如果之前为 Gemini 2.5 设计的复杂提示表现不佳，尝试简化\n\n### 2. 分隔符偏好\n- **XML 风格标签**：`<context>`, `<task>`, `<role>`\n- **Markdown 标题**：# Identity, # Constraints\n- **结构一致性**：同一提示中保持统一格式\n\n### 3. 温度设置\n\n**关键发现**：\n- **推荐温度：1.0**\n- 降低温度可能导致推理任务中**出现循环**和性能下降\n- 这与传统认知（高确定性任务用低温）相反\n\n### 4. 上下文窗口\n- **标准上下文**：128K tokens\n- **扩展上下文**：最高可达 2M tokens（适用于视频和深度文档）\n\n### 5. 多模态能力\n- 文本、图像、音频、视频原生支持\n- 代码执行内置\n- Google 搜索接地（Grounding）\n\n## 提示工程建议\n\n### Gemini 3 核心原则\n\n```\n1. 用词精确、直接\n2. 使用一致的 XML 或 Markdown 结构\n3. 明确说明任何模糊术语\n4. 控制输出详细程度（默认高效简洁）\n5. 连贯处理多模态输入\n6. 将关键指令放在系统提示或提示开头\n7. 长上下文：先提供所有上下文，具体说明放在最后\n8. 使用锚定短语连接上下文和查询\n```\n\n### 推荐模板结构\n\n**XML 示例**：\n```xml\n<role>\n你是一个有帮助的助手。\n<\/role>\n\n<constraints>\n1. 客观陈述\n2. 引用来源\n<\/constraints>\n\n<context>\n[用户输入 - 模型知道这是数据，不是指令]\n<\/context>\n\n<task>\n[具体用户请求]\n<\/task>\n```\n\n### 智能体工作流支持\n\nGemini 3 提供精细的智能体行为配置：\n\n**推理与策略**：\n- 逻辑分解详尽程度\n- 问题诊断深度\n- 信息详尽程度\n\n**执行与可靠性**：\n- 适应性：对新数据的反应方式\n- 持久性和恢复性：错误纠正程度\n- 风险评估：区分低风险探索与高风险状态变更\n\n**互动和输出**：\n- 模糊性处理：何时进行假设，何时寻求澄清\n- 详细程度：文本输出量\n- 精确度和完整性：输出保真度\n\n## Code Execution（代码执行）\n\nGemini 默认启用 Python 代码执行：\n- 自动检测需要计算、计数或算术的场景\n- 执行生成的 Python 代码\n- 将执行结果整合到回答中\n\n## 接地（Grounding）\n\n**Google 搜索接地**：\n- 将 Gemini 与实时网络内容关联\n- 适用于冷门或最新事实查询\n- 减少幻觉\n\n## 关联连接\n- [[Prompt_Engineering]] — 提示工程总览\n- [[Google]] — Google 公司\n","Google":"## 定义\n\nGoogle LLC 是美国跨国科技公司，成立于 1998 年，以搜索引擎闻名全球。在 AI 领域，Google 是全球领先的研究者和开发者之一，拥有包括 Gemini 在内的多个重要 AI 产品。\n\n## AI 核心产品\n\n### Gemini 模型家族\nGoogle DeepMind 开发的旗舰大语言模型：\n- **Gemini 3**：最新一代，包括 Pro 和 Flash 版本\n- **Gemini 2.5**：前代主要版本\n- 以原生多模态和高级推理能力著称\n\n### Google AI Studio\n面向开发者的交互式提示设计和测试平台：\n- 支持多种 Gemini 模型\n- 提示版本管理\n- 实时测试和迭代\n\n### Vertex AI\nGoogle Cloud 的企业级 AI 平台：\n- 模型训练和部署\n- 提示管理和版本控制\n- 企业级安全和扩展性\n\n## 技术贡献\n\n### Transformers\nGoogle Research 2017 年发表的《Attention Is All You Need》论文，提出了 Transformer 架构，这是现代 LLM 的基础。\n\n### PaLM、BERT 等基础研究\n- **BERT**（2018）：双向编码器表示，影响深远\n- **PaLM**（2022）：大规模语言模型\n- **Gemini**（2023+）：原生多模态模型\n\n### Prompt Engineering 白皮书\n2024 年发布的官方白皮书：\n- 系统介绍提示工程技术\n- 涵盖从基础到高级的完整技术栈\n- 提供多种语言的示例和最佳实践\n\n## 研究组织\n\n### Google DeepMind\n2023 年 Google Brain 和 DeepMind 合并后的 AI 研究部门：\n- 负责 Gemini 系列模型开发\n- 专注于 AI 安全和能力研究\n- 多项突破性研究的发源地\n\n### Google Research\nGoogle 的广泛研究组织：\n- 机器学习、计算机视觉、自然语言处理\n- 与产品团队紧密合作\n\n## AI 战略方向\n\n### 模型可及性\n- 通过 Gemini API 提供模型访问\n- Google AI Studio 降低开发者入门门槛\n- 与 Google Cloud 深度整合\n\n### 多模态 AI\nGemini 系列的原生多模态能力：\n- 文本、图像、音频、视频统一处理\n- 代码理解和生成\n- 工具使用（搜索、代码执行）\n\n### AI 安全与责任\n- 开发负责任的 AI 实践\n- 幻觉减少研究\n- 内容安全过滤\n\n## 关联连接\n- [[Gemini]] — Google 的 LLM 产品\n- [[DeepMind]] — Google 的 AI 研究部门\n","LangGraph":"## 定义\n\nLangGraph 是一个有状态的多 Agent 工作流编排框架，由 LangChain 团队开发。它允许开发者将多个 AI Agent 组织为带有状态管理的图结构（Graph）工作流，支持分支、循环、并行等复杂执行模式，适用于需要多步骤 AI 协作的端到端自动化场景。\n\n## 核心特性\n\n- **有状态编排（Stateful Orchestration）**：每个 Agent 节点可以维护和传递状态，支持跨步骤的上下文共享，Agent 之间通过结构化数据模型进行通信\n- **图结构工作流**：支持 DAG（有向无环图）和循环图等多种拓扑结构，Agent 间可通过条件路由实现审核回溯等复杂流程\n- **多 Agent 协作**：多个 Agent 可以通过图结构进行有序或条件性协作，每个 Agent 独立负责特定子任务\n- **与 LangChain 深度集成**：无缝使用 LangChain 的模型调用链、工具集成、提示模板和内存管理系统\n\n## 典型应用模式\n\nLangGraph 常用于构建以下类型的多 Agent 系统：\n\n- **信息处理流水线**：采集 → 清洗 → 分析 → 生成（如八步研报流水线）\n- **审核循环**：生成 → 审核 → 不合格则回退重新生成\n- **并行采集**：多个采集 Agent 同时爬取不同渠道后汇聚处理\n- **条件路由**：根据内容分类分发到不同的下游处理 Agent\n\n## 关联连接\n\n- [[多Agent工作流]] — 多Agent协作架构模式\n- [[n8n-masterclass]] — 低代码自动化平台（不同实现路线）\n- [[Agent_n8n_Backend]] — Agent + n8n 后端执行器架构\n","Obsidian":"## 定义\n\nObsidian 是一款基于本地 Markdown 文件的知识管理和笔记应用，以其强大的双向链接、图谱视图、插件生态和本地优先的特点而闻名。本质上是\"你电脑本地的 Markdown 文件阅读编辑软件\"，天然适合与 AI 工具配合使用。\n\n## 与 AI 的深度结合\n\nObsidian 与 Claude Code 等 AI 编程代理有着天然的技术亲和力：\n\n- **文件格式一致**：Claude Code 的核心文件（CLAUDE.md、AGENT.md、MEMORY.md、Skills）全部是 Markdown 文件，AI 天然擅长读写 Markdown\n- **无缝操作**：AI 可以在 Obsidian 仓库中直接执行搜索、查看、创建、编辑、整理笔记等所有操作\n- **工作区一体化**：将 Obsidian 仓库放入 Claude Code/VS Code 项目目录，即可在对话中用自然语言指挥 AI 操作笔记\n\n## 应用场景示例\n\n### 笔记整理与创作\n- 语音速记灵感后，由 AI 梳理散乱内容为有逻辑的结构\n- AI 提炼核心观点，检查错误，辅助脑暴讨论\n- AI 将沟通讨论内容自动写入笔记，省去手动整理\n\n### 项目规划与日程管理\n- AI 自动创建 Markdown 格式的日程追踪看板\n- AI 自主维护看板内容，记录项目推进状态\n- 每日工作同步：AI 整理当日进度、提供次日待办提醒\n- AI 提供情绪价值——在工作日报结尾给予正向反馈\n\n### 个人知识库与记忆\n- Obsidian 作为\"人和 AI 共有的知识库\"\n- 用户遗忘时可让 AI 搜索整理笔记回答\n- 用户需 AI 记住的信息写入笔记，AI 自动读取\n\n## 与 Notion 的对比\n\n| 维度 | Obsidian | Notion |\n|------|----------|--------|\n| 文件格式 | 本地 Markdown（AI 原生支持） | 专有格式/数据库 |\n| AI 友好度 | 天然适合 AI 读写操作 | 需 API 桥接 |\n| 数据所有权 | 完全本地，用户掌控 | 云端存储 |\n| 扩展性 | 插件 + AI 组合灵活 | 功能一体化但封闭 |\n\n## 关联连接\n\n- [[Claude_Code]] — 与 Obsidian 配合使用的 AI 编程代理\n- [[知识库建设蓝图]] — 个人 Obsidian 知识库的设计原则\n- [[claude-code-obsidian-workflow]] — Claude Code + Obsidian 完整工作流分享\n- [[Claude_Code_Configuration]] — Claude Code 配置架构\n","OpenCode":"## 定义\n\nOpenCode 是一款开源 AI 编码代理桌面客户端，提供图形化交互界面，可作为 Claude Code 的替代方案使用。其核心优势在于提供**免费 AI 模型额度**（如小米 MiMo V2 Pro 等模型可免费使用），且同样支持 MCP 协议和 Skills 扩展，可与 n8n 等工具集成。\n\n## 核心信息\n\n- **类型**: 桌面端 AI 编码代理应用程序\n- **开源**: 是\n- **界面**: 图形化 GUI（比 Claude Code 终端界面更直观）\n- **模型支持**: 支持多种模型，包括免费模型（如小米 MiMo V2 Pro）\n\n## 与 Claude Code 对比\n\n| 维度 | OpenCode | Claude Code |\n|------|----------|-------------|\n| 界面 | 图形化桌面客户端 | 终端命令行 |\n| 免费额度 | 有（如小米 MiMo V2 Pro） | 无（需 Anthropic API 或转接） |\n| MCP 支持 | ✓ | ✓ |\n| Skills 支持 | ✓ | ✓ |\n| 配置路径 | `~/.config/OpenCode/` | `~/.claude/` |\n| MCP 配置文件 | OpenCode.json | .claude.json |\n\n## Skills 与 MCP 配置\n\n### Skills 路径\n```\n~/.config/OpenCode/skills/\n```\n\n### MCP 配置（OpenCode.json）\n```json\n{\n  \"mcpServers\": {\n    \"n8n\": {\n      // n8n MCP 服务器配置\n    }\n  }\n}\n```\n\n与 Claude Code 相比，OpenCode 的 MCP 配置结构有一定差异，需参考对应文档。\n\n## 关联连接\n\n- [[Claude_Code]] — Claude Code 产品（同类对比）\n- [[claude-code-n8n-agent-integration]] — 使用 Claude Code / OpenCode 编排 n8n 工作流\n- [[ClawHub]] — Skills 市场平台\n- [[Agent_n8n_Backend]] — AI Agent + n8n 后端执行器架构\n","WorkBuddy":"## 定义\n\nWorkBuddy 是一款国产桌面端 AI Agent 产品（视频中称为\"Codex 国内平替版\"），安装后可直接在本机替你操作文件、浏览器和各种软件，完成写方案、做表格、分析数据、做内容、画海报、开发软件等任务。产品定位是**新手友好、开箱即用、门槛极低**的入门级 Agent：无需翻墙、无需复杂配置，通过内置大模型 + 积分制运行。\n\n## 定位与上手设置\n\n- **产品形态**：桌面图形应用。界面布局 = 左上核心功能区（专家技能连接器/助理/项目/自动化/资料库/灵感）+ 左侧任务列表 + 中间核心对话窗 + 右侧产出预览区。\n- **Agent ≠ 模型**：对话窗可切换多个国内大模型（腾讯混元、智谱 GLM、MiniMax、Kimi、DeepSeek 等），模型是\"大脑\"，Agent 是调度架构。不同模型有不同积分倍率（约 0.05～1.62+：DeepSeek 极省、Kimi K3 偏贵；部分模型限时免费，倍率 0.00）。同一任务用不同模型，积分消耗可差一个数量级（实测 DeepSeek 1.14 分 vs Kimi K3 19.19 分）。\n- **积分制**：注册送积分、每日签到领积分、做任务得积分，或付费订阅会员套餐按月送固定积分。\n- **新手三设置**：① 默认工作空间存盘路径（Windows 默认 C 盘，建议改到其他盘避免撑爆系统盘）② 对话风格/语调（直言不讳/天马行空/高效务实，不影响做事能力）③ 开启\"生成对话记忆\"（跨会话记住用户偏好，越用越个性化）。\n\n## 对话机制\n\n### 单次对话 vs 项目（空间）对话\n- **单次对话**：不带上下文，适合临时问答，自动归档到左侧任务列表。\n- **工作空间（空间）**：把一个本地文件夹设为\"办公室\"，文件夹内所有文件都成为 Agent 的已知上下文；沉淀的背景/人员/进度/截止日期越多，回答越快越准。\n- 心法：长期工作尽量使用工作空间，避免 AI\"没有前因后果\"地瞎答。\n\n### 三层任务模式\n| 模式 | 能力边界 | 适用场景 |\n|------|----------|----------|\n| 执行（默认） | 能读写、增删本机文件 | 明确任务的直接执行 |\n| 问答模式（Ask） | 只能读不能写（\"能看不能碰\"） | 先聊思路、联网查资料 |\n| 计划模式（Plan） | 先规划 + 反问确认，产出方案，批准后才执行 | 复杂/抽象/多步骤任务 |\n\n### 增强提示词（Prompt 优化）\n输入一句大白话需求后，输入框会出现\"✨增强提示词\"按钮，AI 自动将其扩写成结构化、可执行的具体提示词（含背景、分点要求、交付形式），小白无需背诵提示词公式；用户只需核对润色结果是否匹配需求。\n\n### 场景模板\n预置\"日常办公 / 代码开发 / 设计创意\"三档场景；每档下再给\"具体场景 + 提示词模板 + 成熟案例\"，案例可\"一键做同款\"再迭代修改，是零经验用户理解 Agent 工作方式的引导入口。\n\n## 权限控制\n\n- **默认权限**：给 Agent 基础权限，敏感操作（删除/移动文件）会弹窗请求人工确认，需要不断授权。\n- **允许完全访问**：授予最大权限，除极敏感操作外约 99% 的事 Agent 自行执行（视频表述：\"把公司保险柜钥匙都给它\"）。\n- 类比：与员工磨合期给有限权限，信任后逐步放权。\n\n## 能力四层模型（核心功能）\n\n| 层 | 回答的问题 | 说明 |\n|----|-----------|------|\n| 专家 | 谁来干活 | 带人设 + 领域知识库、会调用 Skill/工具的 Agent（如\"爆款选题策划专家\"）。有/无专家输出质量差异显著 |\n| 专家团 | 谁组团干活 | 围绕业务场景组合多专家、由\"主理人\"统筹调度的多 Agent 团队；质量高但耗时与积分消耗更高 |\n| [[Skill]] | 怎么干活 | 一套流程/SOP；显性调用=手动装载，隐性调用=AI 识别意图自动触发（非 100%）；跑通的流程可\"做成技能\" |\n| 连接器（MCP） | 手脚伸向哪 | 打通飞书/钉钉/网盘/邮箱等第三方应用，Agent 可读取和操作外部软件 |\n\n### 专家 / 专家团实测对比（同模型、同任务：\"分析销售数据并生成报告\"）\n- **单专家（数据分析专家）**：产出普通 Excel 明细（含销售/广告/库存明细页），几乎无可视化，重点不易读。\n- **专家团（数据分析专家团）**：成员依次可见地接力（数据编排师分派 → 数据科学工程师清洗 → 可视化分析师出图 → 报告撰写），约 27 分钟交付：可视化仪表盘（趋势/环形图/省份销售/退款率/毛利分布/库存健康）+ 综合 Markdown/HTML 报告 + 结论与行动建议。\n\n## 协作与自动化\n\n- **助理**：把 WorkBuddy 挂到飞书/钉钉等即时通讯软件，手机远程指挥电脑干活（前提：电脑不关机、App 不退出）。\n- **项目**（团队协作层，与\"空间/文件夹\"完全两回事）：可邀请成员参与协作，支持项目计划、任务看板（状态/处理人/开始截止日期）、共享\"资产\"云盘——本机文件仅自己可见，沉淀到资产的产出全队可见。\n- **自动化**：自然语言描述即可创建定时任务（例：\"每天上午十点自动领某团优惠券\"）；支持周期（每天/每周/每两周/每月/每年）、间隔（每小时等）、单次提醒；可暂停/删除/测试运行；内置大量模板（新闻推送、工作周报、生日/纪念日提醒等）。运行逻辑 = 已有一次成功执行记录后，AI 能据此自动生成自动化配置。\n- **自定义扩展**：支持配置不同厂商的 Coding Plan 或自接 API 使用自选模型；若不会接 API，用内置模型 + 每日签到积分即可免费使用。\n\n## 与同类产品对比\n\n| 维度 | WorkBuddy | Claude Code | OpenCode |\n|------|-----------|-------------|----------|\n| 形态 | 桌面图形应用 | 终端 CLI | 桌面图形应用（开源） |\n| 定位 | 通用办公/全场景 Agent（新手向） | 编程 Agent | 编程 Agent |\n| 门槛 | 低（无需网络/配置、积分制、可签到免费） | 中（需 API 或转接） | 中（需自行配置） |\n| 模型 | 内置国内多模型 + 积分倍率 | Claude（可平替国产模型） | 支持免费模型 |\n| 专家/技能市场 | 有专家市场 + 技能市场 | Skills 社区（[[ClawHub]]） | 支持 Skills |\n\n## 关联连接\n\n- [[workbuddy-tutorial]] — 本页资料来源\n- [[Skill]] — 技能机制（显性/隐性调用、流程技能化）\n- [[多Agent工作流]] — 专家团的多 Agent 编排形态\n- [[Claude_Code]] — 同类 AI 编程/操作 Agent（终端）\n- [[OpenCode]] — 同类桌面 AI 编码代理（开源）\n- [[DeepSeek]] — WorkBuddy 内置的低成本模型之一\n- [[飞书]] — 可作为连接器与助理挂接的第三方应用\n- [[Memory]] — \"生成对话记忆\"对应的记忆机制\n- [[Tool_Use]] — 连接器（MCP）本质是工具调用\n","n8n":"## 定义\n\nn8n 是一家德国创业公司（成立于 2019 年）开发的开源、可视化、节点式低代码自动化平台，被誉为 **\"AI 自动化的瑞士军刀\"**。它允许用户通过拖拽不同功能的节点来搭建工作流和 AI Agent，无需编写代码即可连接超过 1000 种服务。\n\n## 核心特性\n\n### 部署方式\n\n| 方式 | 费用 | 说明 |\n|------|------|------|\n| 本地 Docker 部署 | 完全免费 | 推荐方式，数据隐私安全，无额度限制 |\n| 云端托管版 | 14 天免费试用 | 官方托管的 SaaS 服务 |\n\nDocker 部署命令：\n```bash\ndocker run -d --name n8n -p 5678:5678 -v ~/.n8n:/home/node/.n8n n8nio/n8n\n```\n\n### 核心概念：节点（Node）\n\nn8n 中的每个节点代表一个特定的操作或步骤：\n- **触发器节点**：如 Schedule Trigger（定时触发）、Webhook Trigger\n- **AI 节点**：AI Agent 节点（提供大脑/记忆/工具三大组件）、Chat Model 节点\n- **工具节点**：HTTP Request 节点、内置 1000+ 连接器\n- **处理节点**：数据转换、Code 节点（支持 JS 表达式）\n\n### AI Agent 节点\n\nn8n 的 AI Agent 节点内置了 Agent 所需的三大基本组件：\n1. **大脑（Brain）** — 连接大语言模型（如 DeepSeek、OpenAI 等），负责推理和规划\n2. **记忆（Memory）** — Simple Memory 提供会话上下文持久化（可配置窗口大小）\n3. **工具（Tools）** — 内置连接器 + 社区节点 + 自定义 HTTP 请求\n\n### 集成能力\n\n- **内置连接器**：超过 1000 种，涵盖 Google、Notion、GitHub、WhatsApp、数据库等\n- **社区节点**：通过 npm 包名安装第三方节点（如飞书/Lark 节点）\n- **HTTP 请求**：对没有内置连接器的 API，可通过 HTTP Request 节点手动连接\n- **MCP 协议**：支持与 AI Agent（如 Claude Code）通过 MCP 协议通信\n\n## 核心架构模式：Agent + n8n 后端执行器\n\nn8n 在 AI 工程领域的最佳实践是作为\"后端执行器\"，与 AI Agent 前端编排层配合使用（详见 [[Agent_n8n_Backend]]）：\n\n```mermaid\ngraph LR\n    A[\"AI Agent 层<br/>灵活决策\"] -->|MCP / Webhook| B[\"n8n 执行层<br/>稳定执行\"]\n    B --> C[\"外部服务\"]\n```\n\n## 典型应用场景\n\n1. **AI 资讯情报站**：RSS 订阅 → AI 翻译 → 格式化 → 存入数据库\n2. **个人新闻日程早报 Agent**：每天 8:00 自动触发，查询新闻 + 日历 → 生成早报 → 推送群聊\n3. **信息筛选与评分**：爬取论文 → AI 分析打分 → 初级筛选\n4. **多工作流编排中枢**：一条工作流省 Token 不算什么，五条十条工作流每天执行的差距是天壤之别\n\n## 关联连接\n\n- [[Agent_n8n_Backend]] — AI Agent + n8n 后端执行器架构模式\n- [[DeepSeek]] — n8n 中常用的 LLM 大脑\n- [[飞书]] — n8n 集成的主要协作平台\n- [[Claude_Code]] — 通过 MCP 协议与 n8n 配合使用\n- [[OpenCode]] — 开源替代方案，同样支持 n8n MCP 集成\n- [[n8n-masterclass]] — n8n AI 自动化大师课来源\n- [[n8n-agent-tutorial]] — 从零构建 Agent 的实操教程\n- [[claude-code-n8n-agent-integration]] — Claude Code 自动编排 n8n 工作流\n- [[n8n工作流搭建]] — 工作流搭建方案对比与路线图\n- [[多Agent工作流]] — 多 Agent 流水线架构（n8n 的替代/互补方案）\n","飞书":"## 定义\n\n飞书（Feishu / Lark）是字节跳动（ByteDance）推出的企业协作平台，集成了即时通讯、文档、日历、多维表格、视频会议等核心功能。在 AI Agent 工作流中，飞书通过其开放的 API 体系扮演着\"数据源\"和\"通知终端\"的双重角色。\n\n## 在 AI Agent 中的核心能力\n\n飞书通过开放 API 提供以下 Agent 可用能力：\n\n### 1. 多维表格（Bitable）\n飞书的多维表格是一种类似数据库的电子表格工具，在 Agent 工作流中常用作：\n- **数据存储层**：存储采集的新闻、论文、研报等结构化数据\n- **查询接口**：Agent 通过飞书 API 条件过滤查询（如按创建时间 `isToday`/`isYesterday` 过滤）\n- **跨工作流共享**：多个工作流可以读写同一张多维表格\n\n**n8n 集成操作**：`Bitable → Get Many Records`，配合 JSON 筛选条件使用。\n\n### 2. 日历（Calendar）\n飞书日历提供日程管理功能，Agent 可通过 API：\n- **获取日程列表**：查询未来 N 天的个人日程安排\n- **上下文感知**：根据日程密度为 Agent 提供个性化建议（忙碌时推荐学习，空闲时推荐娱乐）\n\n**n8n 集成操作**：`Calendar → Get Event List`，时间参数需使用 UNIX 毫秒时间戳。\n\n### 3. 群机器人（Webhook Bot）\n飞书群机器人是 Agent 输出的重要通道：\n- **Webhook URL**：通过 POST 请求向指定群聊发送消息\n- **消息格式**：支持文本、富文本、卡片消息（`interactive` 格式）\n- **自定义标头**：需设置 `Content-Type: application/json`\n\n**n8n 集成操作**：HTTP Request 节点，Method=POST，Body 为 JSON 格式的飞书消息卡片。\n\n## 在 n8n 中的集成方式\n\n### 方式一：社区节点（推荐）\n通过 n8n 的社区节点功能安装非官方的飞书节点包（如 `n8n-nodes-lark`）：\n1. Settings → Community Nodes → Install a node\n2. 输入 npm 包名安装\n3. 填入飞书应用的 App ID 和 App Secret 完成凭证配置\n\n### 方式二：HTTP 请求直接调用\n对于社区节点不覆盖的飞书 API，可通过 HTTP Request 节点手动构造请求。\n\n## 飞书开放平台配置\n\nAgent 要访问飞书数据，需要在 [飞书开放平台](https://open.feishu.cn) 完成以下配置：\n\n1. **创建应用**：创建一个自定义应用\n2. **获取凭证**：从\"凭证与基础信息\"获取 App ID 和 App Secret\n3. **开通权限**：每个接口需单独开通权限（如多维表格权限、日历权限）\n4. **发布上线**：修改权限后需要在\"版本管理与发布\"中创建新版本并申请上线\n5. **获取资源标识**：\n   - 多维表格 Token 和 Table ID：从 URL 中提取\n   - 日历 ID：通过调试日历列表接口获取\n\n## 关联连接\n\n- [[n8n]] — 通过 n8n 社区节点与飞书集成\n- [[n8n-agent-tutorial]] — 使用飞书作为数据源和通知终端的实操教程\n- [[AI每日新闻]] — 飞书集成在新闻早报项目中的具体应用\n","MOC-AI-Agent":"# AI Agent\n\n## 基础概念\n\n- [[LLM]]\n- [[Memory]]\n- [[Tool_Use]]\n- [[RAG]]\n- [[ReAct]]\n\n## 工具\n\n- [[claude-code-install]]\n- [[n8n-masterclass]]\n- [[MCP]]\n\n## 来源\n\n- [[n8n-masterclass]]\n- [[claude-code-install]]\n","MOC-Knowledge-Management":"# 知识管理知识地图\n\n## 核心理念\n- [[知识库建设蓝图]] — 个人 Obsidian 知识库的结构设计与 AI 协作工作流\n\n## 知识管理工具\n- [[Obsidian]] — 本地 Markdown 知识管理工具\n\n## 相关概念\n- [[RAG]] — 检索增强生成：知识检索的技术实现\n- [[Memory]] — 记忆机制：知识的持久化存储\n- [[Tool_Use]] — 工具调用：知识获取与操作的手段\n","MOC-Prompt-Engineering":"# 提示工程知识地图\n\n## 核心概念\n- [[Prompt_Engineering]] — 提示工程总览\n\n## 提示技术\n- [[ReAct]] — 推理与行动结合的代理范式\n- [[RAG]] — 检索增强生成\n\n## 框架与方法论\n- [[5C_Framework]] — 5C Prompt Contract：极简、Token 高效的提示设计框架\n- [[Context_Engineering]] — 从单个提示到系统上下文管理的范式转变\n\n## AI 工程关联\n- [[AI_Led_vs_AI_Assisted]] — AI 主导 vs AI 辅助的分类框架\n- [[Claude_Code_Configuration]] — Claude Code 配置架构中的提示词设计\n","claude-code-docs":"## 核心摘要\n\nClaude Code 是 Anthropic 推出的终端原生 AI 编程代理工具，通过 Harness（马鞍）机制将大模型的推理能力与终端、文件系统、网络协议结合，实现自驱动的编程与自动化任务执行。其核心创新在于：通过 Skills 扩展系统、MCP 协议工具集成、三层记忆体系（CLAUDE.md / AGENT.md / MEMORY.md），使 AI 越用越了解用户，成为可深度定制的个人开发助理。\n\n## 核心架构\n\n### Harness 运行机制\n大语言模型（LLM）本身是静态的文本生成器，Claude Code 作为\"马鞍\"通过反复调度模型，配合工具调用和上下文管理，让静态模型展现出连贯的自驱操作能力。\n\n### 记忆系统\n- **CLAUDE.md** — AI 自身身份与行为人格定义\n- **AGENT.md** — 用户上下文、工作区信息、Obsidian 笔记路径\n- **MEMORY.md** — 持久化记忆存储：用户偏好、重要备忘、长期习惯\n\n### 配置体系\n六大配置组件（[[Claude_Code_Configuration]]）：\n1. **Skills** — 可插拔能力扩展单元（结构化 Markdown）\n2. **Agents** — 角色/身份定义\n3. **Commands** — 斜杠命令快捷方式\n4. **Rules** — 编程语言编码规范\n5. **Hooks** — 事件驱动的触发器\n6. **MCP** — Model Context Protocol 外部服务连接\n\n## 应用场景\n\n- **编程开发**：代码编写、Git 管理、调试修复、项目重构\n- **知识管理**：与 [[Obsidian]] 集成实现笔记整理、项目规划、日程管理\n- **工作流自动化**：通过 MCP 协议编排 [[n8n]] 工作流，实现固定流程的低成本自动执行\n- **个人助理**：个性化 Onboarding + 记忆系统，越用越贴合个人风格\n\n## 关联连接\n\n- [[Claude_Code]] — Claude Code 产品\n- [[Claude_Code_Configuration]] — 六大配置组件体系\n- [[hackathon-champion-config]] — 黑客松冠军配置仓库详解\n- [[claude-code-install]] — 国内直连安装指南\n- [[claude-code-obsidian-workflow]] — Claude Code + Obsidian 工作流\n- [[claude-code-n8n-agent-integration]] — Claude Code 自动编排 n8n\n- [[Obsidian]] — 本地 Markdown 知识管理工具\n","claude-code-install":"# 一句话总结\n\n解决国内直连网络与预算受限环境下，通过部署 Native 版 Claude Code 终端，并将其底层模型切换为高性价比国产多模态大模型 Kimi K2.6，实现绕过区域限制、零阻碍运行自驱动 AI 编程与 Agent 任务的问题。\n\n# 内容摘要\n\n本教程针对国内网络环境，手把手演示了如何在 Windows 上通过 PowerShell 极速安装官方推荐的 Native 版 Claude Code 客户端。为突破 Anthropic 的地区阻断限制并降低高昂的 API 调用成本，教程详解了通过直接修改本地 `.claude.json` 配置文件避开地区 onboarding 校验的方法，并配置 `settings.json` 使用月之暗面最新主力模型 Kimi K2.6（多模态 256K 超大上下文）作为替代引擎。此外，还实操演示了如何配置 MCP 浏览器控制（Playwright）抓取数据、利用 Bypass 权限模式避免繁琐的手动\"Approve\"授权、以及利用 Skills 现成能力包（如 Hyper Frames）高效完成 Markdown 文档向科普短视频的自动化生成。\n\n# 最终成果\n\n* **直连免翻墙运行**：无需折腾复杂的翻墙规则或海外 Anthropic 扣费账户，在 Windows 本地终端以极速响应直接唤起 Claude Code。\n* **低成本国产引擎平替**：成功将底座模型替换为价格仅为 Sonnet/Opus 几十分之一、但 Toolathlon (50%) 与 MCPMark (55.9%) 表现极佳的 Kimi K2.6，具备完整的代码理解、图片和视频多模态自主规划能力。\n* **全自主系统托管操作**：实现让 Claude Code 自动配置缺少的本地 Node 环境与 Git 依赖，利用 MCP 控制本地浏览器抓取并清洗网页数据，以及通过 Skills 一键将 Markdown 文本转换生成排版精美、动画震撼的视频剪辑作品。\n\n# 实操步骤\n\n### 步骤 1：启动 PowerShell 管理员窗口\n在 Windows 任务栏搜索框输入 `PowerShell`，右键选择\"以管理员身份运行\"。\n\n### 步骤 2：本地安装 Claude Code (Native 推荐方式)\n为了获得更快的启动速度和更稳定的自更新，执行官方 PowerShell 原生一键安装脚本（代替传统容易因依赖断裂报错的 npm 方式）：\n```powershell\nirm https://claude.ai/install.ps1 | iex\n```\n安装完成后，环境变量将自动添加。重启 PowerShell 终端以使配置生效。\n\n### 步骤 3：绕过地区限制检测（核心跳过 Onboarding 校验）\n由于国内 IP 限制，直接运行 `claude` 会遇到 unsupported region 报错。需要手动初始化配置文件来跳过 onboarding 校验。\n在终端执行以下命令创建并编辑全局主配置文件：\n```powershell\nnotepad $HOME\\.claude.json\n```\n在打开的文件中写入以下 JSON 内容，保存并关闭：\n```json\n{\n  \"hasCompletedOnboarding\": true\n}\n```\n\n### 步骤 4：配置 Kimi K2.6 兼容大模型\n1. 登录 [Moonshot AI 开放平台](https://platform.moonshot.cn/)，获取你的 API Key（建议首次充值 10~50 元即可无上限使用高配额）。\n2. 在终端执行命令打开用户配置文件：\n   ```powershell\n   notepad $HOME\\.claude\\settings.json\n   ```\n   *（注：若提示文件夹不存在，请在 `%USERPROFILE%` 目录下手动创建名为 `.claude` 的文件夹后再试）*。\n3. 在 `settings.json` 中，将其 `env` 配置区域修改为 Moonshot API 端点与 Kimi K2.6 模型，并填写你的 API Key：\n   ```json\n   {\n     \"env\": {\n       \"ANTHROPIC_BASE_URL\": \"https://api.moonshot.cn/anthropic\",\n       \"ANTHROPIC_AUTH_TOKEN\": \"YOUR_KIMI_API_KEY_HERE\",\n       \"ANTHROPIC_API_KEY\": \"YOUR_KIMI_API_KEY_HERE\",\n       \"ANTHROPIC_MODEL\": \"kimi-k2.6\"\n     }\n   }\n   ```\n   保存并关闭文件。\n\n### 步骤 5：启动并验证配置\n在工作目录（Project Directory）中输入以下命令启动：\n```powershell\nclaude .\n```\n第一次运行会询问是否信任当前目录，直接按 Enter 确认。输入 `你好`，若模型正常回复，且头部显示当前模型为 `Kimi-K2.6`，则说明国产化兼容网关配置成功。\n\n### 步骤 6：安装 MCP 控制浏览器（实现自主网络爬取）\n为了让 Agent 能够上网，需要添加 `playwright-mcp` 外部工具接口。在 Claude 命令行中直接输入：\n```text\n/mcp add playwright\n```\n若因为电脑缺少 Node.js 运行环境报错，直接对 Claude 下达指令：\n*\"我的 Playwright 报错了，请用尽一切方法帮我自动修复所有的本地环境依赖，并使其运行起来。\"*\nClaude 会调用系统工具，自动通过 `winget` 等工具补全 Node 等依赖并进行配置。完成后根据提示运行 `/resume` 恢复对话并输入 `/mcp` 验证。\n\n### 步骤 7：测试浏览器自主控制\n给 Claude 下达复合命令：*\"控制浏览器去百度搜索'什么是 MCP'，选择并阅读两篇优质的介绍，最后将内容总结并保存到本地的 markdown 文件中。\"*\n此时可看见终端展示灰色的工具调用记录和白色模型推理记录，自主完成检索、读取、总结和本地文件生成。\n\n### 步骤 8：配置 Bypass 权限模式（实现无人值守自驱动）\n默认状态下，Claude 执行任何写操作或系统命令都需要用户进行交互授权（Approve）。如果希望其全自动执行，可在 `settings.json` 的 `permissions` 项中配置自动绕过（**注意：仅在隔离或可信任项目目录中开启**）：\n```json\n{\n  \"permissions\": {\n    \"defaultMode\": \"bypassPermissions\"\n  }\n}\n```\n\n### 步骤 9：利用 Skills 实现一键 Markdown 转科普短视频\n安装编程视频剪辑 Skills（如 `hyper-frames`），直接让 Claude 帮你在本地配置并解决多媒体库及 Git 环境的补全。安装完成后，在终端中通过 `@` 符号选中刚刚生成的 `什么是MCP.md` 文件，直接命令其：*\"读取这个 md 文件，用 hyper-frames 技能包为其制作一个生动大气的科普视频。\"*\n\n# 关键配置\n\n* **`hasCompletedOnboarding`**：设为 `true` 写入 `~/.claude.json` 以绕过地域和服务资格阻断。\n* **`ANTHROPIC_BASE_URL`**：指定为 `\"https://api.moonshot.cn/anthropic\"` 指向 Kimi 的 Messages API 兼容网关。\n* **`ANTHROPIC_MODEL`**：指定为 `\"kimi-k2.6\"` 选定月之暗面专为长周期 Agent 任务与 MCP 设计的万亿级多模态模型。\n* **`defaultMode`**：指定为 `\"bypassPermissions\"` 启用高危但能彻底释放生产力的无人值守自驱动模式。\n\n# 命令速查\n\n```text\n/mcp        - 查看、连接与管理当前本地安装的 Model Context Protocol 外部服务\n/skills     - 检索与激活当前项目中安装的高阶技能包\n/compact    - 手动触发出上下文压缩，清理冗余的临时对话记忆，释放 Token 空间\n/context    - 快速查验当前会话的上下文 Token 占用百分比和模型开销\n/clear      - 彻底清空并重置当前上下文\n/resume     - 选择并恢复历史对话会话\n```\n\n# 常见问题与踩坑\n\n* **未授权地区限制报错**：在未连接 VPN 或处于未支持地区时，必须在 `%USERPROFILE%\\.claude.json`（全局配置文件）中写入 `\"hasCompletedOnboarding\": true`，否则无法越过启动层面的 onboard 地区阻隔。\n* **BypassPermissions 权限模式的安全隐患**：Bypass 模式下，大模型可以绕过所有人工确认执行危险的终端指令。大模型可能会因为对任务的误解误删用户文件目录（如误执行扩展到根目录的 `rm -rf`）。**强烈建议在开发容器（Dev Container）或虚拟机等隔离环境中开启此模式**。\n* **Windows 下因缺少 Git-Bash 产生环境报错**：Windows 平台运行 Skills 常常因为缺少本地 Git-Bash 或系统 Path 中没有 `bash.exe` 导致工具执行挂起。此时可直接在 Claude 窗口输入让其自动解决，它会通过包管理工具直接拉取依赖配置。\n\n# 底层逻辑\n\n* **Harness（马鞍）运行机制**：大语言模型（LLM）本身只是一个接收输入、输出概率文本的静态计算模型，无法主动操作宿主机。像 Claude Code 这样的 Agent 工具本质上是一个\"马鞍\"（Harness）——它通过复杂的规划机制，将大模型（思考核心）与终端、文件系统、网络协议进行包装，在执行复杂任务时会通过几十上百次地反复调度模型，从而让静态模型能够展现动态、连贯的自驱操作能力。\n* **上下文管理（Context Decay）**：在长时间、长序列的 Agent 运行中，大量的命令输入、运行输出会堆积在模型输入窗口，导致模型计算变慢、能力变笨并引起记忆扭曲（上下文腐烂）。通过 `/compact` 机制将前文的大量原始对话压缩（Summary）成高密度的语义节点，可大幅度释放上下文空间，确保模型推理的效率和准度。\n\n# 我的收获\n\n* 了解了 **Harness** 与 **LLM** 的关系：大模型是逻辑核心，而 Harness 则是将其执行力释放到本地物理环境的神经反射器。\n* Kimi K2.6 的性能重估：月之暗面专为 Agent 与 MCP 优化后的 K2.6 在调用稳定性（MCPMark 55.9%）上具有优异的商业落地价值，是极佳的高性价比 Claude Code 引擎平替。\n\n# 可执行行动\n\n以管理员身份运行 Windows PowerShell，执行 `install.ps1` 进行原生 Native 极速安装，并通过创建 `.claude.json` 绕过地区限制检测。\n\n# 是否值得长期保存\n\n* **保存价值**：**特高**\n* **理由**：该文档是一套完整的、针对国内直连开发者的 Native 版 Claude Code 终极平替落地指南。对于在地区限制和预算约束下的开发者，这是一份高实用性、能够长期高复用并释放本地生产力的底层自动化沉淀。\n","claude-code-n8n-agent-integration":"## 核心摘要\n\nUP主\"杰森的效率工坊\"系统讲解了如何将 Claude Code / OpenCode 等 AI 编码智能体与 n8n 工作流引擎集成，实现 **用自然语言自动生成 n8n 工作流** 的完整方案。核心架构是 **n8n 作为后端执行器 + AI Agent 作为前端编排层**——固定流程放入 n8n 工作流（省 Token、保密钥安全），AI Agent 只负责决策和调用。通过配置 n8n MCP 和 n8n Skills，AI Agent 可以直接根据自然语言描述创建、修改和执行 n8n 工作流，彻底告别手动拖拽节点。\n\n## 架构模式\n\n```mermaid\ngraph TB\n    subgraph \"AI 编排层\"\n    A[Claude Code / OpenCode<br/>自然语言交互]\n    end\n    subgraph \"MCP 通信\"\n    B[n8n MCP 协议<br/>AI ↔ n8n 桥梁]\n    end\n    subgraph \"n8n 执行层\"\n    C[n8n 工作流引擎<br/>固定流程执行器]\n    end\n    subgraph \"外部服务\"\n    D[Google Sheets / Gmail / RSS<br/>数据库 / API]\n    end\n\n    A -- \"创建/修改/执行工作流\" --> B\n    B -- \"API 调用\" --> C\n    C -- \"数据读写\" --> D\n\n    style A fill:#e3f2fd\n    style B fill:#fff3e0\n    style C fill:#e8f5e9\n    style D fill:#f5f5f5\n```\n\n## 环境搭建四步\n\n> [!info] 搭建思路\n> 环境搭建虽然需要一系列步骤，但搭建好后可以 **一劳永逸** 地用自然语言创建工作流。\n\n### 1. 安装 n8n\n- **NPM 安装**（快速尝鲜）：`npm install -g n8n`（需先装 Node.js）\n- **Docker 安装**（推荐）：`docker-compose up -d`，通过 compose.yaml 解锁隐藏节点并挂载本地文件夹\n\n### 2. n8n 初始化配置\n- 在 n8n 设置中创建 **N8N API Key**（用于 MCP 认证）\n- 创建 **Credential**：配置 AI 模型的 API Key（OpenAI / DeepSeek / GLM 等）\n\n### 3. AI Agent 配置\n\n> [!tip] 模型选择建议\n> 国产御三家（DeepSeek、GLM、小米 MiMo V2 Pro）都能很好地完成工作流编排任务。OpenCode 还提供免费模型额度。\n\n**Claude Code 配置：**\n```bash\n# 指定转接模型（受限制地区可用）\nexport ANTHROPIC_BASE_URL=\"your_proxy_url\"\nexport ANTHROPIC_AUTH_TOKEN=\"your_api_key\"\nexport ANTHROPIC_API_KEY=\"your_api_key\"\nexport ANTHROPIC_MODEL=\"your_model_name\"\n```\n\n**OpenCode 配置：**\n- 下载桌面客户端，图形化界面\n- 在用户目录 `.config/OpenCode/` 下创建 skills 文件夹\n- 配置 OpenCode.json 中的 MCP 设置\n\n### 4. 安装 n8n Skills 和 MCP\n- 从 GitHub 下载 n8n Skills 仓库（星标最多的），放入 Claude Code 的 skills 文件夹\n- 在 `.claude.json`（或 OpenCode.json）中添加 n8n MCP 配置，填入 N8N API Key\n\n## 实战演示\n\n> [!example] AI 论文情报站工作流\n> 提示词要求智能体创建一个工作流：从 Google DeepMind RSS 订阅获取最新 AI 论文 → AI 翻译整理 → 格式化 → 保存到 n8n 内置数据表格。\n> \n> **全程无需手动拖拽节点**，只发送自然语言提示词即可。\n\n### 关键步骤\n1. 将 **Credential ID** 发送给智能体（用于关联 API 密钥）\n2. 智能体自动创建所有节点并验证\n3. 执行工作流验证结果\n4. 如需修复：将节点错误信息发给 AI，AI 自动排查修复\n\n### 效果\n- 工作流执行成功后，DeepMind 最新 10 篇文章已翻译好保存到表格\n- 包含文章标题、内容简介和原文地址\n- 翻译质量良好（如 \"Gemini 3.1 Flash Live\" 准确翻译）\n\n## 核心优势：为什么用 n8n + AI Agent 而不是纯 AI Agent\n\n> [!quote] 社区共识\n> \"把固定性的流程编排成 n8n 工作流，与智能体结合使用，是目前社区普遍最认可的方式。\"\n\n| 维度 | 纯 AI Agent（如 OpenClaw） | n8n + AI Agent 组合 |\n|------|---------------------------|---------------------|\n| Token 消耗 | 每次执行都消耗大量 Token（灾难级） | 仅创建工作流时消耗，执行几乎免费 |\n| 密钥安全 | API Key 直接暴露给 Agent | Credential 封装在 n8n 中，对外只暴露 API |\n| 错误调试 | 黑盒难定位 | 精确到节点，直观可调试 |\n| 重复任务 | 每次重新推理 | 一次封装，反复执行 |\n| 数据隐私 | 第三方 Agent 可能接触敏感数据 | 数据在本地 n8n 流转 |\n\n### 作者实际使用的 4 条工作流\n- Arxiv 论文爬取 + AI 分析评分（初级筛选）\n- Reddit 帖子爬取\n- OpenAI / Google 开发者 Blog 追踪\n- Anthropic Blog 追踪\n\n## 关联连接\n\n- [[Claude_Code]] — Claude Code 产品\n- [[OpenCode]] — 开源 AI 编码代理，支持免费模型\n- [[Agent_n8n_Backend]] — AI Agent + n8n 后端执行器架构模式\n- [[n8n-masterclass]] — n8n 低代码自动化平台\n- [[Claude_Code_Configuration]] — Claude Code MCP 和 Skills 配置\n","claude-code-obsidian-workflow":"## 核心摘要\n\nB站 UP 主\"大牙大-\"分享了自己使用 Claude Code + Obsidian 超 2 个月的真实工作流经验，展示了如何让 AI 成为==越用越了解你==的私人助理。核心思路是利用 Claude Code 天然擅长读写 Markdown 的特性，与同样基于 Markdown 的 Obsidian 无缝结合。视频覆盖四大环节：让 AI 了解你（通过导入旧笔记进行个人化 Onboarding）、利用 Memory 机制记录偏好和备忘、用 AI 完成笔记整理/项目规划/日程管理、将固定工作流程封装为 Skill。\n\n%% 备注：该工作流已在作者的真实生产环境中运行超 2 个月，非概念验证 %%\n\n> [!quote] 核心心法\n> Claude Code 的核心文件（CLAUDE.md、AGENT.md、Skills）全部是 Markdown 文件，而 Obsidian 本质上就是本地 Markdown 文件的阅读编辑软件——**AI 天然就擅长读写 Markdown**。\n\n## 四个核心环节\n\n```mermaid\ngraph LR\n    A[Personal Onboarding] --> B[Memory 记忆]\n    B --> C[笔记与项目管理]\n    C --> D[Skill 固化]\n    D -.->|持续积累| B\n    \n    style A fill:#e1f5fe\n    style B fill:#fff3e0\n    style C fill:#e8f5e9\n    style D fill:#f3e5f5\n```\n\n### 1. 让 AI 了解你（Personal Onboarding）\n\n> [!info] 关键文件体系\n> - **CLAUDE.md** — AI 自身的身份/人格定义\n> - **AGENT.md** — 用户上下文、工作区信息、Obsidian 笔记路径\n\n- 创建个人工作笔记 ==模板==\n- 将旧笔记（如 Notion 导出）批量导入，让 AI 通读以了解写作风格、工作习惯\n- 告诉 AI 你的 ==个人偏好==（写作细节、设备平台等信息）\n- 让 AI 将\"关于我\"的总结写成笔记并记录路径到 `AGENT.md` 或 `CLAUDE.md` 中\n- 后续所有对话，AI 自动参考这些文件\n\n### 2. 学会用 AI 的记忆功能\n\n> [!tip] 记忆示例\n> - \"`记一下，以后和我交流时全程用中文，中英文之间不留空格`\" → AI 自动写入 MEMORY.md\n> - \"`以后每个月19号晚上沟通晚报时，提醒我看银行卡账单`\" → AI 设置每月提醒\n\n- Claude Code 的 Memory 机制会 **主动记录** 用户的偏好、要求和重要信息\n- 支持长期备忘（如\"每月 19 号提醒查看银行卡账单\"）\n- AI 甚至会 **主动记录** 它认为重要的信息\n- ==越用越了解你==——长期使用后回答更贴合个人风格\n\n### 3. AI 驱动的笔记与项目管理\n\n#### 语音速记 → AI 整理\n1. 用 ==MyType==（vibe coding 自制的语音输入法 ^[已 GitHub 开源，可在项目中搜索]）快速记录灵感\n2. AI 将散乱内容梳理出逻辑结构、提炼核心观点、检查错误\n3. AI 把讨论内容自动写入 Obsidian 笔记，==省去手动整理==\n\n#### 日程追踪看板\n\n> [!example] AI 看板工作流\n> - **每天工作结束**：和 AI 同步今日进度 → AI 整理更新看板 → 提供情绪价值\n> - **次日工作开始**：AI 根据看板告知今日待办、紧急事项、备忘提醒\n\n- AI **自动创建并维护** Markdown 格式的项目看板\n- 看板内容专供 AI 阅读（人类无需手动查看）\n- 作者感觉像有了一个真正了解自己的好搭档\n\n### 4. 将固定工作做成 Skill\n\n> [!success] 效果\n> 作者说：*\"我的 AI 在做晚报 Skill 的时候，自己在末尾写了'语气大牙，晚上可能累了，热情但简洁别啰嗦'——我看到的时候真的觉得很暖心。\"*\n\n- 将日报/晚报这类固定重复流程封装为 ==Skill==\n- **只需一个命令**（如 `/晚报`）即可触发完整工作流\n- AI 按预设流程自动执行：了解情况 → 记录 → 更新看板 → 提醒事项\n- 通过 Memory 实现关键词自动触发（说到\"晚报\"就自动调用 Skill）\n\n## 实操要点\n\n- 使用 VS Code 集成 Obsidian 仓库，可在文件列表直接查看编辑笔记\n- 语音输入法 [[MyType]] 已 GitHub 开源\n- 该工作流已让作者 ==放弃使用了 5 年的 Notion==，全面转向 Obsidian\n\n> [!faq]- 这套工作流适合我吗？\n> 适合**任何使用 AI 编程工具（Claude Code / Codex / Cursor 等）且用 Markdown 记笔记的人**。核心思路是相通的——让 AI 读写本地 Markdown 文件，不同的只是软件本身。\n\n## 关联连接\n\n- [[Claude_Code]] — Claude Code 产品\n- [[Obsidian]] — Obsidian 笔记工具\n- [[Claude_Code_Configuration]] — Claude Code 配置架构\n- [[skills]] — 15 个实用 Skills 推荐\n- [[hackathon-champion-config]] — 黑客松冠军的 Skill 写法参考\n- [[知识库建设蓝图]] — 知识库设计与 AI 协作工作流\n","hackathon-champion-config":"## 核心摘要\n\nB站 UP 主\"奇思妙想CYC\"详细解读了 Anthropic 官方黑客松冠军开源的 Claude Code 配置仓库（18 万+ Star）。该仓库包含 48 个 Agent 角色、182 个 Skill、68 个自定义命令，以及完整的 Rules、Hooks、MCP 配置体系。视频重点讲解了 Skill 的标准写法（名称/描述/触发条件/核心规则/禁止项/工作流/嵌套）、Agent 角色定义、Command 命令、Rules 语言规则、Hooks 钩子触发器和 MCP 配置，并演示了如何按需将仓库中的 Skill 复制到本地 Claude Code 使用。\n\n## 仓库核心结构\n\n| 目录 | 内容 | 数量 |\n|------|------|------|\n| `skills/` | 能力定义（标准 Markdown 文件） | 182 个 |\n| `agents/` | 角色/身份定义 | 48 个 |\n| `commands/` | 斜杠命令 | 68 个 |\n| `rules/` | 各编程语言编码规范 | 多语言 |\n| `hooks/` | 事件驱动的触发器 | 20+ 个 |\n| `mcp/` | MCP 外部服务配置 | - |\n\n## Skill 的标准写法\n\n每个 Skill 是结构化的 Markdown 文件，包含：\n\n1. **名称与描述** — Skill 的名字和一句话说明\n2. **触发条件** — 何时自动启用（如起草博客、整理笔记时）\n3. **核心规则** — 行为准则（先给实例、用证据替代形容词、不捏造事实等）\n4. **禁止项** — 明确禁止的内容（如\"在当今快速变化的时代\"这类空洞表述）\n5. **工作流** — 完整执行流程（明确受众→建立大纲→展开→删改）\n6. **结构指南** — 按不同类型（技术指南/随笔/观点/通讯）分别规范\n7. **嵌套 Skill** — 可在 Skill 内调用其他 Skill（如调用 Brain-Boys Skill）\n8. **语气处理** — 写作风格和语气规范\n\n## 特色 Skill 示例：Brain-Boys\n\n从真实素材中构建持久的声音档案，在所有场景中复用此档案，无需每次都从头推导风格。包含完整的收集工作流、节奏/句子长度/大小写/括号用法规范，以及默认风格和硬性禁令。\n\n## Agent 角色定义\n\n每个 Agent 定义包含：角色名称、描述、可用工具、提示词防御极限（不能做什么/可以做什么）、审查或工作流程规范。定义好后可通过对话直接调用该角色执行任务。\n\n## Hook 钩子系统\n\nHook 是事件触发器，在 Claude Code 执行特定操作之前或之后自动触发。例如：\n- `pre-compact` — 在执行 `/compact` 之前执行某命令\n- `session-start` — 开启新上下文之前执行某命令\n\n## 安装方式\n\n1. **Plugin 一键安装**：将整个仓库的 Skills/Commands/Hooks 全部安装\n2. **按需复制**：推荐方式——克隆仓库后，只复制需要的 Skill 文件夹到 Claude Code 的 skills 目录\n\n## 关联连接\n\n- [[Claude_Code]] — Claude Code 产品\n- [[Claude_Code_Configuration]] — Claude Code 配置架构体系\n- [[ClawHub]] — Skills 市场平台\n","n8n-agent-tutorial":"# 一句话总结\n\n解决如何利用本地部署的开源低代码工具 n8n，将大语言模型（DeepSeek）、外部知识库（飞书多维表格）与日程（飞书日历）进行动态连接，低成本自建具备自主决策与执行能力的个人新闻日程早报 AI Agent 的问题。\n\n# 内容摘要\n\n本教程详细讲解了 AI Agent 的核心定义、其与传统自动化工作流的区别，以及 Agent 的三大支柱：大脑（LLM）、记忆（Memory）、工具（API & Nodes）。实操部分提供了完整的复现路径：通过 Docker 在本地部署免授权的 n8n，在 n8n 内安装飞书社区节点，配置 DeepSeek R1/V3 作为大脑并设定会话记忆，调用飞书 API 动态检索多维表格中的新闻和日历日程，最后编写系统提示词（System Prompt）驱动大模型自主决策，并通过 HTTP POST 请求将定制化的富文本早报推送到飞书群机器人。\n\n# 最终成果\n\n* 成功在本地搭建不依赖外部收费 SaaS 平台的个人专属工作流与 Agent 编排引擎。\n* Agent 每天早上 8:00 自动触发，自主决策调用飞书工具拉取最近 2 天的 AI 新闻以及未来 7 天的个人日程。\n* 若数据拉取为空，Agent 能根据提示词逻辑自适应做出反应（如推荐娱乐、看电影），而非发生系统报错崩溃。\n* 将排版优雅、逻辑清晰的结构化早报动态推送到指定的飞书群组。\n\n# 实操步骤\n\n### 步骤 1：准备 Docker 环境\n1. 下载并安装 [Docker Desktop](https://www.docker.com/)。\n2. 打开 Docker 桌面端，点击右上角 `Settings`（设置） -> `Resources`（资源）。\n3. 在 `Disk image location` 中，将拉取的镜像存储位置修改到系统盘以外的非系统分区，以防 C 盘爆满，配置完成后应用并重启。\n\n### 步骤 2：本地拉取并部署 n8n\n1. 打开终端（CMD、PowerShell 或 Terminal），输入拉取并运行 n8n 的 Docker 指令（见下方命令速查区）。\n2. 容器跑通后，在 Docker 桌面端找到 n8n 容器，点击链接或在浏览器直接访问 `http://localhost:5678` 登录本地 n8n 控制台。\n\n### 步骤 3：建立新项目并添加定时触发器\n1. 在 n8n 主界面点击 `Create first workflow` 新建空白工作流。\n2. 点击中间的 `Add first step`，在搜索框中搜索并添加 `Schedule Trigger`（定时触发器）。\n3. 在参数设置中，将执行时间配置为每天上午 `08:00 AM`。\n\n### 步骤 4：引入 AI Agent 核心节点与 DeepSeek 大脑\n1. 点击定时触发器节点右侧的 `+` 号，选择 `Advanced AI` 分类下的 `AI Agent` 节点。\n2. **连接大脑**：点击 AI Agent 节点下方 `Model` 处的 `+` 号，搜索并选择 `DeepSeek Chat Model`（或通用 OpenAI 接口）。\n3. **获取 API Key**：登录 [DeepSeek 开放平台](https://platform.deepseek.com/)，在\"API 密钥\"管理页创建一个新 Key，复制保存。\n4. **绑定凭证**：回到 n8n 界面，在 DeepSeek 节点的 `Credential` 下点击 `Create New Credential`，将刚才复制的 Key 粘贴进去。测试连接显示绿色即为成功。在模型下拉框中根据需求选择 `deepseek-chat` (V3) 或 `deepseek-reasoner` (R1)。\n\n### 步骤 5：配置 Agent 短期记忆\n1. 在 AI Agent 节点的 `Memory`（记忆）槽位，点击 `+` 号，选择 `Simple Memory`。\n2. 在参数窗口中，将 `Window Size`（记忆窗口）设置为 `5`，使 Agent 在单次运行交互中能够保留过去 5 轮的上下文信息。\n\n### 步骤 6：安装飞书社区节点\n1. 点击 n8n 界面左下角 `Settings`（设置） -> `Community Nodes`（社区节点） -> 点击 `Install a node`。\n2. 在输入框中粘贴飞书的 npm 社区包名（例如常见的开源飞书节点包名，如 `n8n-nodes-lark` 或根据实际搜索复制的包名），点击安装并等待完成。\n\n### 步骤 7：配置飞书应用凭证\n1. 登录 [飞书开放平台后台](https://open.feishu.cn/app)，点击\"创建自定义应用\"。\n2. 在应用管理页面的\"凭证与基础信息\"中，复制 `App ID` 和 `App Secret`。\n3. 进入应用的\"权限管理\"，勾选并开通以下权限：\n   * *多维表格权限*：获取及操作多维表格数据。\n   * *日历权限*：读取、获取日历日程列表。\n4. 在\"版本管理与发布\"中创建一个新版本并申请上线（企业内部自用通常会自动通过）。\n5. 在 n8n 工作画布中，点击 AI Agent 节点的 `Tools` 槽位，添加 `Lark/飞书` 节点。点击 `Create New Credential`，填入 `App ID` 和 `App Secret` 完成绑定。\n\n### 步骤 8：配置飞书多维表格（新闻检索工具）\n1. 在飞书节点的 `Resource` 处选择 `Bitable (多维表格)`，在 `Operation` 处选择 `Get Many Records`（查询记录）。\n2. **提取 Token 和 ID**：在浏览器打开你的多维表格，其 URL 格式通常为 `.../bitable/bascnXXXXXXXXXXXXXXXXX?table=tblYYYYYYYYYYYYYYYY`。其中：\n   * `bascnXXXXXXXXXXXXXXXXX` 即为 **Bas Token / App Token**。\n   * `tblYYYYYYYYYYYYYYYY` 即为 **Table ID**。\n   * 将这两段字符串分别复制并粘贴填入 n8n 对应字段。\n3. **编写筛选请求体**：\n   * 将操作配置下方的筛选体（Filter）切换为 JSON 模式，写入用于过滤\"今天\"或\"昨天\"上传新闻的 JSON 结构体（见下方关键配置区）。\n\n### 步骤 9：配置飞书日历（日程管理工具）\n1. 在 AI Agent 的 `Tools` 槽位再次添加一个 `Lark/飞书` 节点，将其重命名以作区分。\n2. 资源选择 `Calendar (日历)`，操作选择 `Get Event List`（获取日程列表）。\n3. 获取日历 ID（Calendar ID）：可以利用飞书节点的 `Get Calendar List`（获取日历列表）方法调试并提取对应账户下的日历 ID（通常为 `primary` 或一串类似邮箱的字符）。\n4. 在时间限制选项中，将开始时间（Start Time）与结束时间（End Time）切换为 `Expression`（表达式输入），填入用于计算当天 0 点和 7 天后 UNIX 时间戳的 JavaScript 表达式（见下方关键配置区）。\n\n### 步骤 10：使用 HTTP Request 配置发包工具\n1. 在飞书群聊中，点击 `设置` -> `群机器人` -> `添加机器人` -> 选择 `自定义机器人 (Webhook)`。\n2. 复制生成的 Webhook URL 地址。\n3. 在 n8n 画布中，从 AI Agent 节点的右侧输出端拉出一条连接线，添加一个 `HTTP Request` 节点。\n4. 配置该节点参数：\n   * `Method` 选择 `POST`。\n   * `URL` 粘贴刚才复制的群机器人 Webhook 地址。\n   * `Headers` 中添加：`Name: Content-Type`，`Value: application/json`。\n   * `Body Content Type` 选择 `JSON`。\n   * 将内容体（Body）切换为表达式模式，引用上游 AI Agent 节点的输出结果（通过拖拽参数引用，如 `{{ $json.output }}`），包裹在飞书群消息卡片的 JSON 模板中（具体卡片模板根据飞书开发文档决定，核心是动态绑定 Agent 的文本输出）。\n\n### 步骤 11：配置 Agent 系统提示词（System Prompt）\n1. 回到 AI Agent 节点，将输入类型（Input Context）改为定义模式，在 Prompt 文本框中写入结构化指令。\n2. **指令设计需包含以下部分**：\n   * *角色定位*：你是一个高效的个人新闻与日程助理。\n   * *任务定义*：每天分析拉取的飞书多维表格新闻及飞书日历日程。\n   * *工具说明*：你可以随时调用新闻工具和日程工具获取最新上下文。\n   * *逻辑路径*：如果当天有 AI 新闻，总结核心大意并对照日程安排，给出今日学习或工作建议；如果无新闻且有日程空余，则友好推荐生活或电影娱乐。\n   * *输出格式*：严格排版为结构清晰、重点突出的早报格式。\n\n### 步骤 12：保存并点击执行\n1. 点击顶部菜单栏的 `Save`（保存）。\n2. 点击工作区下方的 `Test step` 或全局的 `Listen for test event`（测试工作流）执行测试，观察飞书群内是否成功接收到卡片早报。\n\n# 关键配置\n\n* **多维表格当天/昨天上传新闻的过滤 JSON (Request Body)**:\n  ```json\n  {\n    \"filter\": {\n      \"conjunction\": \"or\",\n      \"conditions\": [\n        {\n          \"field_name\": \"创建时间\",\n          \"operator\": \"isToday\"\n        },\n        {\n          \"field_name\": \"创建时间\",\n          \"operator\": \"isYesterday\"\n        }\n      ]\n    }\n  }\n  ```\n* **飞书日历毫秒级 UNIX 时间戳 JS 表达式 (Time Range)**:\n  * **今日起始点（Start Time）**:\n    ```javascript\n    {{ new Date(new Date().setHours(0,0,0,0)).getTime() }}\n    ```\n  * **7天后结束点（End Time）**:\n    ```javascript\n    {{ new Date(new Date().setHours(23,59,59,999) + 7 * 24 * 60 * 60 * 1000).getTime() }}\n    ```\n* **HTTP Webhook 默认标头 (Headers)**:\n  * 配置项：`Content-Type`\n  * 参数：`application/json`\n\n# 命令速查\n\n在终端运行的 n8n 容器部署与控制命令：\n\n```bash\n# 在 Docker 中持续拉取并运行 n8n 容器 (端口映射为本地 5678 端口)\ndocker run -d --name n8n -p 5678:5678 -v ~/.n8n:/home/node/.n8n n8nio/n8n\n\n# 当需要手动停止 n8n 服务时\ndocker stop n8n\n\n# 再次手动启动已停止的 n8n 容器\ndocker start n8n\n```\n\n# 常见问题与踩坑\n\n* **飞书开放平台报错：权限未开通或未生效**：\n  * *问题*：执行查询飞书节点时，提示 `No permission` 或类似权限越界报错。\n  * *原因*：在飞书开放平台勾选权限后，未进行\"版本创建与申请上线发布\"。\n  * *解决*：每次修改应用权限，都必须在飞书应用管理后台进入\"版本管理与发布\"，点击\"创建版本\"并再次提交审核上线，生效后权限才能正式下放到 API。\n* **飞书日历查询返回数据不符合预期**：\n  * *问题*：日历节点报错，提示时间格式或参数无效。\n  * *原因*：飞书的日历接口要求传入的时间戳必须是数字型 UNIX 毫秒时间戳（Timestamp），时区计算错误会导致返回空白。\n  * *解决*：使用表达式配置，通过 JS 执行原生的 `getTime()` 换算，并严格过滤到毫秒级。\n* **群机器人发送卡片返回 400 Bad Request**：\n  * *问题*：HTTP 节点向飞书 Webhook 机器人发包时报错。\n  * *原因*：飞书卡片 JSON 消息体格式非常严格（如 `msg_type` 必须指定为 `interactive`，文本必须存放在嵌套的 `content` 内）。\n  * *解决*：参照飞书官方开发者文档提供的\"卡片消息 JSON 示例\"进行包裹，或先在飞书的\"可视化卡片搭建工具\"中测试通过后，再粘贴进 n8n。\n\n# 底层原理\n\n* **自动化工作流与 AI Agent 的本质区别是什么？**\n  * **自动化工作流（Workflow）**：是一套\"确定性程序\"。从节点 A 到节点 B 再到节点 C，每一步的判定条件和路径都由开发者在设计时用硬编码或连线规则固定死，系统不具备任何临时变通和推理能力。\n  * **AI Agent**：是一种\"非确定性推理系统\"。它引入了大语言模型的逻辑推理和反思能力（Reasoning）。开发者提供给 Agent 工具和任务目标，Agent 运行期间根据具体输入，自主拆解任务、自行决定先查日历还是先查新闻，并提取相关工具的输出合并分析，具备自适应决策能力。\n* **为什么要把 API 转化为 Tool 塞入 Agent？**\n  LLM 本身无法获取实时外界信息。把 API 抽象并注册成 Agent 的 Tool，本质上是向模型提供了一个\"函数说明书\"。大模型在执行推理时，发现自身知识库无法回答当前问题，会通过匹配说明书来输出符合该 API 规范的调用参数（Function Calling），从而借用外部工具获取实时世界状态。\n\n# 我的收获\n\n* **AI 工具链组装的结构性框架**：无论多高级的 Agent，其底层积木结构永远是\"大脑 + 记忆 + 工具\"这三个组件，这一架构在扣子（Coze）、Dify 以及 n8n 中是完全通用的。\n* **掌握 API 请求与 JSON 的实际运用**：了解了 HTTP 请求（GET、POST）和 JSON 格式是如何连接两个物理隔离的互联网软件（n8n 与飞书），降低了技术神秘感，建立起了互联网协议通信的基础。\n\n# 可执行行动\n\n1. 下载并启动 Docker 桌面端，在终端运行命令拉取 n8n 镜像并跑通。\n2. 注册 DeepSeek API 并获取 Key，配置本地的第一个 `AI Agent + Simple Memory` 节点，完成简单的连续对话测试。\n3. 创建飞书自建应用，拿到 App ID 和 App Secret，尝试使用 n8n 发送一条简单的多维表格新增数据。\n\n# 是否值得长期保存\n\n* **保存价值**：**高**\n* **理由**：n8n 是目前开源、免费且在本地化部署领域最为强大的 AI 自动化瑞士军刀。相较于在线付费工作流工具（如 Make、Zapier），本地 Docker 部署的 n8n 具有极高的数据隐私安全性且无额度限制。一旦掌握了该平台，可以作为个人或企业后续所有自动化脚本、Agent 中枢系统的首选底层框架。\n\n## 关联连接\n\n- [[n8n]] — 开源低代码自动化平台，本教程的核心工具\n- [[DeepSeek]] — 本教程中使用的 LLM 大脑模型提供商\n- [[飞书]] — 本教程中使用的数据源和通知终端平台\n- [[Agent]] — AI Agent 全面理解：核心能力与架构\n- [[Agent_n8n_Backend]] — AI Agent + n8n 后端执行器架构模式\n- [[n8n-masterclass]] — n8n AI 自动化大师课（进阶内容）\n- [[n8n工作流搭建]] — 工作流搭建方案对比与路线图\n","n8n-masterclass":"# 一句话总结\n\n解决如何利用低代码自动化平台 n8n，从零开始安全绑定外部服务（Google Sheets、Gmail 等），并无缝整合大语言模型、向量数据库（Pinecone RAG）与网络检索（Tavily AI），构建具备联网搜索和私有知识检索能力的==企业级 AI Agent 工作流==的问题。\n\n%% 本教程是完整的 n8n Master Class，覆盖 4 个 Level：从基础表单自动化到 AI Agent + RAG 联网搜索高阶实战 %%\n\n## 学习路径总览\n\n```mermaid\ngraph LR\n    L1[Level 1: 基础<br/>表单自动化] --> L2[Level 2: 进阶<br/>LLM 个性化邮件]\n    L2 --> L3[Level 3: 高阶<br/>RAG 向量知识库]\n    L3 --> L4[Level 4: 终极实战<br/>Webhook + 联网搜索 Agent]\n    \n    style L1 fill:#e3f2fd\n    style L2 fill:#e8f5e9\n    style L3 fill:#fff3e0\n    style L4 fill:#f3e5f5\n```\n\n# 内容摘要\n\n本视频教程由 ==HC 老师==主讲，是一部系统性的 n8n AI 自动化大师课。内容不仅对比了 n8n 与主流工具（Zapier、Make）的成本与控制权优势，还深度剖析了 n8n 的底层逻辑。主要教学路径包括：\n\n1. **基础阶段（Level 1）**：JSON 结构读解、Google Cloud OAuth 认证配置、SaaS 表单自动化分类处理、数据固定（Pinning）与容错重试配置。\n2. **进阶阶段（Level 2）**：利用 OpenRouter 集成大模型，根据表单动态上下文渲染具有温度的个性化 HTML/CSS 邮件。\n3. **高阶阶段（Level 3）**：解析 RAG 原理，利用 Pinecone 向量数据库与 Google 嵌入模型构建公司私有知识库，赋能 Agent 答疑。\n4. **终极实战（Level 4）**：通过 Webhook 联动会议工具（Cal.com），在客户预约的瞬间自动触发 Agent 联网搜索（Tavily AI API），生成结构化会前研究报告并推送至团队邮箱。\n\n## 最终成果\n\n> [!success] 三大实战成果\n> - **表单自动响应系统**：对不同预算（低于 \\$200、\\$200-\\$1000、\\$1000+）的客户表单自动完成数据建档、定制化 HTML 邮件回复以及团队内部通知\n> - **私有 RAG 知识库**：AI Agent 精准调阅 Pinecone 向量数据库中的 PDF 说明书，严格基于文档内容回答客户提问\n> - **会前研究报告自动生成**：客户预约时，Agent 自动调用 Tavily 搜索进行痛点和行业研究，生成带超链接引用的专业分析报告\n\n# 实操步骤\n\n### 阶段一：建立基础自动化流与 Google Cloud OAuth 绑定\n* **步骤 1：创建项目并初始化表单触发器**  \n  新建工作流并命名为 `Form_Sheet_Gmail`。添加 `n8n Form Trigger` 节点，配置表单字段：姓氏、名字、Email、预算（下拉菜单选项：0-200, 200-1000, 1000+ 美元）以及具体需求。在 `Add Option` 中关闭底部的 n8n 推广水印。\n* **步骤 2：配置 Google Cloud 开发者凭证 (OAuth 2.0)**  \n\n> [!warning] OAuth 安全警告\n> 首次绑定 Google Sheets / Gmail 时，浏览器会弹出红色危险警告——这是正常现象。点击\"高级\"→\"转到 n8n（不安全）\"即可完成本地测试授权。项目处于 Google Console 的 Testing 阶段，发布后可消除此警告。\n\n  在 n8n 中添加 `Google Sheets` 节点。复制该节点中提供的 `OAuth Redirect URL`。登录 [Google Cloud Console](https://cloud.google.com/)：\n  1. 新建项目并命名为 `n8n`。\n  2. 进入 `OAuth consent screen`，选择 `External`，填写应用名称与开发者邮箱，直接保存。\n  3. 点击 `Credentials` -> `Create Credentials` -> `OAuth client ID`。\n  4. 类型选择 `Web application`。在 `Authorized redirect URIs` 中粘贴刚才从 n8n 节点复制的 URL，点击创建。\n  5. 获取并复制生成的 `Client ID` 和 `Client Secret`。\n* **步骤 3：在 n8n 中激活 Google 服务绑定**  \n  在 Google Cloud 项目的 `Enabled APIs & services` 中搜索并启用 `Google Sheets API` 和 `Google Drive API`。回到 n8n 的 Google Sheets 节点凭证配置中，选择 `OAuth2`，粘贴刚才获取的 `Client ID` 与 `Client Secret`，点击 `Sign in with Google` 登录账号并授权。\n* **步骤 4：配置表格数据合并及动态更新写入**  \n  将 Google Sheets 节点的操作设置为 `Append or Update Row in Sheet`。使用 Email 字段作为唯一比对标识（比对列：Email），若不存在则新增一行，若已存在则更新。\n* **步骤 5：使用简易 JS 表达式处理日期与条件判断**  \n  对于写入表格中的日期，在表达式输入框中写入系统当前日期：`{{ new Date().toLocaleDateString() }}`。对于\"是否拒绝\"这一开关字段，编写如下 ==JavaScript 三元表达式==判定预算是否属于最低档（0-200）：\n  `{{ $json.budget === '0-200 USD' ? true : false }}`\n\n> [!tip] 表达式小贴士\n> - 字段名含空格时（如 `First Name`），必须用方括号：`{{ $json[\"First Name\"] }}`\n> - 建表时尽量用下划线 `first_name` 或驼峰命名，**避免使用空格**\n* **步骤 6：配置分支过滤器与分流控制**  \n  增加 `Filter` 节点（命名为 `Filter_Below_200`），将条件类型配置为 `String`，当预算不是 `0-200 USD` 时，允许数据向下游流通。在下游添加 `Switch` 节点实现预算分流：\n  * **分流路径 1**：如果预算为 `1000+ USD`，流向\"优先接洽信件\"生成。\n  * **分流路径 2**：如果预算为 `200-1000 USD`，流向\"追踪信件\"生成。\n\n### 阶段二：集成 LLM 生成个性化邮件\n\n> [!info] Level 2 核心转变\n> 从固定模板邮件 → **LLM 动态生成**个性化邮件。难度不高但效果显著提升——每封邮件根据客户填写的具体需求定制，告别千篇一律。\n\n* **步骤 7：注册 OpenRouter 集中式模型分发平台**  \n  登录 [OpenRouter](https://openrouter.ai/) 平台，使用 Google 账号登录。点击 `Keys` -> `Create a Key`，命名并复制生成的 API Key。\n* **步骤 8：在 n8n 中添加大语言模型调用节点**  \n  在 n8n 的 Switch 节点后拉出连线，选择 `Advanced AI` -> `Basic LLM Chain`。在 `Model` 槽位点击添加 `OpenRouter`，绑定凭证，并在模型列表选择需要的模型（如 `google/gemini-2.0-flash-exp:free`）。\n* **步骤 9：编写个性化 System 提示词与 User 变量导入**  \n  在 Basic LLM Chain 的 `System Message` 中，定义模型角色（你是撰写后续追踪邮件的专家，请使用相同的语言撰写友好的、切中要点的邮件）。在 `User Message` 中传入表单获取的动态变量：\n  `姓名: {{ $json.name }}，预算: {{ $json.budget }}，具体需求: {{ $json.requirement }}。`\n  并在 Prompt 底部约束输出格式为包含 CSS 样式的轻量级压缩 HTML。\n* **步骤 10：连接 Gmail 节点发送富文本邮件**  \n  连接 `Gmail` 节点，操作选择 `Send Email`。收件人（To）动态绑定至前序表单节点的 Email 字段：`{{ $('Form Trigger').item.json.email }}`。将邮件格式选择为 `HTML`，内容绑定至 LLM 节点的输出结果。为了提供预约入口，可以在 HTML 模板的按钮中嵌入你在 [Cal.com](https://cal.com/) 配置好的个人预约链接。\n\n### 阶段三：构建 Level 3 向量数据库 RAG 知识检索系统\n\n> [!quote] RAG 核心原理\n> **RAG（检索增强生成）** 通过嵌入模型将企业文档切割压缩为数值向量存入 Pinecone。用户提问时，系统同样将问题向量化，与数据库进行 ==余弦相似度匹配==，只提取最相关的几百字作为\"事实依据\"喂给 LLM——既保证回答基于最新文档，又极大节约 Token 成本。\n\n* **步骤 11：在 Pinecone 中初始化向量索引**  \n  注册并登录 [Pinecone](https://www.pinecone.io/) 向量数据库平台。点击 `Create Index`：\n\n> [!warning] 维度一致性——最常见的踩坑点\n> **Dimension 必须设为 `768`**（与 Google `text-embedding-004` 的输出维度严格一致），否则后续向量检索将全部失败。\n  1. 索引名称填入 `n8n-test`。\n  2. 维度（Dimension）填入 `768`（必须与后续使用的 Google Embedding 004 模型的输出维度严格一致）。\n  3. 度量标准（Metric）选择 `Cosine`（余弦相似度）。\n  * 复制 Pinecone 生成的 API Key。\n* **步骤 12：创建知识库解析与向量化导入工作流**  \n  新建一个手动触发工作流：\n  1. 添加 `Google Drive` 节点，操作选择 `Download File`，选择你存放在云端盘里的公司业务说明书 PDF。\n  2. 连接 `Extract From File` 节点，配置提取模式为 `PDF`。\n  3. 连接 `Recursive Character Text Splitter`（递归字符文本拆分器）节点，用于对 PDF 提取的长文本进行分块，保持默认重叠参数。\n  4. 连接 `Pinecone Vector Store`（Pinecone 向量存储）节点。在节点下方连接 `Google Gemini Embedding` 模型，并将模型切换为 `text-embedding-004`，完成首次数据向量化导入。\n* **步骤 13：构建带 Pinecone 知识检索工具的 AI Agent**  \n  在主业务工作流中，添加 `AI Agent` 节点。配置其大语言模型为具备工具调用能力的 `gemini-2.0-flash-exp:free`。\n  1. 在 `Tools` 槽位，添加 `Vector Store Tool`。\n  2. 向量库连接刚才配置好的 Pinecone 节点与 Embedding 模型。\n  3. 在 Tool 的描述框中详细说明其作用：`此工具用于检索公司服务说明书文档，请在回答客户关于公司业务范围的问题时强制调用此工具。`\n\n### 阶段四：高阶联网实战——打造会前自动研究报告助理\n* **步骤 14：绑定 Webhook 会议预约触发源**  \n  在 n8n 中新建一个名为 `Meeting_Research_Agent` 的工作流。\n  1. 添加 `Webhook` 节点，Method 选择 `POST`。\n  2. 复制该 Webhook 的 `Test URL`。\n  3. 登录 Cal.com，进入 `Developer` -> `Webhooks` -> 点击 `Add`。\n  4. 在 `Subscriber URL` 中粘贴刚才复制的 n8n Webhook URL。事件勾选 `Booking Created`。\n* **步骤 15：设计子工作流或联网搜索工具 (Tavily AI)**  \n  在 Webhook 节点后接入 AI Agent。\n  1. 在 AI Agent 的 `Tools` 槽位，添加 `Workflow Tool` 节点（或使用 `HTTP Request` 自主向外部 API 发送请求）。若使用外部搜网引擎，可以接入 [Tavily AI](https://tavily.com/)。\n  2. 配置该网络搜索工具在被 Agent 调用时，向 Tavily 端点发送包含动态查询内容：`{{ $json.query }}` 的 POST 请求（配置细节参见关键配置区）。\n* **步骤 16：利用 Code 节点组装 HTML 邮件模板**  \n  为了避免 LLM 直接输出大块 HTML 时由于 Token 消耗产生幻觉或中断，在 Agent 节点后接一个 `Code` 节点。选择 `JavaScript` 运行模式，将上游 Agent 生成的纯文本分析结果，格式化嵌入到预先优化好的 CSS 卡片布局中（代码模版参见关键配置区）。\n* **步骤 17：最终 Gmail 投递与激活**  \n  连接 `Gmail` 节点，向公司团队内部邮箱发送\"会前客户研究报告\"。完成后点击保存，激活（Active）该工作流。\n\n# 关键配置\n\n* **Pinecone 向量数据库索引参数**：\n  * **索引名称 (Index Name)**：`n8n-test`\n  * **向量维度 (Dimension)**：`768`（基于 Google `text-embedding-004`）\n  * **检索量度 (Metric)**：`Cosine`\n* **Tavily 联网搜索引擎调用 JSON 体 (HTTP Request POST Payload)**：\n  ```json\n  {\n    \"query\": \"{{ $json.query }}\",\n    \"search_depth\": \"basic\",\n    \"include_answer\": true,\n    \"max_results\": 3\n  }\n  ```\n* **Tavily API 认证标头 (Headers)**：\n  * 配置项：`Authorization`\n  * 对应值：`Bearer YOUR_TAVILY_API_KEY`\n* **Code 节点格式化 HTML 的简易 JS 逻辑 (Code Node - JavaScript)**：\n  ```javascript\n  // 提取上游节点的纯文本报告，封装入 CSS 样式中\n  const rawReport = $input.first().json.output;\n  const htmlContent = `\n    <div style=\"font-family: Arial, sans-serif; padding: 20px; border: 1px solid #ddd; border-radius: 8px;\">\n      <h2 style=\"color: #4A90E2;\">会前客户深度研究报告<\/h2>\n      <div style=\"line-height: 1.6; color: #333;\">\n        ${rawReport.replace(/\\n/g, '<br>')}\n      <\/div>\n      <p style=\"margin-top: 20px; font-size: 12px; color: #999;\">报告由 HC_AI 智能分析系统自动生成<\/p>\n    <\/div>\n  `;\n  return { html: htmlContent };\n  ```\n\n# 命令速查\n\nn8n 系统常用的动态取值与调试表达式命令：\n\n```text\n# 强制提取特定前置节点的指定 JSON 字段（跨越中间节点限制）\n{{ $('Google Sheets').item.json.email }}\n\n# 在表达式中计算并格式化输出系统当前时间戳\n{{ new Date().toLocaleDateString() }}\n\n# 清理 AI 生成字串中可能存在的换行与反斜杠，转为干净的搜索词\n{{ $json.query.replace(/[\\n\\r\"]/g, \"\") }}\n```\n\n# 常见问题与踩坑\n\n* **Google Cloud 授权提示\"此应用未经验证\"安全警告**：\n  * *问题*：首次绑定 Google Sheets / Gmail 时，浏览器弹出红色危险警告。\n  * *原因*：项目在 Google Console 中处于 `Testing` 阶段，且未将其发布或验证。\n  * *解决*：这是正常现象。点击安全警告下方的\"高级\"（Advanced），选择\"转到 n8n（不安全）\"，即可完成本地测试授权绑定。\n* **通配符或字段带有空格导致 JS 表达式报错**：\n  * *问题*：前序节点产生的 Key 带有空格（例如：`First Name`），后续节点书写 `{{ $json.First Name }}` 发生解析错误。\n  * *原因*：JavaScript 词法解析器无法处理带有空格的属性引用。\n  * *解决*：必须改写为方括号加字串的标准引用方式：`{{ $json[\"First Name\"] }}`。并在平时建表时，尽量用下划线 `first_name` 或驼峰法命名 Key，避免使用空格。\n* **数据固定（Data Pinning）引发的历史脏数据干扰**：\n  * *问题*：修改表单逻辑后，运行测试发现处理的还是老测试数据。\n  * *原因*：前序节点开启了 `Pin Data`（固定数据），用于防止开发阶段重复调用外部接口。\n  * *解决*：开发调试完毕后，必须点击节点右上角的图钉图标解冻（Unpin），让真实的数据流通过。\n* **Tavily 网搜节点调用时提示 Rate Limit**：\n  * *问题*：多次测试 Agent 搜网时，HTTP Request 报错提示达到请求上限。\n  * *原因*：使用了免费的搜网 Key，或者 Agent 没有被限制最大搜网次数，导致陷入循环请求。\n  * *解决*：在 Agent 节点的 System Prompt 中，一定要加上指令级约束，例如：\"每次研究调用 search 搜网工具的次数绝对不能超过 3 次\"。\n\n# 底层原理\n\n* **n8n 如何实现免代码数据流转（JSON 核心）？**\n  n8n 的各个节点之间是通过 JSON（JavaScript 对象表示法）这一标准的键值对数据结构进行交换的。前序节点输出的 Table 结构，在进入下一个节点时，会被转换为包含多个大括号对象 `[ { \"key\": \"value\" } ]` 的 JSON 数组。通过表达式对这些大括号中的键名进行定位调用，即可达成无代码数据流动。\n* **RAG（检索增强生成）解决什么问题？如何与普通 Agent 结合？**\n  大语言模型的 Context Window（上下文窗口）有限，且存在知识过期的局限。RAG 通过预先使用嵌入模型（Embedding Model）将海量企业私有文档切割并压缩为固定维度的数值向量，存储到 Pinecone。当用户提问时，系统将用户提问同样向量化，并与向量数据库中的数据进行相似度匹配（余弦相似度计算），只提取出最相关的几百字作为\"事实依据\"，与用户问题一同喂给 LLM。这样既保证了 AI 能够依据公司最新文档回答，又极大地节约了 Token 成本。\n\n# 我的收获\n\n* **从确定性自动化走向自适应自动化**：传统的 Zapier 只是机械地搬运数据，而 n8n 配合 AI Agent 实现了让模型在执行过程中观察结果并自适应调整路径（如自动联网检索和自适应生成 HTML），大幅提升了低代码系统的能力边界。\n* **掌握前后端解耦的架构模式**：利用 n8n 的 Agent 专注于梳理和处理逻辑，而将展示排版（HTML/CSS）剥离给 Code 节点或固定模板，这种解耦思维对于构建长期稳定的企业级工作流极其关键。\n\n# 可执行行动\n\n1. 在 Google Cloud 开发者后台配置一组 OAuth Client 凭证，并在本地/云端 n8n 中配置 `Google Sheets` 读取与追加写入节点。\n2. 申请 Pinecone 免费账号，建立一个维度为 `768` 的 Cosine 索引，并新建一个 PDF 向量化上传测试工作流。\n3. 联动 Cal.com 或其他预约系统的 Webhook，实现预约创建后向个人微信/飞书/企业微信发送基础推送的链路调通。\n\n## 关联连接\n\n- [[n8n-masterclass]] — n8n 低代码自动化平台（本资料为该页面的原始来源）\n- [[n8n-agent-tutorial]] — n8n 草履虫入门教程（同一讲师体系的入门篇）\n- [[AI每日新闻]] — 用 n8n 搭建 AI Agent 的实操案例\n- [[LLM]] — 大语言模型核心概念\n- [[Memory]] — Agent 记忆机制\n- [[Tool_Use]] — 工具调用范式（Function Calling）\n- [[RAG]] — 检索增强生成\n- [[ReAct]] — 推理与行动结合的 Agent 范式\n- [[Claude_Code_Configuration]] — AI 代理配置体系对比\n","pm-course":"# 一句话总结\n\n本大纲解析了传统瀑布流项目生命周期（启动、规划、执行、监控、收尾）与现代敏捷（Agile/Scrum）框架，揭示了如何通过系统性的边界约束与动态纠偏，在有限资源下将独特创意转化为高价值交付物的核心路径。\n\n# 内容摘要\n\n该课程大纲由资深项目管理专家 Ivan（前 AIG 项目经理）讲授，梳理了项目管理（PM）从理论到实战的经典知识框架。大纲明确了项目与日常业务运营（BAU）的本质区别，将项目经理定位为临时性组织的最高责任人——\"项目的 CEO\"。内容细致剖析了项目生命周期的五大过程组：启动（Initiation - 奠定基础与验证想法）、规划（Planning - 精细设计时间与预算边界）、执行（Execution - 资源调配与团队激励）、监控（Monitoring & Control - 动态偏差管理）及收尾（Closure - 沉淀经验与专业闭环）；并在尾部引入了敏捷开发与 Scrum 敏捷实战框架，为应对高度不确定的现代业务交付提供了系统性视角。\n\n# 核心观点\n\n1. **项目与日常运营的本质区别在于其\"暂时性\"与\"独特性\"**：日常业务运营（BAU）追求持续与重复，而项目则是有明确起点、终点和特定目标边界的独特探索。\n2. **项目经理是项目的\"首席执行官（CEO）\"**：PM 不仅要对项目的\"铁三角\"（时间、范围、成本）负终极责任，更需要在临时性组织中扮演资源协调、团队激励与危机管理的决策中枢。\n3. **划分阶段性边界是降维解决复杂系统的核心手段**：通过启动（验证）、计划（量化）、执行（产出）、监控（反馈）和收尾（固化）的过程设计，将无序的目标梳理为有序的子任务递进，对抗执行过程中的熵增。\n4. **敏捷管理（Agile/Scrum）是应对快速变化场景的必然演进**：传统瀑布流适用于\"计划驱动\"的高确定性场景；而敏捷则以\"价值驱动\"为导向，以短周期迭代（Sprint）和敏捷反思机制应对VUCA环境中的黑天鹅风险。\n\n# 关键概念\n\n* **项目 vs BAU（Business As Usual，日常业务运营）**：BAU 具有持续性和重复性（如流水线装配），而项目具有临时性、目标导向性和独特性（如研发一款新车）。\n* **项目生命周期五大过程组（5 Process Groups）**：PMP 的核心知识框架。即启动（Initiation）、规划（Planning）、执行（Execution）、监控（Monitoring & Controlling）、收尾（Closing）。\n* **项目经理（Project Manager）作为 CEO**：将项目经理定位为临时性组织的最高决策与责任人，不仅关注\"做正确的事\"（启动与规划），也关注\"正确地做事\"（执行与监控）。\n* **敏捷（Agile）与 Scrum**：一种增量式、迭代式的敏捷管理框架，通常在软件开发中通过 Sprint（冲刺）、每日站会（Daily Standup）、冲刺回顾（Retrospective）等机制，用于在易变环境（VUCA）中快速交付并持续优化成果。\n\n# 底层逻辑\n\n* **为什么成立（项目管理存在的合理性）**：高复杂度、跨领域的宏大愿景无法通过自然的、非结构化的\"野生生长\"按时保质完成。项目管理通过建立人造的规则体系，将\"自由度\"限制在时间、成本、范围的铁三角之内，降低系统执行中的不确定性。\n* **解决什么问题**：解决资源有限性（时间、资金、人力）与交付目标无限性之间的矛盾，最大程度减少跨部门沟通摩擦与范围蔓延（Scope Creep）。\n* **背后的第一性原理：降维与反馈调节机制（Dimension Reduction & Feedback Loop）**：\n  * **降维原理**：将一个复杂的、未知的宏大目标，通过工作分解结构（WBS）和阶段流程降维成可计划、可量化的单一任务，降低大脑与团队的认知负载。\n  * **反馈回路**：通过监控（瀑布流中的偏差纠正）和敏捷回顾（Scrum 中的 Retrospective）建立闭环反馈，确保系统在外界噪音干扰下自动恢复到预定轨道。\n\n# 思维模型\n\n* **约束铁三角模型（Triple Constraint Triangle）**：任何项目的管理都受限于\"范围、时间和成本\"的制约。改变其中一个，必须调整另外两个，以维持三角形平衡。\n* **分治模型（Divide and Conquer）**：将复杂的交付生命周期划分为 5 个清晰阶段。每个阶段有其特定输入、工具与输出（ITTO），不进行无序的跨阶段操作。\n* **敏捷反馈环模型（Iterative Feedback Model）**：放弃一次性交付完美产品的幻想，以最小可行产品（MVP）进行持续的验证、反馈与纠偏。\n\n# 我的
