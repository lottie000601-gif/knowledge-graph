收获\n\n1. **重新定位 PM 的权责边界**：优秀的项目经理不是简单的进度追踪器（Progress Tracker），而是协调资源冲突、进行危机公关和设定团队愿景的\"临时性CEO\"。\n2. **重估\"收尾（Closure）\"的复盘价值**：收尾并非简单地把文档归档，更是通过总结\"经验教训（Lessons Learned）\"，将项目的隐性知识（Tacit Knowledge）固化为企业/个人未来可复用的显性资产。\n\n# 知识关联\n\n* **AI & Agent**：\n  * *原因*：现代 AI Agent 具备复杂的、长周期的自主执行能力（如 Claude Code、n8n 自动化流）。\n  * *关联*：一个成熟的 Multi-Agent 系统本质上就是一个虚拟的项目团队。主 Agent 扮演\"项目经理（PM）\"负责任务拆解（WBS）、监控资源（Token 开销）和纠偏，而子 Agent 扮演\"执行者\"。在设计长链路 Agent 架构时，可完美参考 PM 生命周期的 5 阶段模型（如：启动时的 System Prompt 对齐、规划时的任务步骤拆解、运行时的状态监控和收尾时的 Memory 归档）。\n* **MCP (Model Context Protocol)**：\n  * *原因*：MCP 允许大模型在受限、安全的接口（Tool）下操作外部数据库和系统。\n  * *关联*：这对应了项目管理中的\"权责分级与约束管理（Governance）\"。大模型在项目中拥有决策权，但其操作边界（范围与权限）受到 MCP 这一安全护栏（Guardrail）的制约。\n* **自动化 (Automation)**：\n  * *原因*：流程自动化（如 n8n 工作流）用于加速可预期、结构化的任务。\n  * *关联*：项目管理中的 BAU（日常运营）部分应被彻底自动化，而项目（独特的、需动态推理的决策部分）则由人工与 AI 共同完成。自动化系统可以将项目监控（如进度提醒、超期预警）变成零人工参与的无缝流。\n* **Prompt Engineering**：\n  * *原因*：Prompt 的设计是为了让大模型更稳定地输出结果。\n  * *关联*：这类似于项目启动时的\"项目章程（Project Charter）\"或规划时的\"需求说明书（Requirements Document）\"。提示词给出的角色定义、任务、约束、输入输出规则，就是项目经理向开发团队（大模型）下达的绝对指令。\n* **产品 & 商业 (Product & Business)**：\n  * *原因*：产品开发往往通过项目形式承载，并在商业轨道上验证价值。\n  * *关联*：启动阶段（Initiation）中对\"想法的验证与可行性分析\"就是商业分析（Business Case）与产品经理验证 PMF（产品市场契合度）的重合点。\n* **知识管理 & 学习方法 (Knowledge Management & Learning Methods)**：\n  * *原因*：个人学习与知识库积累也可以被视作一个长周期的项目。\n  * *关联*：使用 PM 的收尾（Closure）理念，在读完一本书、写完一段代码、结项一个研究后，强制进行结构化复盘、提炼底层认知并沉淀至双链笔记系统（如 Obsidian），这就是个人知识管理的\"Lessons Learned 积累\"。\n\n# 值得长期记忆的洞见\n\n* 大项目并非大任务的简单堆砌，而是把时间、成本、范围的**边界约束逻辑化**的系统性运作。唯有主动建立监控与反馈闭环，才能对抗物理学上的温和熵增。\n\n# 质疑与局限\n\n* **作者的前提假设**：作者假设项目团队具备基本的执行素养和清晰的顶层授权（即 PM 真的具备\"CEO\"般的跨部门调配权）。\n* **适用场景**：传统 PM 五大过程组适用于高确定性、重工业、基建、大型传统软件等变更成本昂贵的场景。\n* **不适用场景**：高度混乱、极速变化、前沿科学探索或初创企业极度早期的 PMF 验证阶段，此时严格的项目文档和监控不仅无法防范风险，反而会成为阻碍创新的繁文缛节（Bureaucracy）。\n\n# 是否值得长期保存\n\n* **保存价值**：**中高**。\n* **原因**：虽然视频本身是课程大纲及基础理论介绍，但其所展现的传统瀑布五大过程组与敏捷 Scrum 的横向划分，是建立通用\"项目化思维方式\"的最佳参考骨架。无论对于整理个人工作流，还是未来设计 AI 编排引擎，项目管理学都是无价的结构化范式。\n","skills":"## 核心摘要\n\nB站 UP 主 Terminator-AI 从 ClawHub 上数万个 Skills 中精选出 15 个实用 Skills，按六大类别分类讲解：进化类（让 AI 越用越聪明）、开发必备（GitHub/Super Powers/Waza）、信息获取（多引擎搜索/浏览器操控/多格式总结）、效率办公（Google 全家桶/Notion/Obsidian）、安全维护（安全检查/自动更新）和蒸馏类（人设模拟/八字排盘）。核心观点：Skills 的价值不在于装得多，在于用起来。\n\n## 六大类别详情\n\n### 1. 进化类\n- **Self-Improving Agent** — 记录 AI 的错误和失败，下次遇到类似场景先翻阅记录，让 AI 越用越聪明\n- **Proactive Agent** — 让 AI 从被动响应变为主动执行，支持定时任务（如每天早上 9 点竞品监控）和自动流程（如提交代码自动生成变更摘要）\n\n### 2. 开发必备\n- **GitHub Skill** — 让 Claude Code 直接在对话中操作 GitHub 全流程：创建分支、提 PR、处理 Issue、查 CI 状态\n- **Super Powers** — 由 JesseVincent 开发的 TDD 强制开发流程：先梳理需求/设计拆分，再写测试后写代码，适合中大型团队项目\n- **Waza** — 由 tw93 开发的轻量工程规范工具，涵盖代码风格约定、提交信息格式、文档模板，适合个人开发者\n\n### 3. 信息获取\n- **Multi-Search-Engine** — 同时搜索多个搜索引擎并将结果聚合后再回答，解决单一来源偏见问题\n- **Agent Browser** — 基于 Playwright 操控真实浏览器：点击链接、填写表单、截图、抓取页面内容\n- **Summarize** — 多格式内容总结：网页、PDF、图片、音频、视频，适合快速消化长文档和框架文档\n\n### 4. 效率办公\n- **GOG** — Google Workspace 自动化工具，支持 Gmail、Drive、Docs 等服务的批量操作\n- **Notion Skill** — 读写 Notion 页面和数据库，可用于周报自动化、笔记整理、知识库查询\n- **Obsidian Skill** — 在 Obsidian 知识库中搜索、创建、修改笔记，支持双向链接操作\n\n### 5. 安全维护\n- **Skill-Vetter** — 安装任何新 Skill 前先进行安全检查：审核权限申请、检测可疑代码、查询已知风险\n- **Auto-Updater** — 自动更新所有已安装 Skills，但有高权限的 Skill 建议手动更新\n\n### 6. 蒸馏类\n- **Dot-Skill**（原名 colleague-skill）— 将人的对话记录/文档/邮件喂养生成 AI 模拟体，支持三种类型：同事（工作能力复刻）、人际关系（前任/伴侣/父母）、名人（乔布斯/马斯克等公众人物），支持飞书/钉钉/Slack/微信聊天记录/PDF/邮件等数据源\n- **Bazi-Skill** — 基于传统命理学的八字排盘工具，参照九本经典命理典籍进行排盘分析\n\n## 推荐安装顺序\n\n1. **Skill-Vetter**（安全打底）→ 2. **Self-Improving Agent**（让 AI 长记性）→ 3. 按需补充 GitHub/Summarize/Agent Browser/Multi-Search-Engine 等\n\n## 关联连接\n\n- [[ClawHub]] — Claude Code Skills 市场平台\n- [[Claude_Code]] — Claude Code 产品本身\n- [[AI_Skill_Distillation]] — AI 技能蒸馏概念\n- [[Claude]] — Claude 模型家族\n","workbuddy-tutorial":"## 核心摘要\n\nB站 UP 主「大梁Max」的 60 分钟保姆级教程，系统性讲解国产桌面 Agent 产品 **WorkBuddy**（被定位为 Codex 的国内平替版）的全部核心功能。WorkBuddy 是在本机可直接操作文件、浏览器与各种软件的 AI Agent，特点是无需代理、无需复杂配置、积分制运行、对新手极度友好。\n\n视频从「新手三设置」（存盘路径、对话风格、生成对话记忆）入手，依次拆解：单次对话 vs 项目（工作空间）对话、执行/问答/计划三模式、增强提示词、办公/开发/设计三场景模板，以及左上角功能区的**专家、专家团、技能（Skill）、连接器（MCP）**四大能力，外加助理（IM 挂接）、项目（团队协作）、自动化（定时任务）与积分体系。\n\n## 核心要点\n\n### 定位与用法心法\n- WorkBuddy 本身是 Agent（智能体）架构，真正\"思考/干活\"的是其背后的大模型（腾讯混元、智谱 GLM、Kimi、DeepSeek、MiniMax 等），Agent 负责调度编排。\n- 关键心法：**「能用工作空间就用工作空间」**——把 Agent 放进某个项目文件夹（类比\"办公室\"），它才会读取该文件夹内的资料作为上下文，回答又快又准；否则如同把员工扔到大马路上，AI 对业务一无所知。\n\n### 三层任务模式\n| 模式 | 行为 | 适用 |\n|------|------|------|\n| 执行（默认） | 直接读取、分析并写文件 | 简单、意图明确的活 |\n| 问答模式（Ask） | 只能看不能碰电脑，仅对话 | 先聊清思路、联网查资料、避免 AI 盲目执行 |\n| 计划模式（Plan） | 先规划、反问确认、产出执行方案，批准后才开工 | 复杂/抽象/多步骤任务 |\n\n### 能力四层模型（专家 / 技能 / 连接器）\n- **专家**：带人设 + 专业知识库、会调用 Skill/工具的 Agent，回答\"谁来干活\"。实测有专家 vs 无专家差异显著：通用模型 48 秒给普通选题；专家调取知识库深度思考 4 分 15 秒，产出\"主推选题 + 标题矩阵 + 筛选心法\"。\n- **专家团**：围绕业务场景组合多个专家、由\"主理人\"统筹调度的多 Agent 团队（如数据分析专家团 = 数据编排师 + 数据科学工程师 + 可视化分析师 + SQL/知识检索架构师）。同任务实测：单专家产出普通 Excel，专家团约 27 分钟产出可视化仪表盘 + 结构化综合报告 + 行动建议。\n- **技能（Skill）**：给 AI 规定的一套做事流程/SOP，回答\"怎么干活\"。支持显性调用（手动装载）与隐性调用（AI 识别意图自动触发，非 100%）；也支持把对话中跑通的流程直接\"做成技能\"。\n- **连接器**：即 MCP，打通飞书/钉钉/网盘/邮箱等第三方应用，让 Agent 能读取和操作外部软件（\"给 AI 装上手脚\"）。\n\n### 自动化与团队协作\n- **自动化**：用自然语言描述（如\"每天上午十点自动领取优惠券\"）即可生成定时任务；支持周期/间隔/单次，可删除、暂停、测试运行，并内置大量模板。\n- **项目**（团队协作层，区别于\"空间\"）：可邀请成员、建任务看板、指派计划、共享\"资产\"云盘——本机文件仅自己可见，沉淀的资产全队可见。\n\n## 关联连接\n\n- [[WorkBuddy]] — 本资料的实体主角\n- [[Skill]] — 技能机制详解（显性/隐性调用、流程技能化）\n- [[多Agent工作流]] — 专家团是\"主理人 + 专家\"编排的产品化形态\n- [[Claude_Code]] — 同类 AI 编程/操作代理（终端形态）\n- [[OpenCode]] — 同类桌面 AI 编码代理（开源）\n","workflow":"## 核心摘要\n\n知名视频制作团队影视飓风（Media Storm）分享了 2024 至 2026 年间其工作流的 AI 化迭代。核心思路是**将 AI 定位为\"牵引工具\"而非替代品**——AI 辅助前期策划（选题调研、AI 生成参考视频）、中期设备管理和后期制作（AI 语音模型、AI 抠像、AI 视频生成作为特效补充），但核心拍摄和最终成片仍由真人主导。团队建立了内部 AI 分享文化，并将 AI 工作流严格分为\"AI 主导\"（仅短片组试点）和\"AI 辅助\"（全频道通用）两类。\n\n## AI 工作流全景\n\n```mermaid\ngraph TB\n    subgraph 前期\n    A[选题<br/>AI 选题机器人] --> B[策划<br/>AI 生成参考视频]\n    end\n    subgraph 中期\n    C[设备管理<br/>二维码自动出入库] --> D[拍摄<br/>真人实景]\n    end\n    subgraph 后期\n    E[数据备份<br/>4000TB 存储阵列] --> F[AI 辅助制作]\n    F --> G1[AI 语音模型<br/>节奏参考/甲方审片]\n    F --> G2[Corridor Key<br/>AI 一键抠像]\n    F --> G3[AI 视频生成<br/>特效补充方案]\n    end\n    subgraph 复盘\n    H[数据中台<br/>含潘量分析] --> I[AI 分享会<br/>内部交流]\n    end\n\n    前期 --> 中期 --> 后期 --> 复盘\n```\n\n## 核心框架：AI 主导 vs AI 辅助\n\n> [!quote] 影视飓风的原则\n> \"AI 主导工作流目前只有短片组在用，别的部门都不允许。大部分频道内容我们还在坚持**手工古法打造**，AI 工具只在工作流里给我们一些**辅助**。\"\n\n| 维度 | AI 主导 | AI 辅助 |\n|------|---------|---------|\n| 适用范围 | 短片组（试点） | 全部频道 |\n| 角色定位 | AI 作为主要创作者 | AI 作为效率工具 |\n| 典型用例 | AI 短片、AI 电影节作品 | 语音模型做参考、AI 抠像、选题调研 |\n| 人工参与度 | 低（策展式创作） | 高（手工为主，AI 提速） |\n\n## AI 在各个环节的具体应用\n\n### 1. 选题环节\n- 飞书 OpenCloud 部署选题机器人，主动搜索全网有趣内容\n- 提出选题后，AI 自动搜集针对性信息、生成封面\n- 效果：选题群全员参与，频道留存率和浏览量均有提升\n\n### 2. 策划环节 —— **AI Pre-vis（预可视化）**\n- 传统流程：文字 → 图像 → 拍摄 → 视频 → 剪辑\n- **新流程**：文字 → AI 直接生成视频 → 拍摄 → 视频 → 剪辑\n- 在策划阶段先用 AI 生成参考视频，团队围绕它落地执行\n- 消除信息差和沟通成本，\"AI 目前起到的是**牵引**的作用\"\n\n### 3. 拍摄环节\n- 设备管理自动化：二维码扫码出入库，类似快递驿站\n- ==4000TB== 数据中心：1000TB 固态 + 320 块 12TB 磁带\n- 水下录音系统：大疆 Mic3 + 3D 打印配件装进潜水全面罩\n\n> [!tip] 设备数据洞察\n> 影视飓风使用最多的设备是 **1-2 万元微单**，反而是几十万的高端设备（ALEXA35、RED）在吃灰。防水壳等高投入小众设备反而 ROI 最高，因为实拍稀缺画面的现实意义是 AI 无法替代的。\n\n### 4. 后期制作\n\n#### AI 语音模型\n- 自训练语音模型生成 Tim 的声音用作节奏参考\n- 剪辑师可在此基础上整理框架，甲方可用此版本审片\n- ==定稿后再真人录音==，避免反复补录\n\n#### Corridor Key（AI 抠像）\n- Corridor Digital 推出的免费开源 AI 抠像软件\n- 一键抠图：头发、透明物体、复杂场景全部自动抠\n- [Corridor Key](https://corridordigital.com/) — 强烈推荐\n\n#### AI 视频生成\n- 作为拍摄和特效的**补充方案**\n- 专门开发内部网页整合 AI 视频生成流程\n- 以前渲染数周的内容现在可快速生成\n\n### 5. 数据分析与复盘\n- **数据中台**岗位专门收集节目上线后反馈\n- 多维表格 + AI 自动生成可视化仪表盘\n- **含潘量指标**：分析 Tim 在片头出现时间和留存率的关系\n- AI 分享会：内部交流 AI 应用成果\n\n## 核心理念\n\n> [!important] 影视飓风的 AI 立场\n> 1. AI **没有踹开门**，但已在慢慢改变流程和想法\n> 2. 实拍稀缺画面（如大白鲨）的质感 AI 无法替代\n> 3. \"要对抗焦虑的唯一办法就是**去试一下**\"\n> 4. 先用起来，再不断迭代和进步\n\n## 关联连接\n\n- [[AI_Led_vs_AI_Assisted]] — AI 主导 vs AI 辅助工作流框架\n- [[Corridor_Key]] — AI 开源抠像工具\n- [[Obsidian]] — 知识管理与 AI 协作\n- [[Claude_Code_Configuration]] — AI 代理配置体系\n- [[n8n-agent-tutorial]] — 飞书机器人实战\n- [[skills]] — Skills 扩展生态\n","Agent":"# AI Agent 全面理解\n\n## 什么是 AI Agent\n\nAI Agent（智能体）是一个具备**自主决策能力**的 AI 系统，它不仅能理解用户意图，还能自行规划步骤、调用工具、执行行动，并根据结果反思调整。与传统的自动化工作流不同，Agent 的路径不是预先硬编码的，而是由大模型根据具体输入动态生成的。\n\n### Agent vs 自动化工作流\n\n| 维度 | 自动化工作流 | AI Agent |\n|------|-------------|----------|\n| 执行方式 | 固定步骤（A → B → C） | 动态推理，自主决策 |\n| 规则来源 | 人预先编码 | 大模型根据上下文实时规划 |\n| 工具调用 | 按固定顺序执行 | 根据任务需求自主选择工具 |\n| 适应性 | 无，每次运行路径相同 | 有，能应对输入变化和异常 |\n| 错误处理 | 按预设分支处理 | 自主反思并修正 |\n\n## Agent 的五大核心能力\n\n### 1. 规划（Planning）\nAgent 能够将复杂目标拆解为可执行的子任务序列：\n```\n目标 → 子任务1 → 子任务2 → 子任务3 → ... → 完成\n```\n这种任务分解能力使得 Agent 可以处理远超单次 LLM 调用能力的复杂工作。\n\n### 2. 工具调用（Tool Use）\nAgent 自主决定使用什么工具来完成任务。常见工具包括：\n- 搜索引擎（Google、Tavily）\n- 数据库查询（SQL、向量检索）\n- 浏览器操控（Playwright）\n- API 调用（飞书、Gmail、Slack）\n- 代码执行器\n\n工具调用的本质是将外部能力抽象为\"函数\"，让 LLM 通过 Function Calling 机制按需调用。\n\n### 3. 记忆（Memory）\nAgent 需要记住历史信息来维持连贯的交互：\n- **短期记忆**：当前会话的上下文，用于保持对话连贯\n- **长期记忆**：跨会话持久化存储，保存用户偏好、历史决策等\n\n### 4. 反思（Reflection）\nAgent 能评估自己的输出质量，发现结果不佳时主动修正：\n- 检查执行结果是否符合预期\n- 识别错误并重新尝试\n- 从失败中学习并调整策略\n\n### 5. 推理（Reasoning）\nAgent 使用大模型的推理能力来做出决策，包括：\n- 判断当前应该使用哪个工具\n- 分析工具返回的结果\n- 决定是否需要更多信息\n\n## Agent 的三大组件架构\n\n任何 Agent 无论多么复杂，都遵循同一底层架构：\n\n```mermaid\ngraph LR\n    B[大脑 Brain<br/>LLM 推理核心] --> M[记忆 Memory<br/>上下文存储]\n    B --> T[工具 Tools<br/>外部能力]\n    M --> B\n    T --> B\n```\n\n1. **大脑（Brain）**：大语言模型，负责推理、规划、语言生成\n2. **记忆（Memory）**：让 Agent 记住之前的信息和交互\n3. **工具（Tools）**：Agent 与外部世界互动的方式\n\n## Agent 的实现层次\n\n### 简单优先原则\n能用提示词解决的，就不用工作流；能用工作流解决的，就不用 Agent；单 Agent 能解决的，就不必用多 Agent。复杂度应该与任务需求匹配。\n\n### 从简单到复杂的演进路径\n1. **Prompt 增强**：在提示词中定义角色、工具和行为规则\n2. **ReAct 循环**：实现\"思考→行动→观察\"的循环框架\n3. **单 Agent 系统**：一个 Agent 完成完整任务链\n4. **Agent + 执行器**：Agent 只负责决策，n8n 等工具负责稳定执行（[[Agent_n8n_Backend]]）\n5. **多 Agent 工作流**：多个 Agent 分工协作（[[多Agent工作流]]）\n\n## 关联连接\n\n- [[LLM]] — 大语言模型：Agent 的大脑\n- [[Memory]] — 记忆机制：Agent 的记忆组件\n- [[Tool_Use]] — 工具调用：Agent 的行动能力\n- [[ReAct]] — 推理与行动范式：Agent 的核心框架\n- [[RAG]] — 检索增强生成：Agent 获取外部知识的手段\n- [[Prompt_Engineering]] — 提示工程：Agent 行为设计的底层方法论\n- [[Agent_n8n_Backend]] — Agent + n8n 后端执行器架构\n- [[多Agent工作流]] — 多 Agent 协作架构模式\n","n8n工作流搭建":"# 工作流搭建方案对比与推荐\n\n## 问题背景\n\n在 AI Agent 时代，搭建自动化工作流有多种技术路线可选。核心问题在于如何平衡 **开发效率、运行成本、安全性、可维护性** 四个维度，尤其是在需要维护多个工作流时，不同方案的边际成本差异巨大。\n\n## 四种搭建路径一览\n\n```mermaid\ngraph TB\n    subgraph \"方案\"\n    A[\"① 纯 n8n 手动拖拽\"] \n    B[\"② Claude Code + n8n MCP ⭐\"]\n    C[\"③ Claude Code + Obsidian\"]\n    D[\"④ 纯 AI Agent ❌\"]\n    end\n    subgraph \"适合场景\"\n    A1[\"复杂精细控制\"] \n    B1[\"多工作流 / 固定重复任务\"]\n    C1[\"个人知识管理 + 日程\"]\n    D1[\"（不推荐）\"]\n    end\n    A --> A1\n    B --> B1\n    C --> C1\n    D --> D1\n```\n\n## 方案详细对比\n\n### 方案一：纯 n8n 手动拖拽\n\n| 维度 | 评估 |\n|------|------|\n| **优点** | 超过 1000 种内置连接器（[[n8n-masterclass]]）；所有 Credential 封装在 n8n 内部；执行几乎零 Token 成本；调试精确到每个节点 |\n| **缺点** | 需手动拖拽节点、配置 OAuth、理解 JSON 数据结构，学习曲线不低 |\n| **适合** | 已熟悉 n8n 的用户，或流程极其复杂需要精细控制的场景 |\n\n### 方案二：Claude Code / OpenCode + n8n MCP ⭐（强烈推荐）\n\n社区公认的最佳实践（[[Agent_n8n_Backend]]）：\n\n> \"把固定性的流程编排成 n8n 工作流，与智能体结合使用，是目前社区普遍最认可的方式。\"\n\n**核心架构**：AI Agent 作为前端编排层负责决策，n8n 作为后端执行器负责固定流程执行，通过 MCP 协议通信。\n\n| 对比维度 | 纯 AI Agent | AI Agent + n8n |\n|---------|------------|----------------|\n| Token 消耗 | 每次执行灾难级消耗 | 仅创建工作流时消耗，执行几乎免费 |\n| 密钥安全 | API Key 直接暴露给 Agent | Credential 封装在 n8n 中 |\n| 错误调试 | 黑盒难定位 | 精确到节点，直观可调试 |\n| 重复任务 | 每次重新推理 | 一次封装反复执行 |\n| 新增工作流 | 每次都从头消耗 Token | 说一句话 AI 自动生成 |\n\n### 方案三：Claude Code + Obsidian\n\n适用于个人效率场景（[[claude-code-obsidian-workflow]]）：\n\n- 无需 n8n，直接在 Markdown 上操作\n- AI 自动维护日程看板、整理笔记、提供提醒\n- 日报等固定流程封装为 Skill，一个命令触发整套工作流\n\n### 方案四：纯 AI Agent（不推荐 ❌）\n\n三大问题（[[Agent_n8n_Backend]]）：\n1. **Token 消耗灾难级**——每天让 Agent 重复执行固定流程，每次都要完整推理\n2. **密钥安全风险**——API Key 直接暴露给第三方 Agent\n3. **错误调试困难**——黑盒难定位\n\n## 多工作流场景的边际成本分析\n\n当需要维护 N 条工作流时，不同方案的成本差异呈指数级放大：\n\n| 成本项 | 纯 n8n 拖拽 | Claude Code + n8n MCP ⭐ | 纯 AI Agent ❌ |\n|--------|------------|------------------------|---------------|\n| 搭建第 1 条 | 高（手搓） | 中（环境搭建 10 分钟） | 低（说句话就行） |\n| 搭建第 N 条 | 依旧高 | **零额外配置** | 每次一样高 |\n| 日常执行 | 免费 | **免费** | 灾难级 Token |\n| 密钥风险 | 安全 | **安全** | 风险随 N 线性增长 |\n| 出错维护 | 人工查 | **AI 自动修** | 黑盒难定位 |\n\n> 结论：工作流越多，方案二的优势越明显。**一条工作流省 Token 不算什么，五条十条工作流每天执行的差距就是天壤之别。**\n\n## 执行路线图（方案二）\n\n来自 [[claude-code-n8n-agent-integration]] 和 [[n8n-masterclass]] 的实操步骤：\n\n### 环境搭建（一次性，约 10 分钟）\n\n**第 1 步 —— 安装 n8n（Docker 推荐）**\n在n8n电脑路径下创建compose.yaml文件\n```yaml\n# compose.yaml\nversion: '3.8'\nservices:\n  n8n:\n    image: n8nio/n8n\n    ports:\n      - \"5678:5678\"\n    volumes:\n      - ./n8n-data:/home/node/.n8n\n      - ./files:/files\n    environment:\n      - N8N_ENCRYPTION_KEY=your-encryption-key\n      - N8N_SKIP_WEBHOOK_DEREGISTRATION=true\n```\n```bash\ndocker-compose up -d\n```\n\n**第 2 步 —— n8n 初始化配置**\n- 访问 `http://localhost:5678`\n- Settings → n8n API → **创建 API Key**（用于 MCP 认证）\n- 左上角 + → Credential → **配置 AI 模型的 API Key**\n\n**第 3 步 —— 配置 Claude Code**\n```bash\nexport ANTHROPIC_BASE_URL=\"https://api.openrouter.ai/anthropic\"\nexport ANTHROPIC_AUTH_TOKEN=\"your_api_key\"\nexport ANTHROPIC_API_KEY=\"your_api_key\"\nexport ANTHROPIC_MODEL=\"google/gemini-2.0-flash-exp\"\n```\n\n**第 4 步 —— 安装 n8n Skills + MCP**\n- 从 GitHub 克隆 n8n Skills 仓库，复制到 `~/.claude/skills/`\n- 在 `~/.claude.json` 中添加 n8n MCP 配置，填入 N8N API Key\n\n### 日常使用（每次只需说一句话）\n\n**创建第一个工作流：**\n```\n请帮我创建一个 n8n 工作流\"AI论文情报站\"：\n1. 从 Google DeepMind RSS 获取最新论文\n2. AI 翻译整理\n3. 格式化并保存到内置数据表格\nCredential ID: xxxxx\n```\n\n**创建工作流完成后验证执行：**\n- 在 n8n 网页打开工作流，点击执行\n- 如报错，复制错误信息发给 Claude Code，AI 自动修复\n\n**追加第二个工作流（零额外配置）：**\n```\n再创建一条工作流，每天早8点爬取 Hacker News 热榜 Top 10。\n```\n\n## 最终建议\n\n| 你的场景 | 推荐方案 |\n|---------|---------|\n| **固定重复性任务**（日报、爬虫、信息聚合） | **Claude Code + n8n MCP** |\n| **需要维护 3 条以上工作流** | **Claude Code + n8n MCP** |\n| **个人知识管理 + 日程** | Claude Code + Obsidian |\n| **一次性复杂流程** | 先用 n8n 手动搭，再接入 Agent |\n\n> 一句话总结：**用 Claude Code 做决策、说人话；用 n8n 做执行、省 Token。一次配置，无限扩展。**\n\n## 关联连接\n\n- [[Agent_n8n_Backend]] — AI Agent + n8n 后端执行器架构模式\n- [[claude-code-n8n-agent-integration]] — Claude Code 自动编排 n8n 工作流\n- [[n8n-masterclass]] — n8n 低代码自动化平台\n- [[Claude_Code]] — Claude Code 产品\n- [[OpenCode]] — 开源 AI 编码代理替代方案\n- [[claude-code-obsidian-workflow]] — Claude Code + Obsidian 个人工作流\n- [[Claude_Code_Configuration]] — Claude Code 配置架构\n- [[n8n-agent-tutorial]] — n8n 草履虫入门教程\n- [[AI_Led_vs_AI_Assisted]] — AI 主导 vs AI 辅助框架\n","prompt":"## 提示词模板\n\n```markdown\n## Character\n你是一位知识管理专家，擅长将碎片信息转化为结构化、可执行的 Markdown 笔记。你熟悉 Obsidian、Notion、Logseq 等工具的双向链接、标签和 Frontmatter 规范。\n\n## Cause\n目标：将用户提供的信息转化为高质量的 Markdown 格式知识笔记，便于个人知识库管理和后续检索。\n\n## Constraint\n- 输出必须是有效的 Markdown 格式\n- 必须包含 YAML Frontmatter（title, type, tags, source, last_updated）\n- 使用中文撰写，除非原文是非中文\n- 包含\"## 关联连接\"区块，使用 [[页面名称]] 格式链接相关概念\n- 知识存在冲突时，标注\"## 知识冲突\"区块保留不同观点\n- 避免空泛的总结，聚焦可执行、可链接的核心信息\n\n## Contingency\n如果信息不完整或模糊：\n1. 基于已有信息进行合理整理，在笔记中标注\"（需验证）\"\n2. 列出需要补充的关键信息点\n3. 提供笔记模板框架供用户后续填充\n\n如果信息是原始素材（如网页剪藏、聊天记录）：\n1. 提炼核心主旨（3-5 句话）\n2. 提取关键术语和概念\n3. 标注信息来源和时间戳\n\n## Calibration\n输出前自检：\n- [ ] Frontmatter 是否完整且规范？\n- [ ] 是否包含至少 2 个[[双向链接]]？\n- [ ] 内容是否具体而非泛泛而谈？\n- [ ] 是否存在知识冲突？如有，是否已标注？\n- [ ] 输出是否可以独立理解（不需要额外上下文）？\n```\n\n## 设计理念\n\n本提示词基于 [[5C_Framework]] 设计，遵循以下核心原则：\n\n| 原则 | 实现 |\n|------|------|\n| **极简结构** | 5 个组件清晰分工，避免过度复杂 |\n| **Token 高效** | 约 150 tokens 输入，适合高频使用 |\n| **内置质量控制** | Calibration 组件强制自检 |\n| **容错设计** | Contingency 组件处理边界情况 |\n\n## 使用示例\n\n### 输入\n```\n我本周末读了一篇关于\"深度工作\"的文章，作者是 Cal Newport。\n文章讲现在人太容易分心，需要大块不被打扰的时间来做有深度的工作。\n作者说每天应该有 4 小时深度工作时间，关闭通知，设定固定时间查看邮件。\n```\n\n### 预期输出\n```markdown\n---\ntitle: \"深度工作 - Cal Newport\"\ntype: concept\ntags: [生产力, 专注力, 时间管理]\nsource: Cal Newport 文章\nlast_updated: 2026-04-12\n---\n\n## 核心定义\n深度工作（Deep Work）是指在无干扰状态下进行的专注职业活动，\n能将认知能力推向极限。Cal Newport 认为这是知识经济时代最有价值的能力之一。\n\n## 关键实践\n- **4 小时法则**：每天安排 4 小时不受打扰的深度工作时间\n- **断连策略**：关闭所有通知，在固定时段统一处理邮件和消息\n- **环境设计**：创造物理和心理上的\"深度工作仪式\"\n\n## 关联连接\n- [[注意力经济]] — 为什么现代工作环境容易产生分心\n- [[番茄工作法]] — 另一种时间管理技术\n```\n\n## 适用场景\n\n- 网页剪藏后快速整理为知识笔记\n- 会议纪要的结构化记录\n- 读书笔记的标准化输出\n- 零散灵感的即时归档\n\n## 变体建议\n\n根据具体需求，可以调整以下组件：\n\n```markdown\n## 变体 1：学术论文笔记（增强 Character）\nCharacter: 你是一位学术研究助理，擅长提取论文的核心贡献、\n方法论和局限。熟悉引用规范（APA/MLA/GB）。\n\n## 变体 2：项目文档（增强 Constraint）\nConstraint:\n- 必须包含\"## 决策记录\"区块\n- 标注每个决策的提出者和时间\n- 包含\"## 待办事项\"用于后续跟进\n```\n\n## 关联连接\n- [[5C_Framework]] — 本提示词的框架基础\n- [[Prompt_Engineering]] — 提示工程总览\n","知识库建设蓝图":"### 1. 明确从 raw 到 wiki 的内化流水线（Pipeline）\n\n由于您有 01-articles、02-papers 和 03-transcripts，日常会有源源不断的外部信息输入。建议建立一个标准的工作流：\n\n1. **收集（Raw）**：将未读或刚剪藏的文章、论文直接丢进 raw/ 对应子目录下，保持其原始状态，不轻易修改。\n    \n2. **渐进式总结（Sources & Syntheses）**：\n    \n    - 读完一篇 raw 论文后，在 wiki/sources 下建一个同名笔记，记录该文献的提炼、高亮和个人想法。\n        \n    - 如果多篇论文都在讨论同一个前沿方向，在 wiki/syntheses 下撰写一篇主题合成笔记。\n        \n3. **沉淀知识点（Concepts & Entities）**：\n    \n    - 从 wiki/sources 或 syntheses 中提取出通用的理论（如 RAG.md、Memory.md），放入 wiki/concepts。\n        \n    - 提取出具体的工具或模型（如 LangChain.md、LlamaIndex.md），放入 wiki/entities。\n        \n    - **关键操作**：在 concepts 和 entities 的笔记底部，用双链链接回 wiki/sources 中的原始出处，保证知识有据可查。\n        \n\n---\n\n### 2. 严格区分 concepts（概念）与 entities（实体）\n\n保持这两个文件夹的边界清晰，能极大减轻知识库后期的维护压力：\n\n- **concepts（概念/方法论）**：解决“**是什么/为什么**”的问题。它是抽象的、不易随时间失效的（如：Vector_Database.md、Semantic_Search.md）。\n    \n- **entities（实体/工具）**：解决“**用什么/谁做的**”的问题。它是具体的、会更新迭代的（如：Pinecone.md、Milvus.md、OpenAI.md）。\n    \n\n例如：\n\n- 在 concepts/RAG.md 中，提及可以使用向量数据库。\n    \n- 在 entities/Pinecone.md 中，注明它是一个向量数据库，并链接到 [[Vector_Database]]（位于 concepts 目录）。\n    \n\n---\n\n### 3. 发挥 wiki/mocs（内容地图）的枢纽作用\n\n随着 concepts 和 entities 的笔记越来越多，直接阅读文件夹会变得困难。mocs 是您的导航仪：\n\n- 建议针对大主题建立 MOC。例如建立一个 AI_Agent_MOC.md，在里面用结构化的文本将我们刚刚建立的笔记串联起来：\n    \n    codeMarkdown\n    \n    ```\n    # AI Agent 知识地图\n    \n    ## 核心理论与架构\n    - 底层大脑：[[LLM]]\n    - 核心架构：[[ReAct]]\n    \n    ## 核心组件\n    - 记忆机制：[[Memory]]\n    - 行动能力：[[Tool_Use]]\n    - 知识检索：[[RAG]]\n    ```\n    \n- 这样，您可以通过 MOC 快速俯瞰整个领域的全景，而不需要在成百上千个孤立的笔记中迷失。\n    \n\n---\n\n### 4. 深度结合 AI 插件（Claudian/Copilot）与 MCP\n\n您的目录中出现了 MCP（Model Context Protocol，模型上下文协议）和 copilot。这是一个极大的优势：\n\n- **制定统一的 AI 提示词模版**：  \n    在让 Claude 帮您整理笔记时，可以提供一个固定的 System Prompt 或 Template。例如，告诉 AI：“当我让你总结一个 AI 技术概念时，请严格按照【一句话总结】、【核心思想】、【核心要素/步骤】、【关联双链】的格式输出。” 这样能保证您 concepts 下的笔记格式高度一致。\n    \n- **利用 MCP 赋能 AI**：  \n    如果您正在配置 MCP 相关的本地服务，可以尝试使用 **Obsidian MCP Server**。这样，您可以直接在外部的 Claude 客户端（如 Claude Desktop）中，让 AI 读取、搜索、甚至直接往您的 wiki/concepts 写入新笔记，实现本地知识库与 AI 能力的无缝双向连接。\n    \n\n---\n\n### 5. 引入轻量级元数据（YAML Frontmatter）以支持 Dataview\n\n如果您在 Obsidian 中安装了 Dataview 插件，建议为 concepts 和 entities 引入简单的 YAML 元数据。例如，在每个 concept 笔记的最上方添加：\n\ncodeYaml\n\n```\n---\ntype: concept\ntags: [AI/LLM, System_Architecture]\nstatus: seed # seed (萌芽), growing (构建中), evergreen (常青)\ncreated: 2026-06-09\n---\n```\n"}};</script>

  const cv = document.getElementById("c");

  /* ═══════════ 布局：Fruchterman-Reingold，一次算到收敛 ═══════════
     上一版用「斥力按 1/d² + alpha 冷却」，结果全挤成一团、还甩出一个离群点。
     FR 的 1/d 斥力 + 温度限幅不会塌，且每步位移有上限，跑不出离群节点。 */
  const K = 128;        // 理想边长

    const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);

  function runLayout(iters, t0){
    let t = t0;
    const disp = N.map(function(){ return {x:0, y:0}; });

    for (let it = 0; it < iters; it++){
      for (let i = 0; i < N.length; i++){ disp[i].x = 0; disp[i].y = 0; }

      // 斥力：k²/d
      for (let i = 0; i < N.length; i++){
        const a = N[i];
        for (let j = i + 1; j < N.length; j++){
          const b = N[j];
          let dx = a.x - b.x, dy = a.y - b.y;
          let d = Math.sqrt(dx * dx + dy * dy) || 0.01;
          const f = (K * K) / d, ux = dx / d, uy = dy / d;
          disp[i].x += ux * f; disp[i].y += uy * f;
          disp[j].x -= ux * f; disp[j].y -= uy * f;
        }
      }
      // 引力：d²/k
      for (let e = 0; e < E.length; e++){
        const a = N[E[e][0]], b = N[E[e][1]];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d = Math.sqrt(dx * dx + dy * dy) || 0.01;
        const g = (d * d) / K, ux = dx / d, uy = dy / d;
        disp[a.i].x -= ux * g; disp[a.i].y -= uy * g;
        disp[b.i].x += ux * g; disp[b.i].y += uy * g;
      }
      // 向心 + 温度限幅
      for (let i = 0; i < N.length; i++){
        const a = N[i];
        if (a.fixed) continue;
        disp[i].x -= a.x * GRAV;
        disp[i].y -= a.y * GRAV;
        const m = Math.sqrt(disp[i].x * disp[i].x + disp[i].y * disp[i].y) || 0.01;
        const lim = Math.min(m, t);
        a.x += disp[i].x / m * lim;
        a.y += disp[i].y / m * lim;
      }
      t *= 0.985;
      if (t < 0.35) break;
    }
  }

  // 初始位置：确定性伪随机（每次打开同一张图，便于对比）
  (function init(){
    const pR = 190;
    N.forEach(function(n, i){
      const a = seed(i) * Math.PI * 2, r = pR * Math.sqrt(0.15 + seed(i + 91) * 0.85);
      n.x = Math.cos(a) * r; n.y = Math.sin(a) * r;
    });
    runLayout(700, 150);
  })();

  /* ═════════════════════════ 视图自适应 ═════════════════════════ */
  function fit(animate){
    // 可视区躲开左上角 HUD 和底部工具条，别让图压在文字上
    const margin = 36;                       // 屏幕像素，缩放后固定
    const ax0 = 300, ax1 = W - 44, ay0 = 34, ay1 = H - 66;
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    N.forEach(function(n){
      if (n.x < x0) x0 = n.x; if (n.x > x1) x1 = n.x;
      if (n.y < y0) y0 = n.y; if (n.y > y1) y1 = n.y;
    });
    let k = Math.min((ax1 - ax0 - margin * 2) / (x1 - x0),
                     (ay1 - ay0 - margin * 2) / (y1 - y0));
    k = Math.max(.3, Math.min(2.3, k));
    const cx = (ax0 + ax1) / 2, cy = (ay0 + ay1) / 2;
    const tx = cx - (x0 + x1) * k / 2, ty = cy - (y0 + y1) * k / 2;
    if (!animate){ view.k = k; view.x = tx; view.y = ty; return; }
    const k0 = view.k, x0v = view.x, y0v = view.y, t0 = performance.now();
    (function step(now){
      let p = Math.min(1, (now - t0) / 420); p = 1 - Math.pow(1 - p, 3);
      view.k = k0 + (k - k0) * p;
      view.x = x0v + (tx - x0v) * p;
      view.y = y0v + (ty - y0v) * p;
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  /* ═════════════════════════ 交互 ═════════════════════════ */
  let hover = -1, active = -1;
  let drag = null, panning = false;

  const SX = n => n.x * view.k + view.x;
  const SY = n => n.y * view.k + view.y;
  const rad = n => 3.6 + Math.sqrt(n.deg) * 1.6;

  function nodeAt(mx, my){
    let best = -1, bd = 1e9;
    for (let i = 0; i < N.length; i++){
      const dx = SX(N[i]) - mx, dy = SY(N[i]) - my;
      const d = dx * dx + dy * dy;
      const r = rad(N[i]) * view.k + 8;
      if (d < r * r && d < bd){ bd = d; best = i; }
    }
    return best;
  }

  cv.addEventListener("mousemove", function(ev){
    const mx = ev.clientX, my = ev.clientY;
    if (drag){
      if (panning){
        view.x += mx - drag.x; view.y += my - drag.y;
        drag.x = mx; drag.y = my;
      } else {
        const n = N[drag.i];
        n.x += (mx - drag.x) / view.k;
        n.y += (my - drag.y) / view.k;
        drag.x = mx; drag.y = my;
        drag.moved = true;
      }
      return;
    }
    const h = nodeAt(mx, my);
    if (h !== hover){
      hover = h;
      cv.classList.toggle("hot", h >= 0);
      peek(h);
    }
  });

  cv.addEventListener("mousedown", function(ev){
    const h = nodeAt(ev.clientX, ev.clientY);
    if (h >= 0){
      drag = { i:h, x:ev.clientX, y:ev.clientY, moved:false };
      N[h].fixed = true;
    } else {
      panning = true;
      drag = { x:ev.clientX, y:ev.clientY };
    }
    cv.classList.add("drag");
  });

  window.addEventListener("mouseup", function(ev){
    if (!drag) return;
    const moved = Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y);
    if (!panning && drag.i != null){
      N[drag.i].fixed = false;
      if (drag.moved){
        runLayout(60, 18);                 // 局部重新收拢，别让拖走的点扯着不放
      }
      if (moved < 5) open(drag.i);
    }
    drag = null; panning = false;
    cv.classList.remove("drag");
  });

  cv.addEventListener("wheel", function(ev){
    ev.preventDefault();
    const mx = ev.clientX, my = ev.clientY;
    const wx = (mx - view.x) / view.k, wy = (my - view.y) / view.k;
    let k = view.k * Math.exp(-ev.deltaY * 0.0016);
    k = Math.max(.25, Math.min(3.6, k));
    view.k = k;
    view.x = mx - wx * k; view.y = my - wy * k;
  }, { passive:false });

  document.getElementById("bfit").addEventListener("click", function(){ fit(true); });

  /* ═════════════════════════ 渲染 ═════════════════════════ */
  function neighbors(i){
    const s = {}; s[i] = true;
    ADJ[i].forEach(function(j){ s[j] = true; });
    return s;
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);

    const focus = hover >= 0 ? hover : (active >= 0 ? active : -1);
    const near = focus >= 0 ? neighbors(focus) : null;

    for (let e = 0; e < E.length; e++){
      const a = N[E[e][0]], b = N[E[e][1]];
      const inFocus = near && near[a.i] && near[b.i];
      ctx.beginPath();
      ctx.moveTo(SX(a), SY(a)); ctx.lineTo(SX(b), SY(b));
      if (near && !inFocus){
        ctx.strokeStyle = "rgba(48,54,61,0.22)"; ctx.lineWidth = .6;
      } else if (inFocus){
        const direct = (a.i === focus || b.i === focus);
        ctx.strokeStyle = direct ? "rgba(160,170,182,0.80)" : "rgba(88,166,255,0.42)";
        ctx.lineWidth = direct ? 1.5 : 1.2;
      } else {
        ctx.strokeStyle = "rgba(48,54,61,0.80)"; ctx.lineWidth = .7;
      }
      ctx.stroke();
    }

    const zoomed = view.k >= 1.5;
    const vis = new Array(N.length);

    for (let i = 0; i < N.length; i++){
      const n = N[i];
      const r = rad(n) * view.k;
      const dim = near && !near[i];
      vis[i] = !dim;

      if (i === focus && !dim){
        ctx.beginPath(); ctx.arc(SX(n), SY(n), r + 8 * view.k, 0, 6.2832);
        ctx.fillStyle = SEC[n.sec].color + "22"; ctx.fill();
      }
      ctx.beginPath(); ctx.arc(SX(n), SY(n), r, 0, 6.2832);
      ctx.globalAlpha = dim ? .24 : 1;
      ctx.fillStyle = SEC[n.sec].color; ctx.fill();
      if (i === focus && !dim){ ctx.strokeStyle = "#0b0d10"; ctx.lineWidth = 1.7; ctx.stroke(); }
      ctx.globalAlpha = 1;
    }

    /* 标签：按优先级贪心排布，压到的直接省略——比硬堆上去可读得多 */
    const taken = [];
    for (let i = 0; i < N.length; i++){
      if (!vis[i]) continue;
      const r = rad(N[i]) * view.k + 2, x = SX(N[i]), y = SY(N[i]);
      taken.push([x - r, y - r, x + r, y + r]);
    }

    const cands = [];
    for (let i = 0; i < N.length; i++){
      const n = N[i];
      if (!vis[i]) continue;
      const isNb = near && near[i] && i !== focus;
      if (!(i === focus || isNb || zoomed || n.deg >= 5)) continue;
      cands.push({ i:i, pri:(i === focus ? 0 : isNb ? 1 : 2), deg:n.deg, nb:isNb });
    }
    cands.sort(function(a, b){ return a.pri - b.pri || b.deg - a.deg; });

    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let c = 0; c < cands.length; c++){
      const i = cands[c].i, n = N[i];
      const fs = Math.max(9.5, Math.min(13, 12 / Math.max(.75, view.k * .78)));
      ctx.font = (i === focus ? "600 " : "") + fs.toFixed(1) +
        'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';

      const x = SX(n), ly = SY(n) + rad(n) * view.k + fs * .95;
      const w = ctx.measureText(n.title).width;
      const box = [x - w / 2 - 2, ly - fs * .72, x + w / 2 + 2, ly + fs * .72];

      let hit = false;
      for (let t = 0; t < taken.length; t++){
        const q = taken[t];
        if (box[0] < q[2] && box[2] > q[0] && box[1] < q[3] && box[3] > q[1]){ hit = true; break; }
      }
      if (hit && i !== focus) continue;        // 悬停/选中的那个一定要标出来
      taken.push(box);

      ctx.lineWidth = 3.8; ctx.strokeStyle = "rgba(11,13,16,0.94)";
      ctx.strokeText(n.title, x, ly);
      ctx.fillStyle = (i === focus || cands[c].nb) ? "#e6edf3" : "#98a2ad";
      ctx.fillText(n.title, x, ly);
    }
  }

  let raf = 0;
  (function loop(){
    draw();
    raf = requestAnimationFrame(loop);
  })();

  /* ═════════════════════════ HUD ═════════════════════════ */
  document.getElementById("stats").textContent =
    N.length + " 个知识页 · " + E.length + " 条互链";

  (function legend(){
    const c = {};
    N.forEach(n => { c[n.sec] = (c[n.sec] || 0) + 1; });
    const box = document.getElementById("legend");
    ORDER.forEach(function(k){
      if (!c[k]) return;
      const d = document.createElement("div");
      d.innerHTML = '<i style="background:' + SEC[k].color + '"></i>' +
        SEC[k].label + " " + SEC[k].zh + ' <b>' + c[k] + '</b>';
      box.appendChild(d);
    });
  })();

  const peekEl = document.getElementById("peek");
  function peek(i){
    if (i < 0){ peekEl.classList.remove("on"); return; }
    const n = N[i];
    peekEl.innerHTML = n.title + "<em>" + SEC[n.sec].label + " · " + n.deg + " 条互链</em>";
    peekEl.classList.add("on");
  }

  /* ═════════════════════════ Markdown 渲染 ═════════════════════════ */
  function esc(s){
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(s){
    const code = [];
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, function(_, c){ code.push(c); return "\uE000" + (code.length - 1) + "\uE001"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/!\[\[([^\]\|]+)\]\]/g, function(_, t){
      return '<span class="dead">[附件 ' + t.trim() + "]</span>";
    });
    s = s.replace(/\[\[([^\]\|]+)(?:\|([^\]]+))?\]\]/g, function(_, t, alias){
      const leaf = t.trim().split("/").pop().replace(/\.md$/, "");
      const label = (alias || t.trim().split("/").pop()).trim();
      return IDX[leaf]
        ? '<a class="wl" data-t="' + leaf + '">' + label + "</a>"
        : '<span class="dead">' + label + "</span>";
    });
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\uE000(\d+)\uE001/g, function(_, i){ return "<code>" + code[+i] + "</code>"; });
    return s;
  }

  function splitRow(r){
    return r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  }
  const isRow = x => /^\s*\|.*\|\s*$/.test(x);
  const isSep = x => /^\s*\|[\s:|-]+\|\s*$/.test(x);
  const isUL  = x => /^\s*[-*+]\s+/.test(x);
  const isOL  = x => /^\s*\d+\.\s+/.test(x);
  const isHR  = x => /^\s*(-{3,}|\*{3,})\s*$/.test(x);

  function renderMD(md){
    const L = md.split(/\r?\n/), out = [];
    let i = 0;

    while (i < L.length){
      const ln = L[i];
      if (!ln.trim()){ i++; continue; }

      if (/^```/.test(ln)){
        const buf = []; i++;
        while (i < L.length && !/^```/.test(L[i])){ buf.push(L[i]); i++; }
        i++;
        out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
        continue;
      }
      let m = ln.match(/^(#{1,6})\s+(.*)$/);
      if (m){ out.push("<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"); i++; continue; }
      if (isHR(ln)){ out.push("<hr>"); i++; continue; }

      if (/^\s*>/.test(ln)){
        const q = [];
        while (i < L.length && /^\s*>/.test(L[i])){ q.push(L[i].replace(/^\s*>\s?/, "")); i++; }
        out.push("<blockquote>" + q.map(x => x.trim() ? "<p>" + inline(x) + "</p>" : "").join("") + "</blockquote>");
        continue;
      }

      if (isRow(ln) && i + 1 < L.length && isSep(L[i + 1])){
        const head = splitRow(ln); i += 2;
        const rows = [];
        while (i < L.length && isRow(L[i])){ rows.push(splitRow(L[i])); i++; }
        let t = "<table><thead><tr>" + head.map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>";
        rows.forEach(function(r){
          t += "<tr>" + head.map((_, ci) => "<td>" + inline(r[ci] || "") + "</td>").join("") + "</tr>";
        });
        out.push(t + "</tbody></table>");
        continue;
      }

      if (isUL(ln) || isOL(ln)){
        const ordered = isOL(ln);
        const items = [];
        while (i < L.length && (isUL(L[i]) || isOL(L[i]))){
          items.push(L[i].replace(/^\s*(?:[-*+]|\d+\.)\s+/, "")); i++;
        }
        const tag = ordered ? "ol" : "ul";
        out.push("<" + tag + ">" + items.map(x => "<li>" + inline(x) + "</li>").join("") + "</" + tag + ">");
        continue;
      }

      const p = [];
      while (i < L.length && L[i].trim() && !/^#{1,6}\s/.test(L[i]) && !/^```/.test(L[i]) &&
             !/^\s*>/.test(L[i]) && !isRow(L[i]) && !isUL(L[i]) && !isOL(L[i]) && !isHR(L[i])){
        p.push(L[i]); i++;
      }
      if (p.length) out.push("<p>" + inline(p.join(" ")) + "</p>");
    }
    return out.join("\n");
  }

  /* ═════════════════════════ 内容面板 ═════════════════════════ */
  const panel = document.getElementById("panel");
  const pbody = document.getElementById("pbody");
  const ptitle = document.getElementById("ptitle");
  const psec = document.getElementById("psec");

  function open(i){
    const n = N[i];
    active = i;

    psec.textContent = SEC[n.sec].label;
    psec.style.color = SEC[n.sec].color;
    ptitle.textContent = n.title;

    pbody.innerHTML = renderMD(BODIES[n.id] || "_（正文未导出）_");
    pbody.scrollTop = 0;
    panel.classList.add("open");
  }
  function close(){
    panel.classList.remove("open");
    active = -1;
  }

  document.getElementById("pclose").addEventListener("click", close);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") close(); });

  pbody.addEventListener("click", function(e){
    const a = e.target.closest("a.wl");
    if (!a) return;
    const n = IDX[a.dataset.t];
    if (!n) return;
    const k = Math.max(view.k, 1.1);
    view.k = k;
    view.x = W / 2 - n.x * k;
    view.y = H / 2 - n.y * k;
    open(n.i);
  });

  /* ═════════════════════════ 启动 ═════════════════════════ */
  resize();
  fit(false);
  requestAnimationFrame(function(){ fit(true); });

  // 自检用：#focus=<节点id> 预置悬停态 · #open=<节点id> 直接展开（也方便直接分享某个节点）
  (function presets(){
    const q = {};
    location.hash.replace(/^#/, "").split("&").forEach(function(p){
      const s = p.indexOf("=");
      if (s > 0) q[p.slice(0, s)] = decodeURIComponent(p.slice(s + 1));
    });
    if (q.focus && IDX[q.focus]){
      hover = IDX[q.focus].i;
      peek(hover);
    }
    if (q.open && IDX[q.open]){
      const n = IDX[q.open];
      view.k = 1.15;
      view.x = W / 2 - n.x * view.k;
      view.y = H / 2 - n.y * view.k;
      open(n.i);
    }
  })();
})();
</script>
</body>
</html>
